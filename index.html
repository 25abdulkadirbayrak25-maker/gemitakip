<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#0b1f33" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Gemi Tersane Takip</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B1F33">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --navy:#0b1f33;--navy2:#13314c;--orange:#ea7317;--orange2:#c2560a;--amber:#f59e0b;
  --bg:#eef1f5;--card:#fff;--line:#e2e8f0;--line2:#cbd5e1;
  --t1:#1e293b;--t2:#475569;--t3:#64748b;--t4:#94a3b8;
  --green:#16a34a;--greenD:#15803d;--blue:#2563eb;--blueD:#1d4ed8;--red:#dc2626;--redD:#b91c1c;--slate:#64748b;--slateD:#475569;
}
html,body{font-family:'IBM Plex Sans',system-ui,sans-serif;background:var(--bg);color:var(--t1);overscroll-behavior:none;}
body{padding-bottom:env(safe-area-inset-bottom);}
.fd{font-family:'Archivo',sans-serif;}
.fm{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;font-size:16px;}
img{display:block;}
.wrap{max-width:920px;margin:0 auto;padding:0 14px;}
.hide{display:none!important;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px;}
@keyframes fadeup{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.an-up{animation:fadeup .26s ease both}.an-pop{animation:pop .16s ease both}

/* Header */
header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;}
.hd-l{display:flex;align-items:center;gap:12px;min-width:0;}
.logo{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:rgba(234,115,23,.16);border:1px solid rgba(234,115,23,.4);flex-shrink:0;}
.hd-title{font-weight:700;font-size:17px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hd-sub{font-size:11px;color:#cbd5e1;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.icon-btn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.08);flex-shrink:0;}
main{padding:18px 0 40px;}

/* Cards & common */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 2px rgba(0,0,0,.03);}
.hero{border-radius:18px;padding:22px;color:#fff;background:linear-gradient(120deg,var(--navy2),var(--navy));margin-bottom:18px;position:relative;overflow:hidden;}
.hero .lbl{font-family:'IBM Plex Mono';font-size:11px;letter-spacing:3px;color:#cbd5e1;margin-bottom:4px;}
.hero .big{font-family:'IBM Plex Mono';font-weight:700;font-size:46px;color:var(--amber);line-height:1;}
.hero .day{font-family:'Archivo';font-weight:600;font-size:18px;color:#e2e8f0;}
.hero .sd{font-size:13px;color:#cbd5e1;margin-top:5px;}
.btn{border-radius:12px;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 16px;transition:filter .15s,transform .1s;}
.btn:active{transform:scale(.98);}
.btn-orange{background:var(--orange);color:#fff;}
.btn-navy{background:var(--navy);color:#fff;}
.btn-green{background:var(--greenD);color:#fff;}
.btn-ghost{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;}
.btn-out{background:#fff;border:1px solid var(--line2);color:var(--t2);}
.btn[disabled]{opacity:.6;pointer-events:none;}
.svg{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block;flex-shrink:0;}

/* Calendar */
.cal-top{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #f1f5f9;}
.cal-nav{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--t2);}
.cal-nav:active{background:#f1f5f9;}
.cal-month{font-family:'Archivo';font-weight:700;text-transform:capitalize;text-align:center;}
.cal-today{font-size:11px;color:var(--blue);}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;font-weight:600;color:var(--t4);font-family:'IBM Plex Mono';padding:8px 8px 0;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:8px;}
.cal-cell{height:60px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid transparent;position:relative;}
.cal-cell:active{transform:scale(.95);}
.cal-cell .d{font-family:'IBM Plex Mono';font-size:14px;font-weight:600;color:#334155;}
.cal-cell .g{font-family:'IBM Plex Mono';font-size:9px;font-weight:700;margin-top:2px;padding:0 3px;border-radius:3px;color:var(--navy);background:rgba(11,31,51,.07);}
.cal-cell.out{opacity:.35;}
.cal-cell.today{background:rgba(234,115,23,.1);border-color:var(--orange);}
.cal-cell.today .d{color:var(--orange2);}
.cal-cell.has{background:#f8fafc;border-color:var(--line);}
.cal-cell .ms{font-size:9px;font-weight:700;margin-top:1px;line-height:1;padding:1px 3px;border-radius:3px;}
.cal-cell.ms-start{border-color:#16a34a;}
.cal-cell.ms-ddin,.cal-cell.ms-ddout{border-color:#7c3aed;}
.cal-cell.ms-end{border-color:#0ea5e9;}
.ms-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:8px;}
.dot-rep{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--green);}
.cal-legend{display:flex;flex-wrap:wrap;gap:14px;padding:12px 14px;border-top:1px solid #f1f5f9;font-size:11px;color:var(--t3);}
.cal-legend span{display:flex;align-items:center;gap:6px;}
.note{text-align:center;font-size:12px;color:var(--t4);margin-top:16px;padding:0 14px;}

/* Day view */
.back{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--t2);font-weight:500;margin-bottom:12px;}
.daybox{padding:12px 14px;margin-bottom:10px;}
.daychips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.dchip{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--t2);font-size:12.5px;font-weight:600;}
.dchip.on{border-color:#bfdbfe;background:#eff6ff;color:#1d4ed8;}
.dchip.hot{border-color:var(--navy);background:var(--navy);color:#fff;}
.dchip.warn{border-color:#fde68a;background:#fffbeb;color:#b45309;}
.strip{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid;border-radius:11px;margin-bottom:8px;font-size:12.5px;font-weight:600;}
.strip .sbtn{flex-shrink:0;color:#fff;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;}
.strip .sbtn.ghost{background:transparent;border:1px solid currentColor;}
.day-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.badge{font-family:'IBM Plex Mono';font-size:12px;font-weight:700;padding:4px 10px;border-radius:8px;}
.badge-navy{background:var(--navy);color:#fff;}
.badge-orange{background:rgba(234,115,23,.12);color:var(--orange2);}
.day-title{font-family:'Archivo';font-weight:700;font-size:19px;text-transform:capitalize;margin-top:4px;line-height:1.2;}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:16px;}
@media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr);}}
.stat{border-radius:12px;padding:10px 12px;border:1px solid var(--line);}
.stat.dark{background:var(--navy);border-color:var(--navy);}
.stat .sl{font-size:10px;font-weight:600;color:var(--t3);display:flex;align-items:center;gap:5px;}
.stat.dark .sl{color:#cbd5e1;}
.stat .sv{font-family:'IBM Plex Mono';font-weight:700;font-size:19px;margin-top:3px;}
.stat.dark .sv{color:#fff;}
.dotc{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.pbar{height:8px;border-radius:8px;background:#f1f5f9;overflow:hidden;margin-top:12px;}
.pbar>i{display:block;height:100%;border-radius:8px;background:var(--green);}
.pct{font-family:'IBM Plex Mono';font-size:11px;color:var(--t4);text-align:right;margin-top:4px;}
.row-h{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 8px;}
.row-h .t{font-family:'Archivo';font-weight:700;color:var(--t2);display:flex;align-items:center;gap:8px;}

/* Job item */
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.03);}
.item .bar{width:6px;flex-shrink:0;}
.item .body{flex:1;text-align:left;padding:12px;min-width:0;}
.item .body:active{background:#f8fafc;}
.item .row1{display:flex;gap:8px;align-items:flex-start;}
.item .num{font-family:'IBM Plex Mono';font-size:14px;font-weight:700;color:var(--t4);margin-top:1px;width:22px;flex-shrink:0;}
.item .ti{font-weight:600;line-height:1.3;}
.item .meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-top:6px;}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600;border:1px solid;}
.mtag{font-size:12px;color:var(--t3);display:flex;align-items:center;gap:4px;}
.mtag.job{color:var(--t2);font-weight:500;}
.pchip{font-family:'IBM Plex Mono';font-size:12px;font-weight:700;padding:2px 6px;border-radius:5px;color:var(--navy);background:rgba(11,31,51,.08);}
.item .acts{display:flex;align-items:center;padding-right:8px;gap:2px;flex-shrink:0;}
.item .col{flex:1;min-width:0;display:flex;flex-direction:column;}
.item .colrow{display:flex;align-items:stretch;}
.item .stagebar{display:flex;flex-wrap:wrap;gap:8px;padding:2px 12px 12px;}
.schip{display:inline-flex;align-items:center;gap:7px;border-radius:999px;min-height:40px;padding:8px 14px;font-size:13px;font-weight:600;border:1px solid;line-height:1.15;max-width:100%;transition:transform .1s;}
.schip:active{transform:scale(.94);}
.schip .sdot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.schip .sck{font-size:13px;font-weight:800;flex-shrink:0;line-height:1;}
.schip .snm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px;}
.item .promise{display:flex;align-items:center;gap:8px;margin:0 12px 12px;padding:8px 10px;border-radius:10px;background:#ecfdf5;border:1px solid #bbf7d0;font-size:12.5px;color:#166534;}
.item .promise button{margin-left:auto;flex-shrink:0;background:#16a34a;color:#fff;font-weight:700;border-radius:8px;padding:8px 12px;font-size:12.5px;}
.item .prev{margin-top:7px;font-size:12px;line-height:1.45;color:var(--t3);border-left:2px solid var(--line);padding-left:8px;}
.item .prev b{display:block;font-weight:700;color:var(--t4);font-size:10px;letter-spacing:.4px;text-transform:uppercase;margin-bottom:1px;}
.act{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--t4);}
.act:active{background:#f1f5f9;}
.empty{border:1px dashed var(--line2);border-radius:18px;padding:48px 24px;text-align:center;background:#fff;}
.empty p{color:var(--t3);font-weight:500;margin-top:10px;}
.empty .s{font-size:14px;color:var(--t4);margin-top:4px;}

/* Modals */
.ov{position:fixed;inset:0;z-index:40;background:rgba(11,31,51,.55);display:flex;align-items:flex-end;justify-content:center;}
@media(min-width:640px){.ov{align-items:center;padding:16px;}}
.sheet{background:#fff;width:100%;max-width:540px;border-radius:18px 18px 0 0;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 -4px 30px rgba(0,0,0,.2);}
@media(min-width:640px){.sheet{border-radius:18px;}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #f1f5f9;flex-shrink:0;}
.sheet-h .t{font-family:'Archivo';font-weight:700;font-size:18px;}
.sheet-b{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;display:flex;flex-direction:column;gap:16px;flex:1 1 auto;min-height:0;}
.sheet-b>*{flex-shrink:0;}
.sheet-f{display:flex;align-items:center;gap:8px;padding:14px 16px;border-top:1px solid #f1f5f9;flex-shrink:0;}
.fld>span{font-size:12px;font-weight:600;color:var(--t3);display:block;margin-bottom:6px;}
.in{width:100%;border:1px solid var(--line2);border-radius:12px;padding:12px;outline:none;background:#fff;}
.in:focus{border-color:var(--slateD);box-shadow:0 0 0 3px #e2e8f0;}
textarea.in{resize:vertical;min-height:78px;}
.err{font-size:12px;color:var(--red);margin-top:4px;display:block;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.photo-add{width:100%;border:2px dashed var(--line2);border-radius:12px;padding:16px;font-weight:600;color:var(--t2);display:flex;align-items:center;justify-content:center;gap:8px;}
.photo-add:active{background:#f8fafc;}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;}
.pthumb{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:1;background:#f1f5f9;border:1px solid var(--line);}
.pthumb.psel{border-color:var(--orange);box-shadow:0 0 0 2px rgba(234,115,23,.35);}
.pthumb .pchk{position:absolute;left:5px;top:5px;width:24px;height:24px;border-radius:7px;border:2px solid #fff;background:rgba(0,0,0,.38);color:#fff;font-size:14px;font-weight:800;display:grid;place-items:center;z-index:2;cursor:pointer;}
/* Havuz: tüm kare seçim alanı + büyük onay işareti */
.poolgrid .pthumb{cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
.poolgrid .pchk{left:6px;top:6px;width:34px;height:34px;border-radius:10px;font-size:19px;background:rgba(0,0,0,.45);pointer-events:none;}
.poolgrid .pthumb.psel{border-color:var(--orange);box-shadow:0 0 0 3px rgba(234,115,23,.45);}
.poolgrid .pthumb.psel img{opacity:.72;}
.poolgrid .pthumb .zoom{position:absolute;right:6px;bottom:6px;width:32px;height:32px;border-radius:9px;background:rgba(0,0,0,.5);color:#fff;display:grid;place-items:center;z-index:3;border:none;cursor:pointer;}
.pthumb.psel .pchk{background:var(--orange);border-color:#fff;}
.pthumb img{cursor:pointer;}
.pthumb img{width:100%;height:100%;object-fit:cover;}
.pthumb .rm{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;background:rgba(220,38,38,.92);color:#fff;display:grid;place-items:center;}
.tip{font-size:11px;color:var(--t4);margin-top:8px;}
.range{flex:1;height:6px;border-radius:6px;accent-color:var(--orange);}
.pqr{display:flex;gap:6px;margin-top:8px;}
.pqr button{flex:1;border-radius:9px;padding:7px 0;font-size:12px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--t2);}
.pqr button.on{background:var(--navy);color:#fff;border-color:var(--navy);}
.del{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;color:var(--red);border:1px solid #fecaca;flex-shrink:0;}
.del:active{background:#fef2f2;}

/* Detail */
.dh-strip{height:5px;flex-shrink:0;}
.sec-l{font-size:12px;font-weight:600;color:var(--t4);margin-bottom:4px;}
.detail-meta{display:flex;flex-wrap:wrap;align-items:center;gap:12px;}
.desc{white-space:pre-wrap;line-height:1.6;color:var(--t1);}
.desc.muted{color:var(--t4);font-style:italic;font-size:14px;}
.dg2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.dg2 button{border-radius:10px;overflow:hidden;aspect-ratio:4/3;background:#f1f5f9;border:1px solid var(--line);}
.dg2 img{width:100%;height:100%;object-fit:cover;}

/* Progress view */
.phero{border-radius:18px;padding:20px;color:#fff;background:linear-gradient(120deg,var(--navy2),var(--navy));margin-bottom:16px;}
.phero h2{font-family:'Archivo';font-size:21px;}
.phero p{font-size:13px;color:#cbd5e1;margin-top:3px;}
.jobcard{width:100%;text-align:left;padding:16px;display:flex;gap:12px;align-items:flex-start;margin-bottom:8px;}
.jobcard:active{background:#f8fafc;}
.jc-ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:rgba(234,115,23,.12);flex-shrink:0;margin-top:2px;}
.jc-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.jc-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.jc-meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-size:12px;color:var(--t3);}
.jc-pbar{display:flex;align-items:center;gap:8px;margin-top:8px;}
.jc-pbar>div{flex:1;height:8px;border-radius:8px;background:#f1f5f9;overflow:hidden;}
.jc-pbar i{display:block;height:100%;border-radius:8px;}
.tl{padding-left:4px;}
.tl-item{position:relative;padding-left:28px;}
.tl-dot{position:absolute;left:6px;top:8px;width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 4px var(--bg);}
.tl-line{position:absolute;left:11px;top:20px;bottom:0;width:2px;background:var(--line);}
.tl-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.03);}
.tl-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}

/* Lightbox */
.lb{position:fixed;inset:0;z-index:60;background:rgba(11,31,51,.92);display:grid;place-items:center;padding:16px;}
.lb img{max-width:100%;max-height:100%;border-radius:10px;}
.lb .x{position:absolute;top:16px;right:16px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;display:grid;place-items:center;}

/* Toast */
/* ===== PDF / yazdırma görünümü ===== */
#print-area{display:none;}
@media print{
  @page{size:A4;margin:14mm 12mm;}
  html,body{background:#fff !important;}
  body > *{display:none !important;}
  body > #print-area{display:block !important;}
  .pr-doc{font-family:'DFDS','Inter',Arial,sans-serif;color:#1a1a2e;font-size:10.5pt;line-height:1.45;}
  .pr-head{border-bottom:2.5pt solid #0B1F33;padding-bottom:6pt;margin-bottom:10pt;}
  .pr-head .pr-t{font-size:16pt;font-weight:800;color:#0B1F33;letter-spacing:.3pt;}
  .pr-head .pr-s{font-size:10pt;color:#475569;margin-top:2pt;}
  .pr-info{font-weight:700;margin:6pt 0;}
  .pr-meta{color:#475569;font-size:9.5pt;margin:3pt 0 8pt;}
  .pr-h{font-size:12pt;font-weight:800;color:#0B1F33;margin:12pt 0 5pt;border-bottom:1pt solid #94a3b8;padding-bottom:2pt;}
  table.pr-tb{width:100%;border-collapse:collapse;margin:4pt 0 10pt;font-size:8.5pt;}
  table.pr-tb th{background:#0B1F33;color:#fff;font-weight:700;text-align:left;padding:3.5pt 4pt;border:.5pt solid #94a3b8;}
  table.pr-tb td{padding:3.5pt 4pt;border:.5pt solid #94a3b8;vertical-align:top;}
  table.pr-tb td.c{text-align:center;}
  .pr-band{background:#0B1F33;color:#fff;font-weight:800;font-size:11pt;text-align:center;padding:5pt;margin-top:10pt;}
  .pr-lines{border:.5pt solid #94a3b8;border-top:0;padding:7pt 9pt;margin-bottom:8pt;}
  .pr-lines p{margin:0 0 3pt;}
  .pr-lines p.gap{margin-top:8pt;}
  .pr-cap{font-weight:700;margin:10pt 0 2pt;page-break-after:avoid;}
  .pr-note{font-style:italic;color:#475569;margin:0 0 4pt;page-break-after:avoid;}
  .pr-ph{display:flex;flex-wrap:wrap;gap:4mm;margin:0 0 8pt;}
  .pr-ph img{width:calc(50% - 2mm);object-fit:contain;border:.5pt solid #cbd5e1;}
  .pr-brk{page-break-before:always;}

<body>
<div id="root"></div>

<script>
var APP_BUILD="2026-11-19f";
var DIAG_ERR=[];
try{
  window.addEventListener("error",function(e){if(DIAG_ERR.length<30)DIAG_ERR.push({t:Date.now(),m:String(e.message||e),src:(e.filename||"").slice(-40)+":"+(e.lineno||"")});});
  window.addEventListener("unhandledrejection",function(e){if(DIAG_ERR.length<30)DIAG_ERR.push({t:Date.now(),m:"promise: "+String(e.reason&&(e.reason.message||e.reason))});});
}catch(e){}
var IDB_T0=Date.now(),IDB_TOPEN=null;
"use strict";
/* ============================ Depolama (telefon hafızası: localStorage) ============================ */
var PROJECT_KEY="tersane_proje_v1", INDEX_KEY="tersane_index_v1", JOBS_KEY="tersane_isler_v1", BOLUMLER_KEY="tersane_bolumler_v1", BASLIKLAR_KEY="tersane_basliklar_v1", ASAMALAR_KEY="tersane_asamalar_v1";
function reportKey(d){return "tersane_rapor_"+d;}
/* ============================ Gemi Slotları (çoklu gemi / arşiv) ============================ */
// Her gemi bir "slot": metinsel veri (proje/günler/işler/şablonlar) localStorage'da saklanır.
// Fotoğraflar IndexedDB'de global ID'lerle kalır; slotlar arası karışmaz (her işin kendi foto ID'leri var).
/* ---- Fotoğraf çekim zamanı: aynı anda çekilenleri gruplamak için ---- */
var FOTOMETA_KEY="tersane_fotometa_v1";   // {id:{t:cekimZamani}}
function loadFotoMeta(){var m=getJSON(FOTOMETA_KEY,{});return (m&&typeof m==="object")?m:{};}
function setFotoTime(id,t){
  if(!t)return;var m=loadFotoMeta();m[id]={t:t};
  var ks=Object.keys(m);
  if(ks.length>4000){ks.sort(function(a,b){return (m[a].t||0)-(m[b].t||0);});ks.slice(0,ks.length-3500).forEach(function(k){delete m[k];});}
  setJSON(FOTOMETA_KEY,m);
}
// Arka arkaya çekilen fotoğrafları grupla (arası 6 dk'dan uzunsa yeni grup)
function clusterByTime(ids){
  var meta=loadFotoMeta();
  var withT=ids.map(function(id){return {id:id,t:(meta[id]&&meta[id].t)||0};});
  var known=withT.filter(function(x){return x.t;});
  var unknown=withT.filter(function(x){return !x.t;}).map(function(x){return x.id;});
  if(known.length<2){
    var all=ids.slice();
    return all.length?[{ids:all,from:0,to:0}]:[];
  }
  known.sort(function(a,b){return a.t-b.t;});
  var GAP=6*60*1000,cl=[],cur=[known[0]];
  for(var i=1;i<known.length;i++){
    if(known[i].t-known[i-1].t>GAP){cl.push(cur);cur=[known[i]];}
    else cur.push(known[i]);
  }
  cl.push(cur);
  var out=cl.map(function(g){return {ids:g.map(function(x){return x.id;}),from:g[0].t,to:g[g.length-1].t};});
  if(unknown.length)out.push({ids:unknown,from:0,to:0});
  return out;
}
function fmtClock(ts){try{var d=new Date(ts);return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);}catch(e){return "";}}
/* ---- Görsel tanıma: 6x6 renk düzeni + HSV histogram, z-normalize kosinüs ---- */
var FP_KEY="tersane_fp_v3";        // {id:[0..255 x408]}
var FPTRAIN_KEY="tersane_fptrain_v3"; // [{id,chainId,itemId,title,job}]
var FPSTAT_KEY="tersane_fpstat_v3";   // {mu:[],sd:[]}
var FP_NL=216, FP_NH=192, FP_NT=64, FP_LEN=472;  // renk düzeni + HSV + doku(LBP)
function loadFpAll(){return fpMem;}                       // bellek içi (IndexedDB'den yüklenir)
function saveFpOne(id,v){fpMem[id]=v;return idbPutFp(id,v);}
function loadFpTrain(){var a=getJSON(FPTRAIN_KEY,[]);return Array.isArray(a)?a:[];}
function saveFpTrain(a){if(a.length>1200)a=a.slice(a.length-1200);setJSON(FPTRAIN_KEY,a);}
// Ham öznitelik: 6x6 blok (RGB ortalama + std) + HSV histogram (12x4x4)
function computeFp(dataUrl){
  return new Promise(function(resolve){
    try{
      var img=new Image();
      img.onload=function(){
        try{
          var N=48,g=6,bs=N/g;
          var cv=document.createElement("canvas");cv.width=N;cv.height=N;
          var c=cv.getContext("2d");c.drawImage(img,0,0,N,N);
          var d=c.getImageData(0,0,N,N).data;
          var out=new Array(FP_LEN);
          var oi=0;
          for(var by=0;by<g;by++){for(var bx=0;bx<g;bx++){
            var sr=0,sg=0,sb=0,qr=0,qg=0,qb=0,n=0;
            for(var y=by*bs;y<(by+1)*bs;y++){for(var x=bx*bs;x<(bx+1)*bs;x++){
              var k=(y*N+x)*4,r=d[k]/255,gg=d[k+1]/255,bb=d[k+2]/255;
              sr+=r;sg+=gg;sb+=bb;qr+=r*r;qg+=gg*gg;qb+=bb*bb;n++;
            }}
            var mr=sr/n,mg=sg/n,mb=sb/n;
            var dr=Math.sqrt(Math.max(0,qr/n-mr*mr))*2,dg=Math.sqrt(Math.max(0,qg/n-mg*mg))*2,db=Math.sqrt(Math.max(0,qb/n-mb*mb))*2;
            out[oi++]=mr;out[oi++]=mg;out[oi++]=mb;out[oi++]=dr;out[oi++]=dg;out[oi++]=db;
          }}
          // HSV histogram
          var hist=new Array(192);for(var i=0;i<192;i++)hist[i]=0;
          for(var p=0;p<N*N;p++){
            var k2=p*4,r2=d[k2]/255,g2=d[k2+1]/255,b2=d[k2+2]/255;
            var mx=Math.max(r2,g2,b2),mn=Math.min(r2,g2,b2),df=mx-mn,hh=0;
            if(df>0){
              if(mx===r2)hh=((g2-b2)/df)%6;
              else if(mx===g2)hh=(b2-r2)/df+2;
              else hh=(r2-g2)/df+4;
              hh=hh/6;if(hh<0)hh+=1;
            }
            var ss=mx>0?df/mx:0,vv=mx;
            var hb=Math.min(11,Math.floor(hh*12)),sbn=Math.min(3,Math.floor(ss*4)),vb=Math.min(3,Math.floor(vv*4));
            hist[hb*16+sbn*4+vb]++;
          }
          var tot=N*N;
          for(var i3=0;i3<192;i3++)out[FP_NL+i3]=Math.sqrt(hist[i3]/tot);
          // --- Doku (LBP): aydınlatmadan bağımsız yüzey deseni, 2x2 bölge x 16 kova
          var gray=new Array(N*N);
          for(var gi=0;gi<N*N;gi++){var kk=gi*4;gray[gi]=(d[kk]*0.299+d[kk+1]*0.587+d[kk+2]*0.114)/255;}
          function gv(x,y){x=x<0?0:(x>=N?N-1:x);y=y<0?0:(y>=N?N-1:y);return gray[y*N+x];}
          var cells=2,cs=N/cells,lbp=new Array(FP_NT);
          for(var li=0;li<FP_NT;li++)lbp[li]=0;
          for(var cy=0;cy<cells;cy++){for(var cx=0;cx<cells;cx++){
            var base=(cy*cells+cx)*16,cnt2=0;
            for(var y2=cy*cs;y2<(cy+1)*cs;y2++){for(var x2=cx*cs;x2<(cx+1)*cs;x2++){
              var c0=gv(x2,y2),code=0;
              code|=(gv(x2-1,y2-1)>=c0?1:0);code|=(gv(x2,y2-1)>=c0?2:0);code|=(gv(x2+1,y2-1)>=c0?4:0);
              code|=(gv(x2+1,y2)>=c0?8:0);code|=(gv(x2+1,y2+1)>=c0?16:0);code|=(gv(x2,y2+1)>=c0?32:0);
              code|=(gv(x2-1,y2+1)>=c0?64:0);code|=(gv(x2-1,y2)>=c0?128:0);
              lbp[base+(code>>4)]++;cnt2++;
            }}
            for(var b2=0;b2<16;b2++)lbp[base+b2]=Math.sqrt(lbp[base+b2]/(cnt2||1));
          }}
          for(var i5=0;i5<FP_NT;i5++)out[FP_NL+FP_NH+i5]=lbp[i5];
          // 8-bit sakla
          var q=new Array(FP_LEN);
          for(var i4=0;i4<FP_LEN;i4++)q[i4]=Math.max(0,Math.min(255,Math.round(out[i4]*255)));
          resolve(q);
        }catch(e){resolve(null);}
      };
      img.onerror=function(){resolve(null);};
      img.src=dataUrl;
    }catch(e){resolve(null);}
  });
}
function getFp(id){
  var m=loadFpAll();
  if(m[id]&&m[id].length===FP_LEN)return Promise.resolve(m[id]);
  var url=photoData(id);if(!url)return Promise.resolve(null);
  return computeFp(url).then(function(fp){if(fp)return saveFpOne(id,fp).then(function(){return fp;});return null;});
}
// z-normalizasyon istatistiği (eğitim setinden)
function rebuildFpStats(){
  var m=loadFpAll(),ks=Object.keys(m).filter(function(k){return m[k]&&m[k].length===FP_LEN;});
  if(ks.length<8)return null;
  var mu=new Array(FP_LEN),sd=new Array(FP_LEN);
  for(var i=0;i<FP_LEN;i++){mu[i]=0;sd[i]=0;}
  ks.forEach(function(k){var v=m[k];for(var i=0;i<FP_LEN;i++)mu[i]+=v[i];});
  for(var i2=0;i2<FP_LEN;i2++)mu[i2]/=ks.length;
  ks.forEach(function(k){var v=m[k];for(var i=0;i<FP_LEN;i++){var dd=v[i]-mu[i];sd[i]+=dd*dd;}});
  for(var i3=0;i3<FP_LEN;i3++)sd[i3]=Math.sqrt(sd[i3]/ks.length)+1e-6;
  var st={mu:mu,sd:sd};setJSON(FPSTAT_KEY,st);return st;
}
function getFpStats(){var st=getJSON(FPSTAT_KEY,null);return (st&&st.mu&&st.mu.length===FP_LEN)?st:rebuildFpStats();}
// Karşılaştırılabilir vektör: z-norm + blok bazında L2 + ağırlık
function encodeFp(q,st){
  if(!q||!st||q.length!==FP_LEN)return null;
  // Her blok (renk düzeni / HSV / doku) ayrı ayrı z-normalize + L2, sonra birleştirilir
  var bounds=[[0,FP_NL,1.0],[FP_NL,FP_NL+FP_NH,1.0],[FP_NL+FP_NH,FP_LEN,0.7]];  // ağırlıklar gerçek veriyle optimize edildi
  var out=new Array(FP_LEN),n2=0,i,bi;
  for(bi=0;bi<bounds.length;bi++){
    var s0=bounds[bi][0],s1=bounds[bi][1],wb=bounds[bi][2],nb=0;
    for(i=s0;i<s1;i++){var z=(q[i]-st.mu[i])/st.sd[i];out[i]=z;nb+=z*z;}
    nb=Math.sqrt(nb)||1;
    for(i=s0;i<s1;i++){out[i]=(out[i]/nb)*wb;n2+=out[i]*out[i];}
  }
  n2=Math.sqrt(n2)||1;
  for(i=0;i<FP_LEN;i++)out[i]/=n2;
  return out;
}
function cosSim(a,b){var s=0;for(var i=0;i<a.length;i++)s+=a[i]*b[i];return s;}
// Öğren: bu fotoğraflar bu işe ait
function learnPhotos(ids,item){
  if(!item||!ids||!ids.length)return Promise.resolve();
  var tr=loadFpTrain(),chain=Promise.resolve();
  ids.forEach(function(id){
    chain=chain.then(function(){
      return getFp(id).then(function(fp){
        if(!fp)return;
        tr.push({id:id,chainId:item.chainId||"",itemId:item.id,title:item.title||"",job:(itemJobs(item)[0]||"")});
      });
    });
  });
  return chain.then(function(){saveFpTrain(tr);rebuildFpStats();});
}
// Bir grup fotoğraf için iş önerileri (en fazla 3, güvenle birlikte)
function suggestForPhotos(ids,items){
  if(!items||!items.length||!ids||!ids.length)return [];
  var st=getFpStats();if(!st)return [];
  var tr=loadFpTrain();if(tr.length<6)return [];
  var fps=loadFpAll();
  // yeterince örneği olan işler (en az 6 fotoğraf) — azsa tahmin güvenilmez
  var cnt={};
  tr.forEach(function(t){var k=t.chainId||t.itemId;cnt[k]=(cnt[k]||0)+1;});
  var pool=tr.filter(function(t){
    var k=t.chainId||t.itemId;
    if((cnt[k]||0)<6)return false;
    return !!fps[t.id];
  });
  if(!pool.length)return [];
  var enc=[];
  pool.forEach(function(t){var e=encodeFp(fps[t.id],st);if(e)enc.push({e:e,t:t});});
  if(!enc.length)return [];
  var vote={},bestRef={};
  ids.forEach(function(id){
    var q=encodeFp(fps[id],st);if(!q)return;
    var sims=enc.map(function(x){return {s:cosSim(q,x.e),t:x.t};});
    sims.sort(function(a,b){return b.s-a.s;});
    sims.slice(0,5).forEach(function(x){
      var it=items.filter(function(y){return (x.t.chainId&&y.chainId===x.t.chainId)||y.id===x.t.itemId||
        ((x.t.title&&y.title===x.t.title)&&(x.t.job&&itemJobs(y)[0]===x.t.job));})[0];
      if(!it)return;
      var w=Math.max(0,x.s);w=w*w*w;
      vote[it.id]=(vote[it.id]||0)+w;
      if(!bestRef[it.id]||bestRef[it.id].s<x.s)bestRef[it.id]={s:x.s,id:x.t.id};  // en çok benzeyen eski fotoğraf
    });
  });
  var ks=Object.keys(vote);if(!ks.length)return [];
  // Daha önce "bunu şununla karıştırma" diye düzelttiyseniz, puanı doğru işe aktar
  try{
    var fixes=loadFixes();
    Object.keys(fixes).forEach(function(key){
      var pr=key.split(">"),wrong=pr[0],right=pr[1],n=fixes[key];
      var wi=items.filter(function(x){return x.chainId===wrong;})[0];
      var ri=items.filter(function(x){return x.chainId===right;})[0];
      if(!wi||!ri||!vote[wi.id])return;
      var share=Math.min(0.6,n/(n+1.5));            // kaç kez düzelttiyseniz o kadar güçlü
      var move=vote[wi.id]*share;
      vote[wi.id]-=move;vote[ri.id]=(vote[ri.id]||0)+move;
    });
    ks=Object.keys(vote).filter(function(k){return vote[k]>0;});
  }catch(e){}
  var total=0;ks.forEach(function(k){total+=vote[k];});
  ks.sort(function(a,b){return vote[b]-vote[a];});
  // Kaç öneri gösterilecek? Skorlar birbirine yakınsa daha fazla (en çok 5), ayrışıksa az.
  var out=[],cum=0;
  for(var n=0;n<ks.length&&n<5;n++){
    var pct=100*vote[ks[n]]/(total||1);
    if(n>=2&&(pct<12||cum>88))break;      // katkısı düşükse ekleme
    cum+=pct;
    var itx=items.filter(function(x){return x.id===ks[n];})[0];
    if(itx)out.push({item:itx,conf:Math.round(pct)});
  }
  return out;
}
// Geçmiş fotoğrafları tarayıp öğrenme setini kur
// Var olmayan fotoğraflara işaret eden kayıtları temizler (bozuk kopyalar sayfayı kilitleyebilir)
function repairMissingPhotos(){
  // Veritabanı açılamadıysa ya da hiç fotoğraf okunamadıysa bu "eksik" değil, erişim sorunudur: hiçbir kayda dokunma
  if(IDB_BLOCKED)return Promise.reject(new Error("blocked"));
  return idbLoadAll().then(function(all){
    all=all||{};
    if(!IDB||!Object.keys(all).length)throw new Error("fotoğraf deposu okunamadı");
    var removed=0,daysFixed=[];
    (App.index||[]).forEach(function(dt){
      var rep=getJSON(reportKey(dt),null);if(!rep)return;
      var changed=false;
      (rep.items||[]).forEach(function(it){
        normalizeItem(it);
        (it.entries||[]).forEach(function(en){
          var before=(en.photos||[]).length;
          en.photos=(en.photos||[]).filter(function(p){
            var pid=(p&&p.id)?p.id:p;
            return pid&&(all[pid]||photoMem[pid]);
          });
          if(en.photos.length!==before){changed=true;removed+=before-en.photos.length;}
        });
      });
      if(Array.isArray(rep.pool)){
        var pb=rep.pool.length;
        rep.pool=rep.pool.filter(function(pid){return all[pid]||photoMem[pid];});
        if(rep.pool.length!==pb){changed=true;removed+=pb-rep.pool.length;}
      }
      if(changed){setJSON(reportKey(dt),rep);daysFixed.push(dt);}
    });
    all=null;
    if(daysFixed.length&&App.selectedDate&&daysFixed.indexOf(App.selectedDate)>=0)loadDay(App.selectedDate);
    return {removed:removed,days:daysFixed.length};
  });
}
function indexAllPhotos(onProgress){
  var jobs=[];
  // aktif gemi
  (App.index||[]).forEach(function(d){
    var rep=getJSON(reportKey(d),{items:[]});
    (rep.items||[]).forEach(function(it){
      normalizeItem(it);
      (it.entries||[]).forEach(function(en){(en.photos||[]).forEach(function(pid){jobs.push({id:pid,item:it});});});
    });
  });
  // arşivdeki gemiler de öğrenmeye dahil (ör. Gallipoli)
  try{
    loadSlots().forEach(function(sl){
      var data=slotGet(sl.id);if(!data)return;
      var idx=[];
      try{idx=JSON.parse(data[INDEX_KEY]||"[]");}catch(e){idx=[];}
      (idx||[]).forEach(function(d){
        var raw=data["tersane_rapor_"+d];if(!raw)return;
        var rep=null;try{rep=JSON.parse(raw);}catch(e){return;}
        (rep&&rep.items||[]).forEach(function(it){
          normalizeItem(it);
          (it.entries||[]).forEach(function(en){(en.photos||[]).forEach(function(pid){jobs.push({id:pid,item:it});});});
        });
      });
    });
  }catch(e){}
  var tr=[],done=0,fresh=0;
  var have=loadFpAll();
  // parmak izi için fotoğrafın belleğe gelmesi gerekir; 40'lık gruplar hâlinde getir
  var chain=Promise.resolve();
  (function(){
    var need=jobs.map(function(j){return j.id;}).filter(function(id){return !have[id];});
    for(var i=0;i<need.length;i+=40){
      (function(batch){chain=chain.then(function(){return ensurePhotos(batch);});})(need.slice(i,i+40));
    }
  })();
  jobs.forEach(function(j){
    chain=chain.then(function(){
      if(have[j.id]){          // daha önce incelenmiş — tekrar hesaplanmaz
        tr.push({id:j.id,chainId:j.item.chainId||"",itemId:j.item.id,title:j.item.title||"",job:(itemJobs(j.item)[0]||"")});
        done++;if(onProgress&&done%25===0)onProgress(done,jobs.length);
        return;
      }
      return getFp(j.id).then(function(fp){
        if(fp){fresh++;tr.push({id:j.id,chainId:j.item.chainId||"",itemId:j.item.id,title:j.item.title||"",job:(itemJobs(j.item)[0]||"")});}
        done++;if(onProgress&&done%10===0)onProgress(done,jobs.length);
      });
    });
  });
  return chain.then(function(){
    saveFpTrain(tr);rebuildFpStats();
    if(onProgress)onProgress(jobs.length,jobs.length);
    return {photos:jobs.length,samples:tr.length,fresh:fresh};
  });
}

// Havuzdaki fotoğrafların belirli bir işe ne kadar benzediği (0..1)
function relevanceScores(ids,item){
  var out={};
  if(!item)return out;
  var st=getFpStats();if(!st)return out;
  var fps=loadFpAll();
  // referans: bu işin (zincirin) daha önceki fotoğrafları + o anki aşamalarındaki fotoğraflar
  var refIds=[];
  loadFpTrain().forEach(function(t){
    if((item.chainId&&t.chainId===item.chainId)||t.itemId===item.id||
       ((t.title&&t.title===item.title)&&(t.job&&t.job===(itemJobs(item)[0]||""))))refIds.push(t.id);
  });
  (item.entries||[]).forEach(function(en){(en.photos||[]).forEach(function(p){
    var pid=(p&&p.id)?p.id:p;if(pid)refIds.push(pid);
  });});
  var refs=[];
  refIds.forEach(function(rid){var e=fps[rid]&&encodeFp(fps[rid],st);if(e)refs.push(e);});
  if(!refs.length)return out;
  ids.forEach(function(id){
    var q=fps[id]&&encodeFp(fps[id],st);if(!q)return;
    var best=-1;
    for(var i=0;i<refs.length;i++){var sc=cosSim(q,refs[i]);if(sc>best)best=sc;}
    out[id]=best;
  });
  return out;
}

var SLOTS_KEY="tersane_slots_v1"; // [{id,name,savedAt,shipName,dayCount}]

function slotDataKey(id){return "tersane_slotdata_"+id;}
/* Gemi arşivleri eskiden localStorage'daydı: iki uzun tersane süreci tarayıcının ~5 MB sınırını dolduruyordu.
   Artık IndexedDB'de ("gemiler" deposu). Okuma anında olsun diye bellekte bir kopyası tutulur;
   yazma önce kalıcı depoya gider, gemi değiştirme yazma bitmeden eski veriyi silmez. */
var SLOT_CACHE={},SLOT_READY=false,SLOT_LOADING=null;
function slotGet(id){
  if(SLOT_CACHE[id])return SLOT_CACHE[id];
  var legacy=getJSON(slotDataKey(id),null);         // henüz taşınmamış eski kayıt
  if(legacy)SLOT_CACHE[id]=legacy;
  return legacy;
}
function slotIds(){
  var ids={};Object.keys(SLOT_CACHE).forEach(function(k){ids[k]=1;});
  try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf("tersane_slotdata_")===0)ids[k.substring(17)]=1;}}catch(e){}
  return Object.keys(ids);
}
function idbStorePut(store,key,val){
  return storeDb(store).then(function(DB){return new Promise(function(resolve){
    if(!DB){resolve(false);return;}
    try{var tx=DB.transaction(store,"readwrite");tx.objectStore(store).put(val,key);
      tx.oncomplete=function(){resolve(true);};tx.onerror=function(){resolve(false);};tx.onabort=function(){resolve(false);};}catch(e){resolve(false);}
  });});
}
function idbStoreDel(store,key){
  return storeDb(store).then(function(DB){return new Promise(function(resolve){
    if(!DB){resolve(false);return;}
    try{var tx=DB.transaction(store,"readwrite");tx.objectStore(store).delete(key);tx.oncomplete=function(){resolve(true);};tx.onerror=function(){resolve(false);};}catch(e){resolve(false);}
  });});
}
function idbStoreAll(store){
  return storeDb(store).then(function(DB){return new Promise(function(resolve){
    if(!DB){resolve({});return;}
    try{var out={},cur=DB.transaction(store,"readonly").objectStore(store).openCursor();
      cur.onsuccess=function(ev){var c=ev.target.result;if(c){out[String(c.key)]=c.value;c.continue();}else resolve(out);};
      cur.onerror=function(){resolve(out);};}catch(e){resolve({});}
  });});
}
// Kalıcı yaz. Döner: Promise<true/false>. IndexedDB yoksa (çok eski tarayıcı) localStorage'a yazar.
function slotPut(id,data){
  SLOT_CACHE[id]=data;if(typeof DRV!=="undefined")DRV.dirty=true;
  return idbStorePut("gemiler",id,data).then(function(ok){
    if(ok){try{localStorage.removeItem(slotDataKey(id));}catch(e){}return true;}
    return setJSON(slotDataKey(id),data);
  });
}
function slotDel(id){
  delete SLOT_CACHE[id];
  try{localStorage.removeItem(slotDataKey(id));}catch(e){}
  // önceki sürümün fotoğraf veritabanındaki kopyası da gitsin, yoksa silinen gemi geri gelir
  idbReady().then(function(){try{if(IDB&&IDB.objectStoreNames.contains("gemiler"))IDB.transaction("gemiler","readwrite").objectStore("gemiler").delete(id);}catch(e){}});
  return idbStoreDel("gemiler",id);
}

// Açılışta: IndexedDB'deki arşivleri belleğe al, localStorage'da kalan eskileri taşı.
function loadSlotStore(){
  if(SLOT_LOADING)return SLOT_LOADING;
  SLOT_LOADING=Promise.all([idbStoreAll("gemiler"),oldMainArchives()]).then(function(res){
    var all=res[0]||{},old=res[1]||{};
    Object.keys(all).forEach(function(k){SLOT_CACHE[k]=all[k];});
    // önceki sürüm arşivleri fotoğraf veritabanına yazmıştı: eksik olanları yeni yere kopyala (kaynak silinmez)
    var mv=Promise.resolve();
    Object.keys(old).forEach(function(k){if(all[k])return;SLOT_CACHE[k]=old[k];mv=mv.then(function(){return idbStorePut("gemiler",k,old[k]);});});
    return mv.then(function(){return all;});
  }).then(function(all){
    var legacy=[];
    try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf("tersane_slotdata_")===0)legacy.push(k);}}catch(e){}
    var ch=Promise.resolve();
    legacy.forEach(function(k){
      var id=k.substring(17),data=getJSON(k,null);if(!data)return;
      SLOT_CACHE[id]=data;
      ch=ch.then(function(){return idbStorePut("gemiler",id,data).then(function(ok){if(ok){try{localStorage.removeItem(k);}catch(e){}}});});
    });
    return ch;
  }).then(function(){SLOT_READY=true;});
  return SLOT_LOADING;
}

// Arşiv listesini gerçek verilerle tazeler; kayıp slot verilerini listeye geri alır;

// Açık geminin adı değişince arşiv kaydındaki ad da güncellensin (veri yazmadan, sadece etiket)
function syncActiveSlotName(){
  var id=getActiveSlotId();if(!id)return false;
  var p=getJSON(PROJECT_KEY,null)||{};
  var slots=loadSlots(),hit=false;
  slots.forEach(function(x){
    if(x.id!==id)return;
    var nn=(p.shipName||x.name||"Gemi");
    var dc=(getJSON(INDEX_KEY,[])||[]).length;
    if(x.name!==nn||x.shipName!==(p.shipName||"")||x.dayCount!==dc||x.startDate!==(p.startDate||"")){
      x.name=nn;x.shipName=p.shipName||"";x.dayCount=dc;x.startDate=p.startDate||"";hit=true;
    }
  });
  if(hit)saveSlots(slots);
  return hit;
}
function repairSlots(){
  var slots=loadSlots();
  var res={fixed:0,adopted:0,created:0};
  // 1) liste kayıtlarını slot verisinden tazele (ad/gün sayısı doğru görünsün)
  var _act0=getActiveSlotId();
  slots.forEach(function(sl){
    if(sl.id===_act0)return;        // açık geminin slot verisi henüz eski; adını canlı projeden alır
    var m=slotMeta(sl.id);
    if(!m.shipName&&!m.dayCount)return;
    var nn=m.shipName||sl.name;
    if(sl.name!==nn||sl.dayCount!==m.dayCount||sl.startDate!==m.startDate){
      sl.name=nn;sl.shipName=m.shipName||sl.shipName||"";sl.dayCount=m.dayCount;sl.startDate=m.startDate||"";
      res.fixed++;
    }
  });
  // 2) listede olmayan slot verilerini bul (kaybolmuş gemiler) ve geri ekle
  var known={};slots.forEach(function(x){known[x.id]=true;});
  try{
    slotIds().forEach(function(id){
      if(known[id])return;
      var m2=slotMeta(id);
      if(m2.empty)return;
      slots.push({id:id,name:m2.shipName||"Gemi",shipName:m2.shipName||"",savedAt:Date.now(),dayCount:m2.dayCount,startDate:m2.startDate||""});
      known[id]=true;res.adopted++;
    });
  }catch(e){}
  saveSlots(slots);
  // 3) açık geminin slot kimliği yoksa: birebir aynı veriyi taşıyan slotu sahiplen,
  //    yoksa açık gemi için yeni slot oluştur (böylece listede kendi kendini görmez)
  var act=getActiveSlotId();
  var valid=act&&slots.some(function(x){return x.id===act;});
  if(!valid){
    var twin=null;
    slots.forEach(function(x){if(!twin&&slotMatchesActive(x.id))twin=x.id;});
    if(twin){setActiveSlotId(twin);res.adopted++;}
    else if(getJSON(PROJECT_KEY,null)){persistActiveToSlot();res.created++;}
  }
  if(syncActiveSlotName())res.fixed++;
  return res;
}
function deleteSlot(id){
  var slots=loadSlots().filter(function(s){return s.id!==id;});
  saveSlots(slots);
  slotDel(id);
}
// Bir arşiv slotundaki şablonları (bölüm/lokasyon/başlık) aktif gemininkilerle BİRLEŞTİRİR (üzerine yazmaz)
function mergeTemplatesFromSlot(id){
  var data=slotGet(id);
  if(!data)return {bolum:0,loc:0,title:0};
  function parseArr(str){try{var a=JSON.parse(str);return Array.isArray(a)?a:[];}catch(e){return [];}}
  function mergeInto(current,incoming){
    var added=0;var seen={};
    current.forEach(function(x){seen[(x||"").toLowerCase().trim()]=true;});
    incoming.forEach(function(x){var key=(x||"").toLowerCase().trim();if(key&&!seen[key]){current.push(x);seen[key]=true;added++;}});
    return added;
  }
  var res={bolum:0,loc:0,title:0};
  // Bölümler
  var incB=parseArr(data[BOLUMLER_KEY]);
  if(incB.length){res.bolum=mergeInto(BOLUMLER,incB);BOLUMLER.sort(function(a,b){return a.localeCompare(b,"tr");});saveBolums();}
  // Lokasyonlar
  var incL=parseArr(data[JOBS_KEY]);
  if(incL.length){if(!Array.isArray(App.jobs))App.jobs=[];res.loc=mergeInto(App.jobs,incL);App.jobs.sort(function(a,b){return a.localeCompare(b,"tr");});saveJobs();}
  // İş başlıkları
  var incT=parseArr(data[BASLIKLAR_KEY]);
  if(incT.length){if(!Array.isArray(BASLIKLAR))BASLIKLAR=[];res.title=mergeInto(BASLIKLAR,incT);BASLIKLAR.sort(function(a,b){return a.localeCompare(b,"tr");});saveBasliklar();}
  // Aşama kalıpları
  var incA=parseArr(data[ASAMALAR_KEY]);
  if(incA.length){if(!Array.isArray(ASAMALAR))ASAMALAR=[];res.asama=mergeInto(ASAMALAR,incA);ASAMALAR.sort(function(a,b){return a.localeCompare(b,"tr");});saveAsamalar();}
  return res;
}

// localStorage ~5MB ile sınırlı; fotoğraflar IndexedDB'de saklanır (GB'larca alan).
// Senkron render için bellek-içi önbellek (photoMem) kullanılır.
var photoMem={}; // id -> dataURL
var IDB=null, IDB_READY=false, IDB_PROMISE=null;
function idbReady(){                       // veritabanı hazır olana kadar bekle
  if(IDB)return Promise.resolve(IDB);
  return idbOpen();
}
// Fotoğraf veritabanı artık sürüm yükseltmesi İSTEMEDEN açılır. Eskiden yükseltme gerekiyordu ve eski sürüm
// Chrome'da başka bir sekmede açık kaldığında bekleme hiç bitmiyordu: fotoğraflar görünmüyor, arşivdeki
// gemilere geçilemiyordu. Gemi arşivleri bu yüzden ayrı bir veritabanında (gemiTakipArsiv) durur.
var IDB_BLOCKED=false;
function idbStoresOk(db){return db.objectStoreNames.contains("fotolar")&&db.objectStoreNames.contains("izler");}
function idbMkStores(db){
  if(!db.objectStoreNames.contains("fotolar"))db.createObjectStore("fotolar");
  if(!db.objectStoreNames.contains("izler"))db.createObjectStore("izler");   // parmak izleri (localStorage'ı şişirmesin)
}
function idbWatch(db){
  db.onversionchange=function(){try{db.close();}catch(e){}if(IDB===db){IDB=null;IDB_READY=false;IDB_PROMISE=null;}};
}
function idbOpen(){
  if(IDB_PROMISE)return IDB_PROMISE;
  IDB_PROMISE=new Promise(function(resolve){
    function fail(){IDB=null;IDB_READY=false;resolve(null);}
    function ok(db){clearTimeout(_wd);IDB_TOPEN=Date.now()-IDB_T0;idbWatch(db);IDB=db;IDB_READY=true;IDB_BLOCKED=false;hideIdbBlocked();resolve(db);
      if(_late){SLOT_LOADING=null;loadSlotStore().then(function(){try{repairSlots();}catch(e){}for(var _k in _lazyMiss)delete _lazyMiss[_k];try{render();}catch(e){}});}}
    // Eski bir sekme veritabanı kuyruğunu tutuyorsa açılış hiç bitmez: kullanıcıya söyle (kapatınca kendiliğinden düzelir)
    var _late=false,_wd=setTimeout(function(){_late=true;IDB_BLOCKED=true;showIdbBlocked();},3000);
    try{
      var req=indexedDB.open("gemiTakipDB");        // var olan sürümle aç: yükseltme yok, bekleme yok
      req.onupgradeneeded=function(ev){idbMkStores(ev.target.result);};   // sadece ilk kurulumda
      req.onsuccess=function(ev){
        var db=ev.target.result;
        if(idbStoresOk(db)){ok(db);return;}
        // çok eski bir kurulumda depolar eksikse tek seferlik yükselt
        var v=db.version+1;db.close();
        var r2=indexedDB.open("gemiTakipDB",v);
        r2.onupgradeneeded=function(e2){idbMkStores(e2.target.result);};
        r2.onsuccess=function(e2){ok(e2.target.result);};
        r2.onerror=fail;
        r2.onblocked=function(){IDB_BLOCKED=true;showIdbBlocked();};
      };
      req.onerror=fail;
    }catch(e){fail();}
  });
  return IDB_PROMISE;
}
// Gemi arşivleri için ayrı veritabanı
var ARC=null,ARC_PROMISE=null;
function arcReady(){
  if(ARC)return Promise.resolve(ARC);
  if(ARC_PROMISE)return ARC_PROMISE;
  ARC_PROMISE=new Promise(function(resolve){
    try{
      var req=indexedDB.open("gemiTakipArsiv",1);
      req.onupgradeneeded=function(ev){var db=ev.target.result;if(!db.objectStoreNames.contains("gemiler"))db.createObjectStore("gemiler");};
      req.onsuccess=function(ev){ARC=ev.target.result;ARC.onversionchange=function(){try{ARC.close();}catch(e){}ARC=null;ARC_PROMISE=null;};resolve(ARC);};
      req.onerror=function(){ARC_PROMISE=null;resolve(null);};
    }catch(e){resolve(null);}
  });
  return ARC_PROMISE;
}
function storeDb(store){return store==="gemiler"?arcReady():idbReady();}

var IDB_FAILS={n:0,last:""};
function idbPut(id,data){
  return idbReady().then(function(){return new Promise(function(resolve){
    function fail(why){IDB_FAILS.n++;IDB_FAILS.last=why||"?";if(DIAG_ERR.length<30&&IDB_FAILS.n<4)DIAG_ERR.push({t:Date.now(),m:"foto yazılamadı: "+IDB_FAILS.last});resolve(false);}
    if(!IDB){fail("depo açık değil");return;}
    try{var tx=IDB.transaction("fotolar","readwrite");tx.objectStore("fotolar").put(data,id);tx.oncomplete=function(){resolve(true);};
      tx.onerror=function(){fail(tx.error&&tx.error.name);};tx.onabort=function(){fail((tx.error&&tx.error.name)||"iptal");};}catch(e){fail(e&&e.name);}
  });});
}
function idbDel(id){
  return new Promise(function(resolve){
    if(!IDB){resolve(false);return;}
    try{var tx=IDB.transaction("fotolar","readwrite");tx.objectStore("fotolar").delete(id);tx.oncomplete=function(){resolve(true);};tx.onerror=function(){resolve(false);};}catch(e){resolve(false);}
  });
}
function idbGetOne(id){
  return idbReady().then(function(){return new Promise(function(resolve){
    if(!IDB){resolve(null);return;}
    try{
      var tx=IDB.transaction("fotolar","readonly");
      var rq=tx.objectStore("fotolar").get(id);
      rq.onsuccess=function(){resolve(rq.result||null);};
      rq.onerror=function(){resolve(null);};
    }catch(e){resolve(null);}
  });});
}
/* Bellek yönetimi: tüm fotoğrafları belleğe almak telefonu çökertiyor.
   Yalnızca gereken fotoğraflar yüklenir, en eski kullanılanlar bellekten atılır. */
var PHOTO_MEM_LIMIT=500;
var photoUse={},photoClock=0;
function touchPhoto(id){photoUse[id]=++photoClock;}
function trimPhotoMem(keep){
  var ks=Object.keys(photoMem);
  if(ks.length<=PHOTO_MEM_LIMIT)return;
  var keepSet={};(keep||[]).forEach(function(k){keepSet[k]=1;});
  ks.sort(function(a,b){return (photoUse[a]||0)-(photoUse[b]||0);});
  var over=ks.length-PHOTO_MEM_LIMIT;
  for(var i=0;i<ks.length&&over>0;i++){
    if(keepSet[ks[i]])continue;
    delete photoMem[ks[i]];delete photoUse[ks[i]];over--;
  }
}
// Verilen fotoğrafları belleğe getir (eksik olanları IndexedDB'den okur)
function ensurePhotos(ids){
  ids=(ids||[]).filter(function(id){return id&&!photoMem[id];});
  if(!ids.length)return Promise.resolve();
  var chain=idbReady();
  ids.forEach(function(id){
    chain=chain.then(function(){
      return idbGetOne(id).then(function(v){if(v){photoMem[id]=v;touchPhoto(id);}});
    });
  });
  return chain.then(function(){
    var miss=ids.filter(function(id){return !photoMem[id];});
    if(miss.length&&typeof driveEnabled==="function"&&driveEnabled())return driveFetchPhotos(miss);
  });
}
// Ekranda gerekince arka planda yükle, gelince bir kez yeniden çiz
var _lazyQ={},_lazyTimer=null,_lazyMiss={};   // _lazyMiss: bulunamayanlar (tekrar denenmez)
function lazyLoadPhoto(id){
  if(!id||photoMem[id]||_lazyQ[id])return;
  if((_lazyMiss[id]||0)>=2)return;              // 2 denemede gelmediyse vazgeç (sonsuz döngüyü önler)
  _lazyQ[id]=1;
  if(_lazyTimer)return;
  _lazyTimer=setTimeout(function(){
    var ids=Object.keys(_lazyQ);_lazyQ={};_lazyTimer=null;
    if(!ids.length)return;
    ensurePhotos(ids).then(function(){
      var got=false,missing=[];
      ids.forEach(function(x){
        if(photoMem[x]){got=true;delete _lazyMiss[x];}
        else{_lazyMiss[x]=(_lazyMiss[x]||0)+1;missing.push(x);}
      });
      if(got)render();                          // yalnızca yeni fotoğraf geldiyse yeniden çiz
      if(missing.length&&missing.some(function(x){return _lazyMiss[x]<2;})){
        setTimeout(function(){
          ensurePhotos(missing).then(function(){
            var got2=missing.some(function(x){return photoMem[x];});
            missing.forEach(function(x){if(!photoMem[x])_lazyMiss[x]=(_lazyMiss[x]||0)+1;});
            if(got2)render();
          });
        },800);
      }
    });
  },60);
}
function idbLoadAll(){
  return idbReady().then(function(){return new Promise(function(resolve){
    if(!IDB){resolve({});return;}
    try{
      var out={};var tx=IDB.transaction("fotolar","readonly");var store=tx.objectStore("fotolar");
      var cur=store.openCursor();
      cur.onsuccess=function(ev){var c=ev.target.result;if(c){out[c.key]=c.value;c.continue();}else resolve(out);};
      cur.onerror=function(){resolve(out);};
    }catch(e){resolve({});}
  });});
}
// Eski localStorage'daki fotoğrafları IndexedDB'ye taşı (tek seferlik göç)
function migratePhotosToIDB(){
  return new Promise(function(resolve){
    var moved=0,pending=[];
    try{
      for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf("tersane_foto_")===0){var id=k.substring("tersane_foto_".length);pending.push({id:id,data:localStorage.getItem(k),k:k});}}
    }catch(e){}
    if(!pending.length){resolve(0);return;}
    var chain=Promise.resolve();
    pending.forEach(function(p){chain=chain.then(function(){return idbPut(p.id,p.data).then(function(ok){if(ok){photoMem[p.id]=p.data;try{localStorage.removeItem(p.k);}catch(e){}moved++;}});});});
    chain.then(function(){resolve(moved);});
  });
}

function genId(){return "f"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
// Okunabilir zincir no: YYYY-MM-DD-NN (gün + o gün kaçıncı yeni zincir). Tüm günlerde benzersizlik kontrol edilir.
function newChainId(dateISO){
  // tüm günlerdeki en büyük sayısal zincir no'yu bul, +1 ver (1,2,3...)
  var max=0;
  function scan(it){var n=parseInt(it.chainId,10);if(!isNaN(n)&&String(n)===String(it.chainId)&&n>max)max=n;}
  (App.index||[]).forEach(function(dt){var rep=getJSON(reportKey(dt),{items:[]});(rep.items||[]).forEach(scan);});
  (App.items||[]).forEach(scan);
  return String(max+1);

function pad(n){return n<10?"0"+n:""+n;}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function todayISO(){return iso(new Date());}
function dayNumber(t,s){var a=new Date(s+"T00:00:00"),b=new Date(t+"T00:00:00");return Math.round((b-a)/86400000)+1;}
// Görüntülenecek gün etiketi: gerçek çıkıştan sonra sayma durur; planlanan aşılırsa "N/planlanan" gösterir
function dayNoLabel(project,dISO){
  var dn=dayNumber(dISO,project.startDate);
  // gerçek çıkış varsa ve bu tarih çıkıştan sonraysa gün gösterme
  if(project.actualExit && dISO>project.actualExit)return "";
  // planlanan çıkış varsa ve gün onu aşıyorsa N/planlanan
  if(project.endDate){
    var planned=dayNumber(project.endDate,project.startDate);
    if(dn>planned)return dn+"/"+planned;
  }
  return String(dn);
}

var EN_MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
var EN_DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function fmtLongEN(s){try{var d=new Date(s+"T00:00:00");return EN_DAYS[d.getDay()]+", "+d.getDate()+" "+EN_MONTHS[d.getMonth()]+" "+d.getFullYear();}catch(e){return s;}}
// "Tersan Tersanesi" -> "Tersan Shipyard" (rapor başlığında İngilizce görünsün)
function enYard(y){return (y||"").replace(/\bTersanesi\b/gi,"Shipyard").replace(/\bTersane\b/gi,"Shipyard");}
// Bir zincirin (chainId) tüm günlerdeki ilk göründüğü tarihi bul
// Tüm zincirlerin ilk görüldüğü günü TEK geçişte çıkarır ve önbelleğe alır.
// (Eskiden her çağrıda bütün günler yeniden okunuyordu; kart listesinde iş başına
//  bir çağrı olduğu için telefonda belirgin yavaşlamaya yol açıyordu.)
function buildChainCache(){
  CHAIN_CACHE={};
  (App.index||[]).slice().sort().forEach(function(dt){
    var rep=(dt===App.selectedDate&&App.view==="day"&&App.items)?{items:App.items}:getJSON(reportKey(dt),{items:[]});
    (rep.items||[]).forEach(function(it){
      var cid=it.chainId;
      if(cid&&!CHAIN_CACHE[cid])CHAIN_CACHE[cid]=dt;
    });
  });
  CHAIN_CACHE_OK=true;
}
function chainStartDate(chainId,fallbackISO){
  if(!chainId)return fallbackISO;
  if(!CHAIN_CACHE_OK)buildChainCache();
  return CHAIN_CACHE[chainId]||fallbackISO;
}
// Geçmiş günleri tarayıp aynı (lokasyon+başlık) işleri tek zincire bağla.
// Tarih sırasıyla yürür: bir anahtar ilk görüldüğünde zincir kimliği belirlenir,
// sonraki günlerde aynı anahtar o zinciri devralır. Döndürür: {linked, days}
function rebuildChains(){
  function norm(s){return (s||"").trim().toLocaleLowerCase("tr");}
  var days=(App.index||[]).slice().sort();
  var lastChainForKey={}; // "lokasyon||baslik" -> son atanan chainId
  var linked=0, touchedDays=0;
  days.forEach(function(dt){
    var rep=getJSON(reportKey(dt),{items:[]});var items=rep.items||[];if(!items.length)return;
    var changed=false;
    // gün içinde aynı anahtardan birden fazla olabilir; gün-içi sayaçla ayır
    var seenThisDay={};
    items.forEach(function(it){
      var key=norm(it.job)+"||"+norm(it.title);
      // aynı gün aynı anahtar ikinci kez -> ayrı tut (zincire katma, kendi kimliğini korusun)
      seenThisDay[key]=(seenThisDay[key]||0)+1;
      if(seenThisDay[key]>1){if(!it.chainId){it.chainId=newChainId(dt);changed=true;}return;}
      if(lastChainForKey[key]){
        if(it.chainId!==lastChainForKey[key]){it.chainId=lastChainForKey[key];changed=true;linked++;}
      }else{
        if(!it.chainId){it.chainId=newChainId(dt);changed=true;}
        lastChainForKey[key]=it.chainId;
      }
      // her durumda bu anahtarın en güncel zinciri bu olsun (sonraki günler devralsın)
      lastChainForKey[key]=it.chainId;
    });
    if(changed){setJSON(reportKey(dt),{items:items,updated:Date.now()});touchedDays++;}
  });
  // açık günü tazele
  if(App.selectedDate)loadDay(App.selectedDate);
  return {linked:linked,days:touchedDays};
}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
// İlerleme her zaman aşamalardan türetilir; aşaması olmayan eski işlerde kayıtlı değer gösterilir
function itemPg(it){return (it&&it.entries&&it.entries.length)?itemProgressPct(it):clampPg(it&&it.progress);}
function clampPg(v){return Math.max(0,Math.min(100,Number(v)||0));}
function st(s){return STATUSES[s]||STATUSES.planlandi;}
// Eski tek desc/photos yapısını yeni entries[] yapısına çevir (geriye uyum)
function normalizeItem(it){

  if(!Array.isArray(it.bolums))it.bolums=[]; // ek bölümler
  if(it.entries&&Array.isArray(it.entries)){

    // iş hangi gün gerçekten tamamlanırsa o günün tarihi yazılır.

function itemPhotoCount(it){return itemPhotoIds(it).length;}

/* ==================== Rapor cümlesi motoru (İngilizce) ====================
   Ana cümle : <Lokasyon> <iş başlığı> work/works is/are ongoing.
               örn: "Heeling TK 14(PS) painting and blasting works are ongoing."
   Aşamalar  : <Lokasyon> <aşama(lar)> work/works has/have been completed. | is/are ongoing.
               örn: "Heeling TK 14(PS) blasting work has been completed.
                     Heeling TK 14(PS) first coat and second coat painting works are ongoing."     */
// Başlık/aşama adını küçült (kısaltmalar ve rakamlı ibareler olduğu gibi kalır: LT, STB, No:2, 14(PS))
function enLower(t){
  return (t||"").trim().replace(/\s*[-–—]\s*/g," ").replace(/\s+/g," ").split(" ").map(function(w){
    if(!/[a-zçğıöşü]/.test(w)||/\d/.test(w))return w;
    return w.toLocaleLowerCase("en");
  }).join(" ").trim();
}
// <lokasyon> <faaliyet> + work/works
// "work" eklenmez: (1) "renewal of …", "replacement of …" gibi of'lu eylem adlarında,
// (2) kendisi zaten iş olan kelimeyle biten başlıklarda (test, measurement, inspection, survey…).
// Çoğul: "and"/"&"/virgül, "works", ya da baş kelimesi çoğul olan ad ("measurements", "hatch covers").
var EN_SELF_NOUN=/^(test|tests|testing|trial|trials|measurement|measurements|inspection|inspections|survey|surveys|check|checks|calibration|calibrations|reading|readings|works?)$/i;
var EN_ACTION_OF=/^(renewal|renewals|replacement|replacements|repair|repairs|inspection|inspections|installation|installations|removal|cleaning|overhaul|overhauling|modification|modifications|fabrication|calibration|survey|painting|measurement|measurements|testing|dismantling|dismounting|mounting|transfer|change|changing|reinstallation|re-installation|preparation|construction|renovation|refurbishment)\s+of\s/i;
function enIsPluralWord(w){
  w=(w||"").toLowerCase().replace(/[^a-z]/g,"");
  return w.length>3&&/s$/.test(w)&&!/(ss|us|is|as|os)$/.test(w);
}
function enActivityPhrase(loc,activity){
  var a=(activity||"").trim();
  var L=(loc||"").trim();
  // başlık zaten lokasyon adıyla başlıyorsa lokasyonu tekrar etme
  if(L&&a.toLocaleLowerCase("en").indexOf(L.toLocaleLowerCase("en")+" ")===0){a=a.slice(L.length).trim();}
  var out=[L,a].filter(function(x){return x;}).join(" ").replace(/\s+/g," ").trim();
  if(!out)return {text:"",plural:false};
  var words=a.split(" ").filter(Boolean),lastW=words.length?words[words.length-1]:"";
  var listy=/\band\b|&|,/.test(a);
  var plural,addWork=true;
  var ofm=EN_ACTION_OF.exec(a);
  if(ofm){                                   // "renewal of sea chest gratings" -> baş kelime "renewal"
    addWork=false;
    plural=listy||enIsPluralWord(ofm[1]);
  }else if(EN_SELF_NOUN.test(lastW)){        // "... pressure test", "... clearance measurements"
    addWork=false;
    plural=listy||enIsPluralWord(lastW)||/^works$/i.test(lastW);
  }else{
    plural=listy||enIsPluralWord(lastW);    // "hatch covers" -> "hatch covers works"
  }
  if(addWork&&!/\bworks?\s*$/i.test(out))out+=" "+(plural?"works":"work");
  if(!L)out=out.charAt(0).toLocaleUpperCase("en")+out.slice(1);
  return {text:out,plural:plural};
}
function enPhraseFor(kind,plural){
  var m={commenced:["has been commenced","have been commenced"],
         ongoing:["is ongoing","are ongoing"],
         completed:["has been completed","have been completed"],
         waiting:["is on hold","are on hold"],
         notstarted:["has not been commenced yet","have not been commenced yet"]};
  var pair=m[kind]||m.ongoing;
  return plural?pair[1]:pair[0];
}
// ["First coat painting","Second coat painting"] -> "first coat and second coat painting"
function mergeStageNames(names){
  var low=(names||[]).map(enLower).filter(function(x){return x;});
  if(!low.length)return "";
  if(low.length===1)return low[0];
  var split=low.map(function(n){return n.split(" ");});
  var last=split[0][split[0].length-1];
  var share=split.every(function(a){return a.length>1&&a[a.length-1]===last;});
  if(share){
    var heads=split.map(function(a){return a.slice(0,a.length-1).join(" ");});
    return heads.join(" and ")+" "+last;   // ortak son kelime bir kez yazılır
  }
  return low.join(" and ");
}
function fmtDayMonEN(s){try{var d=new Date(s+"T00:00:00");return d.getDate()+" "+EN_MONTHS[d.getMonth()].slice(0,3);}catch(e){return s;}}
// İşin hangi tarihler arasında sürdüğü (özet tablosunda Status'ün yanında)
function itemDateRange(it,dateISO){
  var a=chainStartDate(it.chainId,dateISO)||dateISO,b=dateISO;
  (it.entries||[]).forEach(function(en){if(en.status==="tamam"&&en.doneDate&&en.doneDate>b)b=en.doneDate;});
  var s1=fmtDayMonEN(a),s2=fmtDayMonEN(b);
  return s1===s2?s1:(s1+" – "+s2);
}
function narrativeLabel(kind){
  return {commenced:"Commenced",ongoing:"Ongoing",completed:"Completed",waiting:"Waiting",planned:"Planned"}[kind]||"Ongoing";
}
function narrativeColor(kind){
  if(kind==="planned")return STATUSES.planlandi.color;
  if(kind==="commenced")return STATUSES.started.color;
  if(kind==="completed")return STATUSES.tamam.color;
  if(kind==="waiting")return STATUSES.bekleme.color;
  return STATUSES.devam.color;
}
// İşin o günkü durumu: zincirin ilk günü -> commenced, bittiyse -> completed, yoksa -> ongoing
function itemNarrativeKind(it,dateISO){
  var stt=deriveItemStatus(it);
  if(it.status==="tamam"||stt==="tamam")return "completed";
  // Bekleme kuralı tek kaynaktadır (deriveItemStatus): yalnızca gerçekten bekleyen işler
  if(it.status==="bekleme"||stt==="bekleme")return "waiting";
  if(it.status==="planlandi"||it.status==="soon"||stt==="planlandi"||stt==="soon")return "planned";
  var startD=chainStartDate(it.chainId,dateISO);
  if(!startD||startD===dateISO)return "commenced";
  return "ongoing";
}
// Ana cümle
function itemMainSentence(it,dateISO){
  var ph=enActivityPhrase(it.job,enLower(it.title||""));
  if(!ph.text)return "";
  return ph.text+" "+enPhraseFor(itemNarrativeKind(it,dateISO),ph.plural)+".";
}
// Aşama cümleleri: bugün tamamlananlar, devam edenler, yeni başlayanlar
// withLoc=false ise lokasyon tekrar yazılmaz (satırın ilk cümlesi zaten lokasyonu içerir)
function itemStageSentences(it,dateISO,withLoc,mainKind){
  var groups={tamam:[],devam:[],started:[]};
  var namedTotal=(it.entries||[]).filter(function(en){return (en.name||"").trim();}).length;
  (it.entries||[]).forEach(function(en){
    var stt=en.status||(en.done?"tamam":"devam");
    if(!groups[stt])return;
    if(stt==="tamam"&&en.doneDate&&dateISO&&en.doneDate!==dateISO)return; // eski günlerde biten aşama tekrar yazılmaz
    var nm=(en.name||"").trim();
    if(nm)groups[stt].push(nm);
  });
  var out=[];
  [["tamam","completed"],["devam","ongoing"],["started","commenced"]].forEach(function(pair){
    var names=groups[pair[0]];
    if(!names.length)return;
    // bütün aşamalar aynı durumdaysa ve bu durum işin genel durumuyla aynıysa, ana cümle zaten anlatıyor
    if(mainKind&&pair[1]===mainKind&&names.length>=namedTotal)return;
    var ph=enActivityPhrase(withLoc?it.job:"",mergeStageNames(names));
    if(!ph.text)return;
    out.push(ph.text+" "+enPhraseFor(pair[1],ph.plural||names.length>1)+".");
  });
  return out;
}
// Rapora giren tam satır (kullanıcı elle yazdıysa aynen onun metni kullanılır)
function itemReportLine(it,dateISO){
  if(it.reportText&&it.reportText.trim())return it.reportText.trim();
  var parts=[],seen={};
  function add(x){
    var k=(x||"").trim().toLocaleLowerCase("en");
    if(!k||seen[k])return;                    // aynı cümleyi iki kez yazma
    seen[k]=true;parts.push(x.trim());
  }
  var main=itemMainSentence(it,dateISO);
  add(main);
  // ana cümle varsa lokasyon zaten yazıldı -> aşama cümlelerinde tekrarlanmaz
  itemStageSentences(it,dateISO,!main,itemNarrativeKind(it,dateISO)).forEach(add);
  return parts.join(" ");
}
// Yarın için cümle
function itemPlanSentence(it){
  if(it.planText&&it.planText.trim())return it.planText.trim();
  var ph=enActivityPhrase(it.job,enLower(it.title||""));
  if(!ph.text)return "";
  var word;
  if(it.tomorrow==="bitecek")word="completed";
  else{
    var stt=deriveItemStatus(it);
    // henüz başlamamış iş (Planned/Soon) -> yarın başlayacak
    word=(stt==="planlandi"||stt==="soon"||it.status==="planlandi"||it.status==="soon")?"commenced":"ongoing";
  }
  return ph.text+" will be "+word+".";
}

function buildWeeks(vy,vm){
  var first=new Date(vy,vm,1);var off=(first.getDay()+6)%7;var cur=new Date(vy,vm,1-off);var w=[];
  for(var i=0;i<6;i++){var row=[];for(var j=0;j<7;j++){row.push(new Date(cur));cur.setDate(cur.getDate()+1);}w.push(row);}
  return w;
}
function statusCounts(items){var c={planlandi:0,started:0,devam:0,bekleme:0,tamam:0,soon:0};(items||[]).forEach(function(i){if(c[i.status]!=null)c[i.status]++;});return c;}
// Bir tarih hangi özel güne denk geliyor? (start/end startDate/endDate'ten, ddin/ddout milestones'tan)
function milestoneFor(project,dISO){
  if(!project)return null;
  if(project.startDate===dISO)return MILESTONES.start;
  if(project.actualExit&&project.actualExit===dISO)return MILESTONES.actualExit;
  if(project.endDate&&project.endDate===dISO)return MILESTONES.end;
  var ms=project.milestones||{};
  if(ms.ddin===dISO)return MILESTONES.ddin;
  if(ms.ddout===dISO)return MILESTONES.ddout;
  return null;
}
// Tersane süresi: başlangıç..bitiş arası mı? (G# sadece bu aralıkta gösterilir)
function inYardRange(project,dISO){
  var dn=dayNumber(dISO,project.startDate);
  if(dn<1)return false;
  // gerçek çıkış varsa ondan sonra dur; yoksa süre açık (planlanan aşılsa bile 51/35 gösterilir)
  if(project.actualExit && dISO>project.actualExit)return false;
  return true;
}

// fotoğrafları 2 sütunlu tablo halinde, 7.33x5.5cm kutuya oran koruyarak
function dxPhotos(dx,ids,ctxMap,sizeMap,vanish){
  var ph=(ids||[]).map(function(id){return {id:id,data:ctxMap[id]};}).filter(function(p){return p.data;});
  if(!ph.length)return "";
  // Resimler arası boşluk yatayda ve dikeyde AYNI: 240 twip = 12 punto (bir satır).
  // Yatayda font genişliğine bağlı kalmamak için sekme durağı kullanılır.
  var PH_W=8.60,PH_H=6.45;                       // cm
  var PH_GAP=240;                                // twip (12 punto) — bir satır boşluğu
  var PH_TAB=Math.round(PH_W*566.93)+PH_GAP;     // ikinci resmin başlayacağı kesin konum
  function imgRun(p){var r=dxImage(dx,p.data,PH_W,PH_H,{stretch:true});return vanish?('<w:rPr><w:vanish/></w:rPr>'+r):r;}
  // TABLO KULLANMA: her satır (2 fotoğraf) normal bir paragraf. Böylece Word'de metin gibi seçilir/kopyalanır,
  // sonraki içeriği etkilemez. İki fotoğraf arası küçük boşluk için aralarına boşluk run'ı konur.
  // Bir işin TÜM fotoğrafları TEK paragrafta toplanır: satırlar arasında paragraf değil
  // satır sonu (<w:br/>) kullanılır. Böylece Word'de paragrafa üç kez tıklayınca o işin
  // bütün fotoğrafları birden seçilir ve satır aralığı kopyala/yapıştırda korunur.
  // EN SADE YAPI: her fotoğraf satırı (2 fotoğraf) ayrı, sıradan bir paragraf.
  // Özel satır yüksekliği, tablo veya blok gruplama YOK — böylece Word'de kopyala/yapıştır
  // tamamen normal davranır, Enter'a basınca fazladan boşluk açılmaz.
  var out="";
  for(var i=0;i<ph.length;i+=2){
    var isLast=(i+2>=ph.length);
    var runs=imgRun(ph[i]);
    if(ph[i+1])runs+='<w:r><w:tab/></w:r>'+imgRun(ph[i+1]); // iki fotoğraf arası: tam 12 punto
    out+=dxPara(runs,{jc:"left",spacingBefore:0,spacingAfter:0,tabAt:PH_TAB});
    // resim satırından sonra tam 12 puntoluk boşluk satırı (yataydakiyle birebir aynı)
    out+=dxPara("",{spacingBefore:0,spacingAfter:0,line:PH_GAP,lineRule:"exact"});
  }
  return out;
}

function canShareFiles(){
  try{
    if(!navigator.share||!navigator.canShare||typeof File==="undefined")return false;
    return navigator.canShare({files:[new File(["x"],"t.txt",{type:"text/plain"})]});
  }catch(e){return false;}
}
function shareOrDownload(filename,blob,title){
  try{
    var file=new File([blob],filename,{type:blob.type||"application/octet-stream"});
    if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
      return navigator.share({files:[file],title:title||filename}).then(function(){return "shared";})
        .catch(function(err){
          if(err&&err.name==="AbortError")return "cancel";        // kullanıcı vazgeçti
          downloadBlob(filename,blob);toast("Paylaşılamadı · "+((err&&err.name)||"hata")+" · dosya İndirilenler'e kaydedildi");return "downloaded";
        });
    }
  }catch(e){}
  downloadBlob(filename,blob);toast("Dosya İndirilenler'e kaydedildi");
  return Promise.resolve("downloaded");
}

// Bölüm raporu: seçilen bölümdeki işler lokasyona göre gruplu, başta köprülü içindekiler.
// Görsel odaklı özet rapor: her iş (zincir) bir kez, tüm fotoğrafları 2 sütunlu galeri
// Bir işin (chain) gün gün aşamalarını + fotoğraflarını basar
// ===== Rapor Taslağı (düzenlenebilir önizleme) =====
// Bir bloğun "başlık seviyesi" — grup taşıma için. null = başlık değil (içerik)
function draftHeadLevel(b){
  if(!b)return null;
  if(b.type==="heading")return 0;
  return null; // içerik blokları
}
// index'teki başlık bloğunun grubunu (kendisi + altındaki, daha düşük seviye başlığa kadar olan tüm bloklar) döndürür [start,end)
function draftGroupRange(blocks,index){
  var lvl=draftHeadLevel(blocks[index]);
  if(lvl==null)return null; // başlık değil -> grup yok
  var end=index+1;
  while(end<blocks.length){
    var hl=draftHeadLevel(blocks[end]);
    // aynı veya daha üst seviye başlık gelince grup biter; daha alt seviye başlık ve içerik gruba dahil
    if(hl!=null&&hl<=lvl)break;
    end++;
  }
  return {start:index,end:end,level:lvl};
}
// index'teki bloğu (başlıksa grubuyla) yukarı/aşağı taşır. Aynı seviyedeki komşu grupla yer değiştirir.
function moveDraftBlock(blocks,index,dir){
  var grp=draftGroupRange(blocks,index);
  if(!grp){
    // başlık değil: tek blok basit takas (aynı içerik bloğuyla)
    var j=index+dir;
    if(j<0||j>=blocks.length)return false;
    var t=blocks[index];blocks[index]=blocks[j];blocks[j]=t;return true;
  }
  var lvl=grp.level;
  if(dir<0){
    // yukarı: bir önceki, aynı seviyedeki grubu bul
    var prevEnd=grp.start;
    if(prevEnd<=0)return false;
    // grubun hemen öncesindeki bloktan geriye giderek aynı seviye başlığı bul
    var p=prevEnd-1;
    // p'nin ait olduğu grubun başını bul: aynı/üst seviye başlık ara
    var prevHeadIdx=-1;
    for(var k=p;k>=0;k--){var hl=draftHeadLevel(blocks[k]);if(hl!=null&&hl<=lvl){prevHeadIdx=k;break;}}
    if(prevHeadIdx<0)return false;
    var prevHl=draftHeadLevel(blocks[prevHeadIdx]);
    if(prevHl!==lvl)return false; // üst seviyeye çıkamaz (örn ilk alt başlık)
    var prevGrp=draftGroupRange(blocks,prevHeadIdx);
    // prevGrp ile grp yer değiştir
    var moving=blocks.slice(grp.start,grp.end);
    var target=blocks.slice(prevGrp.start,prevGrp.end);
    var before=blocks.slice(0,prevGrp.start);
    var after=blocks.slice(grp.end);
    var newArr=before.concat(moving).concat(target).concat(after);
    for(var x=0;x<blocks.length;x++)blocks[x]=newArr[x];
    return true;
  }else{
    // aşağı: bir sonraki, aynı seviyedeki grubu bul
    var nextIdx=grp.end;
    if(nextIdx>=blocks.length)return false;
    var nextHl=draftHeadLevel(blocks[nextIdx]);
    if(nextHl==null||nextHl>lvl)return false; // sonraki blok içerik veya alt başlık değil aynı seviye değil
    if(nextHl<lvl)return false; // üst seviye başlık geldi, taşınamaz
    var nextGrp=draftGroupRange(blocks,nextIdx);
    var moving2=blocks.slice(grp.start,grp.end);
    var target2=blocks.slice(nextGrp.start,nextGrp.end);
    var before2=blocks.slice(0,grp.start);
    var after2=blocks.slice(nextGrp.end);
    var newArr2=before2.concat(target2).concat(moving2).concat(after2);
    for(var y=0;y<blocks.length;y++)blocks[y]=newArr2[y];
    return true;
  }
}

function draftPrintHTML(d){
  var p=App.project||{};
  function cellText(c){
    if(c==null)return "";
    if(c.text!=null)return String(c.text);
    if(c.runs){var m=String(c.runs).match(/<w:t[^>]*>([^<]*)</);return m?m[1]:"";}
    return "";
  }
  var h='<div class="pr-doc">';
  h+='<div class="pr-head"><div class="pr-t">'+esc(d.title||"RAPOR")+'</div><div class="pr-s">'+esc(p.shipName||"")+(p.yard?" &middot; "+esc(p.yard):"")+'</div></div>';
  var blocks=d.blocks||[];
  var eaten={};
  // band blogu, kendisinden sonraki ardisik cumleleri tek cerceveye toplar (docx ile ayni)
  blocks.forEach(function(b,bi){
    if(b.type!=="band")return;
    var lines=[];
    for(var j=bi+1;j<blocks.length;j++){
      var nb=blocks[j];
      if(nb.type==="sentence"){lines.push({text:nb.text||"",group:(nb.src&&nb.src.group)||null});eaten[j]=true;continue;}
      if(nb.type==="plannedextra"){
        String(nb.text||"").split("\n").forEach(function(ln){if(ln.trim())lines.push({text:ln.trim(),group:"extra"});});
        eaten[j]=true;continue;
      }
      break;
    }
    b._prLines=lines;
  });
  blocks.forEach(function(b,bi){
    if(eaten[bi])return;
    if(b.type==="info")h+='<div class="pr-info">'+esc(b.text||"")+'</div>';
    else if(b.type==="meta")h+='<div class="pr-meta">'+esc(b.text||"")+'</div>';
    else if(b.type==="heading")h+='<div class="pr-h'+(b.pageBreak?" pr-brk":"")+'">'+esc(b.text||"")+'</div>';
    else if(b.type==="table"){
      var rows=b.rows||[];
      h+='<table class="pr-tb">';
      rows.forEach(function(r,ri){
        h+="<tr>";
        r.forEach(function(c){
          var tag=(ri===0)?"th":"td";
          var cls=(c&&c.jc==="center")?' class="c"':"";
          h+="<"+tag+cls+">"+esc(cellText(c))+"</"+tag+">";
        });
        h+="</tr>";
      });
      h+="</table>";
    }
    else if(b.type==="band"){
      h+='<div class="pr-band">'+esc(b.text||"")+'</div><div class="pr-lines">';
      var lines=b._prLines||[],prev=null;
      if(!lines.length)h+='<p>&mdash;</p>';
      lines.forEach(function(o){
        var gap=(prev!==null&&o.group!==null&&o.group!==prev);
        h+='<p'+(gap?' class="gap"':'')+'>'+esc(o.text)+'</p>';
        if(o.group!==null)prev=o.group;
      });
      h+='</div>';
    }
    else if(b.type==="caption")h+='<div class="pr-cap'+(b.pageBreak?" pr-brk":"")+'">'+(b.num?esc(b.num+". "):"")+esc(b.text||"")+'</div>';
    else if(b.type==="extranote"){if((b.text||"").trim())h+='<div class="pr-note">'+esc(b.text)+'</div>';}
    else if(b.type==="photos"){
      var ids=(b.photos||[]).map(function(x){return (x&&x.id)?x.id:x;});
      var any=false,inner="";
      ids.forEach(function(id){var src=(d.photoMap||{})[id]||photoData(id);if(src){any=true;inner+='<img src="'+src+'"/>';}});
      if(any)h+='<div class="pr-ph">'+inner+'</div>';
    }
    else if(b.type==="notes"){if((b.text||"").trim())h+='<div class="pr-h">Additional notes</div><div class="pr-notes">'+esc(b.text)+'</div>';}
    else if(b.type==="sentence")h+='<p>'+esc(b.text||"")+'</p>';
    else if(b.text)h+='<p>'+esc(b.text)+'</p>';
  });
  h+='</div>';
  return h;
}

    try{window.print();}catch(e){toast("Yazdırma açılamadı");cleanup();return;}

// DOM'daki input değerlerini taslak modeline yaz
// Taslak kurulurken her (date|itemId) için üretilen orijinal entry index'leri
function computeProducedMap(blocks){
  var m={};
  blocks.forEach(function(b){
    if(b.src&&b.src.itemId&&b.src.entryIdx!=null){
      var key=b.src.date+"|"+b.src.itemId;
      (m[key]=m[key]||[]);if(m[key].indexOf(b.src.entryIdx)<0)m[key].push(b.src.entryIdx);
    }
  });
  return m;
}

  var changed=0,removed=0;
  // === 1) refs'li alan blokları (bolum/loc/jobtitle) -> kapsadıkları tüm işlere yaz ===
