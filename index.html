// Kullanıcı dokunuşu içinde çağrılmalı (Google penceresi açılır)
function driveSignIn(silent){
  var c=driveCfg();if(!c.clientId)return Promise.reject(new Error("Client ID yok"));
  return driveLoadGis().then(function(){return new Promise(function(resolve,reject){
    DRV.client=google.accounts.oauth2.initTokenClient({client_id:c.clientId,scope:"https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive.readonly",
      callback:function(r){
        if(r&&r.access_token){DRV.token=r.access_token;DRV.exp=Date.now()+((+r.expires_in||3600)*1000);DRV.needTap=false;
          try{sessionStorage.setItem("gt_drv_tok",JSON.stringify({t:DRV.token,e:DRV.exp}));}catch(e){}
          c.enabled=true;driveSaveCfg(c);resolve(true);}
        else reject(new Error((r&&r.error)||"giriş olmadı"));
      },
      error_callback:function(e){reject(new Error((e&&e.type)||"giriş penceresi kapandı"));}});
    DRV.client.requestAccessToken({prompt:silent?"":"consent"});
  });});
}
function driveFetch(url,opt,raw,tries){
  opt=opt||{};opt.headers=opt.headers||{};opt.headers.Authorization="Bearer "+DRV.token;
  var isGet=!opt.method||opt.method==="GET";tries=tries||0;
  return fetch(url,opt).then(function(r){
    if(r.status===401){DRV.token=null;DRV.needTap=true;throw new Error("Drive oturumu süresi doldu");}
    if((r.status===429||r.status>=500)&&tries<3)return new Promise(function(z){setTimeout(z,2000*(tries+1));}).then(function(){return driveFetch(url,opt,raw,tries+1);});
    if(!r.ok)return r.text().then(function(t){throw new Error("Drive "+r.status+": "+t.slice(0,120));});
    return raw?r:r.json();
  },function(e){
    // ağ kopması: okuma isteklerini birkaç kez tekrar dene
    if(isGet&&tries<3)return new Promise(function(z){setTimeout(z,1500*(tries+1));}).then(function(){return driveFetch(url,opt,raw,tries+1);});
    throw e;
  });
}
function driveFindOrCreateFolder(name,parent){
  var q="name='"+name.replace(/'/g,"\\'")+"' and mimeType='application/vnd.google-apps.folder' and trashed=false"+(parent?" and '"+parent+"' in parents":"");
  return driveFetch(DRIVE_API+"/files?q="+encodeURIComponent(q)+"&fields=files(id)&spaces=drive").then(function(j){
    if(j.files&&j.files.length)return j.files[0].id;
    var meta={name:name,mimeType:"application/vnd.google-apps.folder"};if(parent)meta.parents=[parent];
    return driveFetch(DRIVE_API+"/files?fields=id",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(meta)}).then(function(f){return f.id;});
  });
}
function driveFolders(){
  var c=driveCfg();
  if(c.root&&c.photos)return Promise.resolve(c);
  return driveFindOrCreateFolder("GemiTakip").then(function(root){c.root=root;return driveFindOrCreateFolder("fotolar",root);})
    .then(function(ph){c.photos=ph;driveSaveCfg(c);return c;});
}
function driveMultipart(meta,blob,method,fileId){
  var bnd="gtb"+Math.random().toString(36).slice(2);
  var body=new Blob(["--"+bnd+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"+JSON.stringify(meta)+"\r\n--"+bnd+"\r\nContent-Type: "+(blob.type||"application/octet-stream")+"\r\n\r\n",blob,"\r\n--"+bnd+"--"]);
  var url=fileId?(DRIVE_UPLOAD+"/files/"+fileId+"?uploadType=multipart&fields=id"):(DRIVE_UPLOAD+"/files?uploadType=multipart&fields=id");
  return driveFetch(url,{method:method||"POST",headers:{"Content-Type":"multipart/related; boundary="+bnd},body:body});
}
function dataUrlToBlob(u){var dp=dataUrlParts(u);if(!dp)return null;return new Blob([b64ToBytes(dp.b64)],{type:dp.mime});}
function blobToDataUrl(b){return new Promise(function(res){var fr=new FileReader();fr.onload=function(){res(fr.result);};fr.onerror=function(){res(null);};fr.readAsDataURL(b);});}
// Veri: tüm işler + gemi arşivleri tek dosyada (veri yedeğiyle aynı biçim)
function buildDataSnapshot(){
  var meta={_app:"gemi-tersane-takip",_v:3,_date:new Date().toISOString(),keys:{}};
  for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(isAppKey(k)&&k!==DRIVE_KEY&&k!==DRIVE_UP_KEY)meta.keys[k]=localStorage.getItem(k);}
  Object.keys(SLOT_CACHE).forEach(function(id){var k2=slotDataKey(id);if(!meta.keys[k2])meta.keys[k2]=JSON.stringify(SLOT_CACHE[id]);});
  return meta;
}
function snapshotHasShip(meta){
  var k=meta&&meta.keys||{};if(k[PROJECT_KEY])return true;
  return Object.keys(k).some(function(x){return x.indexOf("tersane_slotdata_")===0;});
}
function driveUploadData(c){
  var snap=buildDataSnapshot();
  if(!snapshotHasShip(snap))return Promise.resolve(null);      // boş telefon Drive'daki dolu kaydın üzerine yazmasın
  var blob=new Blob([JSON.stringify(snap)],{type:"application/json"});
  var go=function(){
    if(c.dataId)return driveMultipart({},blob,"PATCH",c.dataId);
    return driveMultipart({name:"gemitakip-veri.json",parents:[c.root]},blob).then(function(f){c.dataId=f.id;driveSaveCfg(c);return f;});
  };
  return go().catch(function(e){if(/404/.test(String(e.message))){c.dataId=null;driveSaveCfg(c);return go();}throw e;});
}
function driveUploadPhotos(c,limit){
  var up=driveUploaded();
  return idbListIds().then(function(ids){
    var pend=ids.filter(function(id){return !up[id];});DRV.pendingPhotos=pend.length;
    var batch=pend.slice(0,limit||25),ch=Promise.resolve(),n=0;
    batch.forEach(function(id){ch=ch.then(function(){
      return idbGetOne(id).then(function(v){
        var blob=v&&dataUrlToBlob(v);if(!blob){up[id]="-";return;}
        return driveMultipart({name:id+"."+(dataUrlParts(v).ext),parents:[c.photos],appProperties:{gt:id}},blob).then(function(f){
          up[id]=f.id;n++;DRV.pendingPhotos--;if(n%5===0)setJSON(DRIVE_UP_KEY,up);
        });
      });
    });});
    return ch.then(function(){setJSON(DRIVE_UP_KEY,up);return {sent:n,left:DRV.pendingPhotos};});
  });
}
// Drive'daki fotoğrafların listesi (yeni telefonda ya da depo silindiğinde eşleme buradan kurulur)
function driveListPhotos(c){
  var map={};

    var q="'"+c.photos+"' in parents and trashed=false";
    return driveFetch(DRIVE_API+"/files?q="+encodeURIComponent(q)+"&fields=nextPageToken,files(id,name,appProperties)&pageSize=1000"+(tok?"&pageToken="+tok:"")).then(function(j){
      (j.files||[]).forEach(function(f){var id=(f.appProperties&&f.appProperties.gt)||f.name.replace(/\.\w+$/,"");map[id]=f.id;});
      return j.nextPageToken?page(j.nextPageToken):map;

function driveRestoreMissing(onProgress){
  if(DRV.downloading)return DRV.downloading;
  var c;
  DRV.downloading=driveFolders().then(function(c0){c=c0;return Promise.all([driveListPhotos(c),idbListIds()]);}).then(function(r){
    var remote=r[0],have={};r[1].forEach(function(id){have[id]=1;});
    var up=driveUploaded();Object.keys(remote).forEach(function(id){up[id]=remote[id];});setJSON(DRIVE_UP_KEY,up);
    var ref=referencedPhotoIds();
    var need=Object.keys(remote).filter(function(id){return !have[id];});
    need.sort(function(a,b){return (ref[b]?1:0)-(ref[a]?1:0);});     // işlerde kullanılanlar önce
    var done=0,ch=Promise.resolve();
    need.forEach(function(id){ch=ch.then(function(){
      return driveFetch(DRIVE_API+"/files/"+remote[id]+"?alt=media",{},true).then(function(res){return res.blob();}).then(blobToDataUrl).then(function(u){

        if(!/^data:image\//.test(u))u=u.replace(/^data:[^;]*;/,"data:image/jpeg;");
        done++;return idbPut(id,u).then(function(){if(onProgress&&done%5===0)onProgress(done,need.length);});
      });
    });});
    return ch.then(function(){for(var k in _lazyMiss)delete _lazyMiss[k];return {downloaded:done,total:need.length};});
  });
  return DRV.downloading.then(function(r){DRV.downloading=null;return r;},function(e){DRV.downloading=null;throw e;});

var DRV_UPM=null,DRV_UPM_DIRTY=0,DRV_MAP_LISTED=false;

var DRV_SEM={n:0,q:[]};
function driveLimited(fn){
  return new Promise(function(res,rej){
    function run(){DRV_SEM.n++;Promise.resolve().then(fn).then(function(v){DRV_SEM.n--;next();res(v);},function(e){DRV_SEM.n--;next();rej(e);});}
    function next(){if(DRV_SEM.q.length&&DRV_SEM.n<4)DRV_SEM.q.shift()();}
    if(DRV_SEM.n<4)run();else DRV_SEM.q.push(run);
  });
}

function withTimeout(p,ms,fb){return Promise.race([p.catch(function(e){return {hata:String(e&&e.message||e)};}),new Promise(function(r){setTimeout(function(){r(fb);},ms);})]);}
function rawDbInfo(name){
  return new Promise(function(resolve){
    try{
      var req=indexedDB.open(name);
      req.onupgradeneeded=function(ev){try{ev.target.transaction.abort();}catch(e){}resolve({yok:true});};
      req.onblocked=function(){resolve({blocked:true});};
      req.onerror=function(){resolve({hata:String(req.error&&req.error.name||"open error")});};
      req.onsuccess=function(ev){
        var db=ev.target.result,info={version:db.version,stores:Array.prototype.slice.call(db.objectStoreNames),counts:{},ornek:{}};
        var pend=info.stores.length;if(!pend){db.close();resolve(info);return;}
        info.stores.forEach(function(st){
          try{var tx=db.transaction(st,"readonly"),os=tx.objectStore(st);
            var c=os.count();c.onsuccess=function(){info.counts[st]=c.result;};
            var k=os.getAllKeys?os.getAllKeys(null,5):null;if(k)k.onsuccess=function(){info.ornek[st]=k.result.map(String);};
            tx.oncomplete=tx.onerror=tx.onabort=function(){if(--pend===0){db.close();resolve(info);}};
          }catch(e){info.counts[st]="hata: "+e.name;if(--pend===0){db.close();resolve(info);}}
        });
      };
    }catch(e){resolve({hata:String(e)});}
  });
}

   Gemi arşivi silinince fotoğrafları telefonda kalıyordu; görünmüyor ama yer kaplıyor ve yedeğe giriyordu. */
function referencedPhotoIds(){
  var ref={};
  function addRep(rep){
    if(!rep)return;
    (rep.items||[]).forEach(function(it){(it.entries||[]).forEach(function(en){(en.photos||[]).forEach(function(p){var id=(p&&p.id)?p.id:p;if(id)ref[id]=1;});});});
    (rep.pool||[]).forEach(function(p){var id=(p&&p.id)?p.id:p;if(id)ref[id]=1;});
  }
  // açık gemi
  (App.index||[]).forEach(function(d){addRep(getJSON(reportKey(d),null));});
  (App.items||[]).forEach(function(it){addRep({items:[it]});});
  // tüm gemi arşivleri (açık geminin eski kopyası dahil — güvenli taraf)
  slotIds().forEach(function(id){
    var data=slotGet(id);if(!data)return;
    Object.keys(data).forEach(function(k){
      if(k.indexOf("tersane_rapor_")!==0)return;
      try{addRep(JSON.parse(data[k]));}catch(e){}
    });
  });
  // silinmiş ama hâlâ geri alınabilir işler
  if(App.undoDel)(App.undoDel.photoIds||[]).forEach(function(id){ref[id]=1;});
  // açık düzenleyicideki kaydedilmemiş fotoğraflar
  if(App.editor&&App.editor.draft)(App.editor.draft.entries||[]).forEach(function(en){(en.photos||[]).forEach(function(p){var id=(p&&p.id)?p.id:p;if(id)ref[id]=1;});});
  return ref;
}

/* ===================== Yedekten gemi ekle (akışlı) =====================
   Eski tek dosyalık yedekler fotoğrafları içinde taşıyor ve yüzlerce MB olabiliyor. Tarayıcı bu kadar büyük bir
   metni tek parça okuyamıyor; dosya parça parça okunur, fotoğraflar tek tek depoya yazılır.
   Yedekteki gemiler AYRI arşiv gemisi olarak eklenir: açık gemiye ve mevcut arşivlere dokunulmaz. */
var IMPORT_CHUNK=8*1024*1024;
function streamBackupFile(file,onKey,onPhoto,onProgress){
  var dec=new TextDecoder("utf-8"),pos=0,size=file.size;
  // ayrıştırıcı durumu
  var depth=0,section=null,expect="value0",inStr=false,strFor=null,buf=[],bsRun=0,curKey=null,topKey=null,skip=0,skipStr=false,skipEsc=false,prim="";
  var meta={};
  function endString(raw){
    var v=raw.indexOf("\\")>=0?JSON.parse('"'+raw+'"'):raw;
    if(strFor==="topkey"){topKey=v;expect="colon";}
    else if(strFor==="topval"){meta[topKey]=v;expect="comma";}
    else if(strFor==="key2"){curKey=v;expect="colon";}
    else if(strFor==="val2"){
      if(section==="fotolar")onPhoto(curKey,v);else if(section==="keys")onKey(curKey,v);
      expect="comma";
    }
  }
  function feed(t){
    var i=0,n=t.length;
    while(i<n){
      if(inStr){
        var j=t.indexOf('"',i);
        if(j<0){var seg=t.substring(i);buf.push(seg);var m=seg.match(/\\+$/);bsRun=m?(m[0].length===seg.length?bsRun+m[0].length:m[0].length):0;return;}
        var k=j-1,c=0;while(k>=i&&t.charCodeAt(k)===92){c++;k--;}
        if(k<i)c+=bsRun;
        if(c%2===1){buf.push(t.substring(i,j+1));bsRun=0;i=j+1;continue;}
        buf.push(t.substring(i,j));var raw=buf.join("");buf=[];bsRun=0;inStr=false;i=j+1;endString(raw);continue;
      }
      if(skip>0){                               // beklenmeyen iç içe yapı: sadece atla
        var ch0=t[i];i++;
        if(skipStr){if(skipEsc)skipEsc=false;else if(ch0==="\\")skipEsc=true;else if(ch0==='"')skipStr=false;continue;}
        if(ch0==='"')skipStr=true;else if(ch0==="{"||ch0==="[")skip++;else if(ch0==="}"||ch0==="]"){skip--;if(skip===0)expect="comma";}
        continue;
      }
      var ch=t[i];
      if(ch===" "||ch==="\n"||ch==="\r"||ch==="\t"){i++;continue;}
      if(expect==="value0"){if(ch!=="{")throw new Error("Yedek dosyası tanınmadı");depth=1;expect="key";i++;continue;}
      if(expect==="key"){
        if(ch==="}"){i++;if(depth===2){depth=1;section=null;expect="comma";}else{depth=0;expect="done";}continue;}
        if(ch!=='"')throw new Error("Yedek dosyası bozuk");
        inStr=true;strFor=(depth===1?"topkey":"key2");buf=[];bsRun=0;i++;continue;
      }
      if(expect==="colon"){if(ch!==":")throw new Error("Yedek dosyası bozuk");expect="val";i++;continue;}
      if(expect==="val"){
        if(ch==='"'){inStr=true;strFor=(depth===1?"topval":"val2");buf=[];bsRun=0;i++;continue;}
        if(ch==="{"&&depth===1&&(topKey==="keys"||topKey==="fotolar")){depth=2;section=topKey;expect="key";i++;continue;}
        if(ch==="{"||ch==="["){skip=1;skipStr=false;skipEsc=false;i++;continue;}
        expect="prim";prim="";continue;
      }
      if(expect==="prim"){
        if(ch===","||ch==="}"){if(depth===1)meta[topKey]=prim;expect="comma";continue;}
        prim+=ch;i++;continue;
      }
      if(expect==="comma"){
        if(ch===","){expect="key";i++;continue;}
        if(ch==="}"){i++;if(depth===2){depth=1;section=null;expect="comma";}else{depth=0;expect="done";}continue;}
        throw new Error("Yedek dosyası bozuk");
      }
      if(expect==="done"){i++;continue;}
    }
  }
  function finish(){feed(dec.decode());if(depth!==0)return Promise.reject(new Error("Yedek dosyası yarım: sonu eksik"));return Promise.resolve(meta);}
  function step(){
    if(file.nextChunk){                         // akış kaynağı (Drive'dan indirme)
      return file.nextChunk().then(function(u8){
        if(!u8)return finish();
        feed(dec.decode(u8,{stream:true}));pos+=u8.length;
        return Promise.resolve(onProgress(pos,size||pos)).then(step);
      });
    }
    if(pos>=size)return finish();
    var end=Math.min(size,pos+IMPORT_CHUNK);
    return file.slice(pos,end).arrayBuffer().then(function(ab){
      feed(dec.decode(new Uint8Array(ab),{stream:true}));
      pos=end;
      return Promise.resolve(onProgress(pos,size)).then(step);
    });
  }
  return step();
}
function shipFingerprint(data){
  try{var p=JSON.parse(data[PROJECT_KEY]||"{}");var n=0;Object.keys(data).forEach(function(k){if(k.indexOf("tersane_rapor_")===0)n+=String(data[k]).length;});
    return (p.shipName||"").trim().toLowerCase()+"|"+(data[INDEX_KEY]||"");}catch(e){return "";}
}
function importBackupAsShips(file,onProgress){
  var keys={},pending=[],photos=0,wakeLock=null;
  try{if(navigator.wakeLock)navigator.wakeLock.request("screen").then(function(w){wakeLock=w;}).catch(function(){});}catch(e){}
  var stLocal=0,stDrive=0;
  function putPhoto(id,val){if(!id||typeof val!=="string"||val.indexOf("data:")!==0)return;photos++;pending.push(storePhotoEverywhere(id,val).then(function(r){if(r.local)stLocal++;if(r.drive)stDrive++;}));}
  return idbReady().then(function(){if(!IDB)throw new Error("Fotoğraf deposu açılamadı");return loadSlotStore();}).then(function(){
    return streamBackupFile(file,
      function(k,v){if(k.indexOf("tersane_foto_")===0)putPhoto(k.substring(13),v);else keys[k]=v;},
      putPhoto,
      function(done,total){var p=pending;pending=[];return Promise.all(p).then(function(){onProgress&&onProgress(done,total,photos);});});
  }).then(function(meta){
    return Promise.all(pending).then(function(){return meta;});
  }).then(function(meta){
    // yedekteki gemileri topla: o anki açık gemi + arşivdekiler
    var ships=[],active={};
    Object.keys(keys).forEach(function(k){
      if(k.indexOf("tersane_slotdata_")===0){try{var sd=JSON.parse(keys[k]);if(sd&&typeof sd==="object")ships.push(sd);}catch(e){}return;}
      if(k===SLOTS_KEY||k.indexOf("tersane_")!==0)return;
      active[k]=keys[k];
    });
    if(active[PROJECT_KEY])ships.unshift(active);
    var have={};slotIds().forEach(function(id){var d=slotGet(id);if(d)have[shipFingerprint(d)]=1;});
    have[shipFingerprint(collectActiveData())]=1;
    var slots=loadSlots(),added=[],ids=[],skipped=0,stamp=meta&&meta._date?String(meta._date).slice(0,10):"";
    var writes=[];
    ships.forEach(function(sd){
      var fp=shipFingerprint(sd);if(!fp||have[fp]){skipped++;return;}have[fp]=1;
      var p={};try{p=JSON.parse(sd[PROJECT_KEY]||"{}");}catch(e){}
      var ix=[];try{ix=JSON.parse(sd[INDEX_KEY]||"[]");}catch(e){}
      var id=newSlotId();
      writes.push(slotPut(id,sd));
      var nm=(p.shipName||"Gemi");
      slots.push({id:id,name:nm,shipName:p.shipName||"",savedAt:Date.now(),dayCount:ix.length,startDate:p.startDate||ix[0]||"",fromBackup:stamp});
      added.push(nm+" · "+ix.length+" gün");ids.push(id);
    });
    saveSlots(slots);
    return Promise.all(writes).then(function(){
      try{if(wakeLock)wakeLock.release();}catch(e){}
      if(stDrive)driveUpSave(true);
      return {added:added,ids:ids,skipped:skipped,photos:photos,local:stLocal,drive:stDrive,date:stamp};
    });
  });
}

  var bs=App.backupSheet||(App.backupSheet={status:null});
  bs.importing={done:0,total:file.size,photos:0,name:file.name};bs.importResult=null;render();
  importBackupAsShips(file,function(done,total,photos){
    var b=App.backupSheet&&App.backupSheet.importing;if(!b)return;
    b.done=done;b.photos=photos;
    var el=document.getElementById("bk-imp-prog");
    if(el)el.textContent="%"+Math.round(done*100/total)+" · "+photos+" fotoğraf aktarıldı";
    var bar=document.getElementById("bk-imp-bar");if(bar)bar.style.width=Math.round(done*100/total)+"%";
  }).then(function(r){
    if(App.backupSheet){App.backupSheet.importing=null;App.backupSheet.importResult=r;}
    try{repairSlots();}catch(e){}
    for(var _k in _lazyMiss)delete _lazyMiss[_k];
    toast(r.added.length?(r.added.length+" gemi eklendi · "+r.photos+" fotoğraf"):(r.photos+" fotoğraf aktarıldı"));
    render();updateStorageInfo();
  }).catch(function(e){
    if(App.backupSheet){App.backupSheet.importing=null;App.backupSheet.importResult={error:String(e&&e.message||e)};}
    render();
  });
}
/* ===================== Word raporundan gün ekle =====================
   Uygulamanın kendi "Günlük İş Raporu" Word dosyasından o günü geri kurar. Kayıp günleri kurtarmak için.
   Her iş, önceki gündeki aynı işin devamı olarak yazılır (aynı zincir); rapor aşamaları ve fotoğrafları
   üzerine işlenir. Var olan günlere dokunulmaz. */
var TR_MONTHS={"ocak":1,"şubat":2,"mart":3,"nisan":4,"mayıs":5,"haziran":6,"temmuz":7,"ağustos":8,"eylül":9,"ekim":10,"kasım":11,"aralık":12};
var RPT_STATUS={"planned":"planlandi","started":"started","commenced":"started","in progress":"devam","ongoing":"devam","waiting":"bekleme","done":"tamam","completed":"tamam","soon":"soon"};
function rptStatus(s){return RPT_STATUS[String(s||"").trim().toLowerCase()]||null;}
function docxEntries(bytes){
  var ents=readZipEntries(bytes),map={},ch=Promise.resolve();
  ents.forEach(function(e){ch=ch.then(function(){
    if(e.method===0){map[e.name]=e.data;return;}
    if(e.method===8)return inflateRaw(e.data).then(function(d){map[e.name]=d;});
  });});
  return ch.then(function(){return map;});
}
function parseAppReportDocx(bytes){
  return docxEntries(bytes).then(function(files){
    if(!files["word/document.xml"])throw new Error("Word dosyası değil");
    var xml=new DOMParser().parseFromString(utf8ToStr(files["word/document.xml"]),"application/xml");
    var rels={};
    if(files["word/_rels/document.xml.rels"]){
      var rx=new DOMParser().parseFromString(utf8ToStr(files["word/_rels/document.xml.rels"]),"application/xml");
      Array.prototype.forEach.call(rx.getElementsByTagName("Relationship"),function(r){rels[r.getAttribute("Id")]="word/"+r.getAttribute("Target").replace(/^\/?word\//,"");});
    }
    var W="http://schemas.openxmlformats.org/wordprocessingml/2006/main";
    var body=xml.getElementsByTagNameNS(W,"body")[0];if(!body)throw new Error("Word dosyası boş");
    function ptext(p){var s="";Array.prototype.forEach.call(p.getElementsByTagName("*"),function(n){if(n.localName==="t")s+=n.textContent;else if(n.localName==="br"||n.localName==="cr")s+="\n";else if(n.localName==="tab")s+=" ";});return s;}
    function pimgs(p){var out=[];Array.prototype.forEach.call(p.getElementsByTagName("*"),function(n){if(n.localName==="blip"){var id=n.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships","embed")||n.getAttribute("r:embed");if(id&&rels[id])out.push(rels[id]);}});return out;}
    function pbold(p){var b=p.getElementsByTagNameNS(W,"b");for(var i=0;i<b.length;i++){var v=b[i].getAttributeNS(W,"val")||b[i].getAttribute("w:val");if(v!=="0"&&v!=="false")return true;}return false;}
    var res={kind:"app",date:null,head:"",jobs:[],images:[],sentences:[]},cur=null,stage=null,started=false,first=true;
    var kids=Array.prototype.filter.call(body.childNodes,function(n){return n.nodeType===1&&(n.localName==="p"||n.localName==="tbl");});
    for(var i=0;i<kids.length;i++){
      var el=kids[i];
      if(el.localName==="tbl"){if(first)res.head=ptext(el);else res.images=res.images.concat(pimgs(el));first=false;continue;}
      first=false;
      var t=ptext(el).replace(/\s+$/,""),tt=t.trim(),imgs=pimgs(el);
      res.images=res.images.concat(imgs);if(tt)res.sentences.push(tt);
      if(!res.date){var md=/^(\d{1,2})\s+(\S+)\s+(\d{4})/.exec(tt);if(md&&TR_MONTHS[md[2].toLocaleLowerCase("tr")]){res.date=md[3]+"-"+("0"+TR_MONTHS[md[2].toLocaleLowerCase("tr")]).slice(-2)+"-"+("0"+md[1]).slice(-2);continue;}}
      if(tt==="İş Detayları"){started=true;continue;}
      if(!started)continue;
      // iş başlığı: "N. Lokasyon - Başlık" ve hemen ardından "Bölüm: ..." satırı
      var mj=/^(\d+)\.\s+(.+)$/.exec(tt);
      var nx=kids[i+1]?ptext(kids[i+1]).trim():"";
      if(mj&&/^Bölüm:/.test(nx)){
        cur={num:+mj[1],name:mj[2].trim(),bolum:"",status:null,progress:null,stages:[]};res.jobs.push(cur);stage=null;
        var meta=nx.split("|").map(function(x){return x.trim();});
        meta.forEach(function(m){
          if(/^Bölüm:/.test(m))cur.bolum=m.replace(/^Bölüm:\s*/,"").replace(/^-$/,"");
          else if(/^Durum:/.test(m))cur.status=rptStatus(m.replace(/^Durum:\s*/,"").replace(/\s*\(.*$/,""));
          else if(/^İlerleme:/.test(m)){var pg=/(\d+)/.exec(m);if(pg)cur.progress=+pg[1];}
        });
        i++;continue;
      }
      if(!cur)continue;
      if(imgs.length){(stage||(stage=(cur.stages[0]||(cur.stages[0]={name:"",status:null,desc:"",images:[]})))).images=stage.images.concat(imgs);continue;}
      if(!tt)continue;
      if(pbold(el)){
        var ms=/^(.*)\s+—\s+([A-Za-z ]+)$/.exec(tt);
        if(ms&&rptStatus(ms[2])){stage={name:ms[1].trim(),status:rptStatus(ms[2]),desc:"",images:[]};cur.stages.push(stage);continue;}
        if(rptStatus(tt)){stage={name:"",status:rptStatus(tt),desc:"",images:[]};cur.stages.push(stage);continue;}
        if(/\(\d+\)$/.test(tt)&&rptStatus(tt.replace(/\s*\(\d+\)$/,""))){cur=null;stage=null;continue;}   // durum grubu başlığı
      }
      if(stage){stage.desc=stage.desc?stage.desc+"\n"+t.trim():t.trim();}
    }
    res.files=files;
    // uygulama raporu değilse: İngilizce Daily Progress Report mu? (tarih başlık tablosunda gg-aa-yyyy)
    if(!res.jobs.length){
      var me=/(\d{2})-(\d{2})-(\d{4})/.exec(res.head||"");
      if(me&&/Rep\.?\s*no/i.test(res.head)){res.kind="en";res.date=me[3]+"-"+me[2]+"-"+me[1];}
    }
    return res;
  });
}
function bytesToDataUrl(bytes,name){
  var ext=(/\.(\w+)$/.exec(name)||[])[1]||"jpg";ext=ext.toLowerCase();
  var mime={jpg:"image/jpeg",jpeg:"image/jpeg",png:"image/png",gif:"image/gif",webp:"image/webp"}[ext]||"image/jpeg";
  return new Promise(function(resolve){var fr=new FileReader();fr.onload=function(){resolve(fr.result);};fr.onerror=function(){resolve(null);};fr.readAsDataURL(new Blob([bytes],{type:mime}));});
}
function fileSafeJob(s){
  var map={"ç":"c","Ç":"C","ğ":"g","Ğ":"G","ı":"i","İ":"I","ö":"o","Ö":"O","ş":"s","Ş":"S","ü":"u","Ü":"U"};
  var t=(s||"").replace(/[çÇğĞıİöÖşŞüÜ]/g,function(c){return map[c]||c;});
  return t.replace(/[^A-Za-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,50)||"is";
}
// Raporu olmayan gün: önceki günün işleri olduğu gibi devreder (tamamlananlar düşer), fotoğraflar havuza
function buildCarriedDay(baseItems){
  var items=[];
  (baseItems||[]).forEach(function(it){if(it.status==="tamam")return;var c=JSON.parse(JSON.stringify(it));c.id=genId();c.carried=true;(c.entries||[]).forEach(function(en){en.photos=[];});items.push(c);});
  return items;
}
function parseDayPhotoZip(bytes,name){
  var md=/Gun\d+-(\d{4}-\d{2}-\d{2})/.exec(name||"");
  return docxEntries(bytes).then(function(files){
    var photos=[];Object.keys(files).sort().forEach(function(n){if(/\.(jpe?g|png|webp)$/i.test(n))photos.push({name:n,data:files[n]});});
    return {kind:"zip",date:md?md[1]:null,photos:photos};
  });
}
function itemKeyName(it){return [it.job||"",it.title||""].filter(function(x){return x&&x.trim();}).join(" - ").trim().toLocaleLowerCase("tr");}
function buildDayFromReport(rep,baseItems,dateISO){
  var byName={};(baseItems||[]).forEach(function(it){var k=itemKeyName(it);if(k&&!byName[k])byName[k]=it;});
  var items=[],seen={},photoJobs=[];
  rep.jobs.forEach(function(j){
    var key=j.name.toLocaleLowerCase("tr"),prev=byName[key],it;
    if(prev){seen[key]=1;it=JSON.parse(JSON.stringify(prev));
      (it.entries||[]).forEach(function(en){en.photos=[];});   // devreden iş fotoğraf getirmez
    }else{
      var cut=j.name.indexOf(" - ");
      it={chainId:newChainId(dateISO),job:cut>0?j.name.substring(0,cut).trim():"",title:cut>0?j.name.substring(cut+3).trim():j.name,jobs:[],bolums:[],entries:[]};
    }
    it.id=genId();it.carried=!!prev;
    if(j.bolum)it.bolum=j.bolum;
    if(j.status)it.status=j.status;
    if(j.progress!=null)it.progress=j.progress;
    j.stages.forEach(function(sg){
      var en=null,nm=sg.name.toLocaleLowerCase("tr");
      (it.entries||[]).forEach(function(e){if(!en&&(e.name||"").trim().toLocaleLowerCase("tr")===nm)en=e;});
      if(!en&&!nm&&it.entries.length)en=it.entries[0];
      if(!en){en={name:sg.name,status:"devam",done:false,doneDate:"",desc:"",photos:[]};it.entries.push(en);}
      if(sg.status){en.status=sg.status;en.done=(sg.status==="tamam");if(en.done&&!en.doneDate)en.doneDate=dateISO;if(!en.done)en.doneDate="";}
      if(sg.desc)en.desc=sg.desc;
      sg.images.forEach(function(path){var pid="rw"+genId().slice(1);en.photos.push(pid);photoJobs.push({id:pid,path:path});});
    });
    if(!it.entries.length)it.entries.push({name:"",status:it.status||"devam",done:false,doneDate:"",desc:"",photos:[]});
    if(!it.status)it.status="devam";

  (baseItems||[]).forEach(function(it){if(it.status==="soon"&&!seen[itemKeyName(it)]){var c=JSON.parse(JSON.stringify(it));c.id=genId();c.carried=true;(c.entries||[]).forEach(function(en){en.photos=[];});items.push(c);}});

}
function srcDateFromName(n){
  var m=/(\d{4})-(\d{2})-(\d{2})/.exec(n||"");if(m)return m[1]+"-"+m[2]+"-"+m[3];
  m=/(\d{2})-(\d{2})-(\d{4})/.exec(n||"");if(m)return m[3]+"-"+m[2]+"-"+m[1];
  return null;
}
function srcKind(n){if(/\.zip$/i.test(n))return 2;if(/daily\s*progress\s*report/i.test(n))return 1;return 0;}
// Kaynaklar: telefondan seçilen dosyalar ya da Drive'daki dosyalar. Her biri sırayla yüklenir, işlenir, bırakılır
// (hepsini aynı anda bellekte tutmak telefonu zorluyordu). Var olan günlerin dosyası hiç indirilmez.
function importReportDays(fileList,onProgress){
  var srcs=Array.prototype.slice.call(fileList||[]).map(function(f){
    return f.load?f:{name:f.name,load:function(){return readFileAsRetry(f,"buffer");}};
  });
  var ship=((App.project||{}).shipName||"").toLocaleLowerCase("tr").replace(/^m\/v\s+/,"");
  srcs.forEach(function(s,i){s.date=srcDateFromName(s.name);s.kind=srcKind(s.name);s.i=i;});
  // adında tarih olmayan dosyalar: tarihi içinden okunur (sıralama doğru olsun diye)
  var pre=Promise.resolve();
  srcs.forEach(function(sx){if(sx.date||sx.kind===2)return;pre=pre.then(function(){
    return sx.load().then(function(buf){return parseAppReportDocx(new Uint8Array(buf));}).then(function(r){sx.date=r.date;if(r.kind==="en")sx.kind=1;}).catch(function(){});
  });});

}
function importReportDaysRun(srcs,onProgress,ship){

  srcs.sort(function(a,b){var da=a.date||"9999",db=b.date||"9999";if(da!==db)return da<db?-1:1;if(a.kind!==b.kind)return a.kind-b.kind;return a.i-b.i;});

  function applyReport(r){

    }

    var base=prevDays.length?(getJSON(reportKey(prevDays[prevDays.length-1]),{items:[]}).items||[]):[];
    App.index=index;
    var items,pool=[],notes="",c3=Promise.resolve();
    if(r.kind==="app"){
      var bd=buildDayFromReport(r,base,r.date);items=bd.items;
      bd.photoJobs.forEach(function(pj){c3=c3.then(function(){
        var data=r.files[pj.path];if(!data)return;
        return bytesToDataUrl(data,pj.path).then(function(u){if(!u)return;photos++;return storePhotoEverywhere(pj.id,u);});
      });});
    }else{
      items=buildCarriedDay(base);
      notes=r.sentences.filter(function(x){return x.length>12;}).join("\n");
      r.images.forEach(function(path){c3=c3.then(function(){var data=r.files[path];if(!data)return;return savePhotoBytes(data,path).then(function(pid){if(pid)pool.push(pid);});});});
    }

      var obj={items:items,pool:keepPool.concat(pool),notes:notes,planExtra:"",updated:Date.now()};if(r.kind!=="app")obj.src="en";
      setJSON(reportKey(r.date),obj);

    (rep.items||[]).forEach(function(it){var k=fileSafeJob([it.job,it.title].filter(function(x){return x&&x.trim();}).join(" - "));if(!byFile[k])byFile[k]=it;});
    rep.pool=rep.pool||[];var c4=Promise.resolve();
    z.photos.forEach(function(ph){c4=c4.then(function(){
      var bn=ph.name.replace(/^.*\//,"").replace(/\.\w+$/,""),m=/^(.*?)(?:-asama(\d+))?-(\d+)$/.exec(bn),key=m?m[1]:bn,st=m&&m[2]?(+m[2]-1):0;
      var it=byFile[key]||byFile[key.replace(/-\d+$/,"")];
      return savePhotoBytes(ph.data,ph.name).then(function(pid){if(!pid)return;
        if(it){if(!it.entries||!it.entries.length)it.entries=[{name:"",status:it.status||"devam",photos:[]}];var en=it.entries[Math.min(st,it.entries.length-1)];en.photos=(en.photos||[]).concat([pid]);}

    // var olan günün dosyasını hiç indirme (ZIP: sadece bu seferde kurulan günler)
    var index=getJSON(INDEX_KEY,[])||[];
    var _exEn=(sx.kind===0&&sx.date&&index.indexOf(sx.date)>=0&&!done[sx.date])?((getJSON(reportKey(sx.date),{})||{}).src==="en"):false;
    if(sx.date&&sx.kind!==2&&!_exEn&&(index.indexOf(sx.date)>=0||done[sx.date])){if(skipped.indexOf(sx.date)<0&&!done[sx.date])skipped.push(sx.date);return;}
    if(sx.date&&sx.kind===2&&!created[sx.date]&&index.indexOf(sx.date)>=0)return;

    return sx.load().then(function(buf){
      var bytes=new Uint8Array(buf);
      if(/\.zip$/i.test(sx.name))return parseDayPhotoZip(bytes,sx.name).then(function(z){if(!z.date||!z.photos.length){errors.push(sx.name+": günün fotoğraf ZIP'i değil");return;}z.fname=sx.name;return applyZip(z);});

}
function readFileAsRetry(file,how,tries){
  return readFileAs(file,how).catch(function(e){if((tries||0)>=2)throw new Error("okunamadı · dosyayı önce telefona indirip İndirilenler'den seçin");return new Promise(function(r){setTimeout(r,800);}).then(function(){return readFileAsRetry(file,how,(tries||0)+1);});});
}
function readFileAs(file,how){
  return new Promise(function(resolve,reject){
    var r=new FileReader();
    r.onload=function(ev){resolve(ev.target.result);};
    r.onerror=function(){reject(new Error("okunamadı"));};
    if(how==="buffer")r.readAsArrayBuffer(file);else r.readAsText(file);
  });
}
// Geri yükleme: bir veya birden çok dosya (.json veri yedeği ve/veya .zip fotoğraf parçaları).
// v3 veri yedeği fotoğraflara DOKUNMAZ; ZIP'ler fotoğrafları ekler. Eski v1/v2 tek dosya yedekler de desteklenir.
function doRestore(files){
  if(!files)return;
  if(!Array.isArray(files))files=[files];
  files=files.filter(Boolean);
  if(!files.length)return;
  var jsons=files.filter(function(f){return /\.(json|txt)$/i.test(f.name)||/json|text\/plain/.test(f.type||"");});
  var zips=files.filter(function(f){return /\.zip$/i.test(f.name)||/zip/.test(f.type||"");});
  if(!jsons.length&&!zips.length){toast("Yedek dosyası seçilmedi");return;}
  if(jsons.length>1){toast("Tek bir veri dosyası seçin (fotoğraf ZIP'leri birden çok olabilir)");return;}
  // çok büyük eski yedek tek parça okunamaz ve olduğu gibi geri yüklemek açık gemiyi siler: ayrı gemi olarak ekle
  if(jsons.length&&jsons[0].size>150*1024*1024){
    if(confirm("Bu yedek büyük olduğu için parça parça okunacak. Yedekteki gemiler fotoğraflarıyla eklenecek; var olan gemilere dokunulmaz. Başlansın mı?"))importShipsWithOverlay(jsons[0]);
    return;
  }

  var chain=Promise.resolve();
  if(jsons.length){
    chain=chain.then(function(){return readFileAs(jsons[0],"text");}).then(function(txt){
      var data;try{data=JSON.parse(txt);}catch(e){throw new Error("Veri dosyası okunamadı");}
      if(!data||!data.keys||data._app!=="gemi-tersane-takip")throw new Error("Geçersiz yedek dosyası");
      var legacy=!data._v||data._v<3;
      if(!confirm("Veri yedeği geri yüklenecek ("+(data._date?String(data._date).slice(0,10):"tarih yok")+"). Bu telefondaki işler bu yedekle DEĞİŞTİRİLECEK."+(legacy?"\n\nBu eski tip yedek; fotoğraflar da içinden gelecek.":"\n\nFotoğraflara dokunulmaz.")+"\n\nDevam edilsin mi?"))throw new Error("__iptal");
      var del=[];for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf("tersane_")===0)del.push(k);}
      del.forEach(function(k){localStorage.removeItem(k);});
      invalidateChainCache();
      var fotolar={},slotWrites=[];
      Object.keys(data.keys).forEach(function(k){
        if(k.indexOf("tersane_foto_")===0){fotolar[k.substring("tersane_foto_".length)]=data.keys[k];return;}   // v1
        if(k.indexOf("tersane_slotdata_")===0){                    // gemi arşivi: IndexedDB'ye
          var sd=null;try{sd=JSON.parse(data.keys[k]);}catch(e){}
          if(sd)slotWrites.push(slotPut(k.substring(17),sd));
          return;
        }
        try{localStorage.setItem(k,data.keys[k]);}catch(e){}
      });
      if(data.fotolar)Object.keys(data.fotolar).forEach(function(id){fotolar[id]=data.fotolar[id];});            // v2
      summary.data=true;
      var sw=Promise.all(slotWrites);
      if(!legacy)return sw;
      summary.legacy=true;
      // eski tip: fotoğraflar dosyanın içinde — mevcut fotoğrafları silip yenilerini yaz (eski davranış)
      photoMem={};
      var c2=sw;
      if(IDB)c2=c2.then(function(){return new Promise(function(res){try{var tx=IDB.transaction("fotolar","readwrite");tx.objectStore("fotolar").clear();tx.oncomplete=function(){res();};tx.onerror=function(){res();};}catch(e){res();}});});
      Object.keys(fotolar).forEach(function(id){c2=c2.then(function(){return savePhoto(id,fotolar[id]).then(function(){summary.photos++;});});});
      return c2;
    });
  }
  zips.forEach(function(zf){
    chain=chain.then(function(){return readFileAs(zf,"buffer");}).then(function(buf){
      var entries=readZipEntries(new Uint8Array(buf));
      var c3=Promise.resolve();
      entries.forEach(function(en){
        var m=/^(?:.*\/)?([^\/]+)\.(jpe?g|png|webp|gif)$/i.exec(en.name);
        if(!m)return;
        var id=m[1],ext=m[2].toLowerCase();
        var mime=(ext==="png")?"image/png":(ext==="webp")?"image/webp":(ext==="gif")?"image/gif":"image/jpeg";
        c3=c3.then(function(){return zipEntryData(en);}).then(function(bytes){
          return savePhoto(id,"data:"+mime+";base64,"+bytesToB64(bytes)).then(function(){summary.photos++;});
        }).catch(function(){});
      });
      return c3;
    });
  });
  chain.then(function(){
    loadAll();
    try{repairSlots();}catch(e){}
    App.showSettings=false;App.backupSheet=null;
    if(summary.data){App.view="calendar";var t=new Date();App.calY=t.getFullYear();App.calM=t.getMonth();}
    updateStorageInfo();render();
    toast((summary.data?"Veriler geri yüklendi":"")+(summary.data&&summary.photos?" · ":"")+(summary.photos?summary.photos+" fotoğraf eklendi":(summary.data?"":"Fotoğraf bulunamadı")));
  }).catch(function(e){
    if(e&&e.message==="__iptal")return;
    toast((e&&e.message)?e.message:"Geri yükleme başarısız");
  });
}

// Fotoğraflar hemen silinmez: geri alma süresi dolunca kalıcı olarak temizlenir.
var UNDO_MS=20000;
function commitUndoDelete(){
  if(App._undoTimer){clearTimeout(App._undoTimer);App._undoTimer=null;}
  var u=App.undoDel;App.undoDel=null;
  if(!u)return;
  (u.photoIds||[]).forEach(function(id){deletePhoto(id);});
}
function undoDelete(){
  var u=App.undoDel;
  if(!u)return;
  if(App._undoTimer){clearTimeout(App._undoTimer);App._undoTimer=null;}
  App.undoDel=null;
  if(App.selectedDate!==u.date){App.selectedDate=u.date;App.view="day";loadDay(u.date);}
  var back=u.items||[u.item],n=0;
  back.forEach(function(it){if(!App.items.some(function(x){return x.id===it.id;})){App.items.push(normalizeItem(it));n++;}});
  persistDay(u.date,App.items);
  toast(n>1?(n+" iş geri getirildi"):"İş geri getirildi");
  render();
}
function mountUndoBar(){
  var u=App.undoDel;
  if(!u)return;
  var bar=document.createElement("div");bar.className="undobar an-up";
  bar.innerHTML='<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(u.label)+' silindi</span>'+
    '<button id="undo-go" style="flex-shrink:0;display:inline-flex;align-items:center;gap:5px;background:#fff;color:var(--navy);font-weight:800;font-size:12.5px;border-radius:999px;padding:6px 12px">'+I("undo")+' Geri al</button>';
  document.body.appendChild(bar);
  var g=bar.querySelector("#undo-go");if(g)g.onclick=function(){undoDelete();};
}
function mountToast(){
  if(!App.toast)return;
  var t=document.createElement("div");t.className="toast an-up";
  if(App.undoDel)t.style.bottom="78px";          // geri al çubuğunun üstünde dursun
  t.innerHTML='<span style="color:#4ade80">'+I("check")+'</span> '+esc(App.toast);
  document.body.appendChild(t);
}

var setupTmp={shipName:"",yard:"",startDate:todayISO(),pk:{y:new Date().getFullYear(),m:new Date().getMonth()}};

  var ov=document; // picker bind içinde querySelector kullanıyor
  var ship=document.getElementById("su-ship");ship.oninput=function(ev){setupTmp.shipName=ev.target.value;var b=document.getElementById("su-start");if(b)b.disabled=!setupTmp.shipName.trim();};

  var sdv=document.getElementById("su-drive");if(sdv)sdv.onclick=function(){

    driveSignIn(false).then(function(){if(msg)msg.textContent="Drive’daki işler alınıyor…";return driveFetchData();}).then(function(d){

      doRestore([new File([d.text],"gemitakip-veri.json",{type:"application/json"})]);
      driveAfterRestorePhotos();
    }).catch(function(e){if(msg)msg.textContent="Olmadı: "+(e&&e.message||e);});
  };
  var sb=document.getElementById("su-start");if(sb)sb.onclick=function(){
    if(!setupTmp.shipName.trim())return;
    App.project={shipName:setupTmp.shipName.trim(),yard:setupTmp.yard.trim(),startDate:setupTmp.startDate,endDate:"",milestones:{ddin:"",ddout:""}};

    render();
  };
}

    var need=[];
    try{
      var dsel=App.selectedDate||todayISO();
      var rep=getJSON(reportKey(dsel),{items:[]});

      (rep.pool||[]).forEach(function(p){need.push(p);});
    }catch(e){}
    return ensurePhotos(need.slice(0,400));
  }).then(function(){
    updateStorageInfo();
    render(); // fotoğraflar belleğe geldi, yeniden çiz
    return loadFpsIntoMemory();       // parmak izlerini de belleğe al (öneri için)
  }).then(function(){
    // eski sürümden kalan localStorage parmak izlerini IndexedDB'ye taşı ve yeri boşalt
    try{
      var old=getJSON("tersane_fp_v2",null);
      if(old&&typeof old==="object"){
        var ks=Object.keys(old),ch=Promise.resolve();

        ch.then(function(){sDel("tersane_fp_v2");});
      }
    }catch(e){}
  });
})();
