    if(!b.refs||!b.refs.length||!b.field)return;
    var newVal=(b.text||"").trim();
    if(!newVal)return;
    b.refs.forEach(function(ref){
      var rep=getJSON(reportKey(ref.date),{items:[]});
      var t=(rep.items||[]).filter(function(x){return x.id===ref.itemId;})[0];
      if(!t)return;
      if((t[b.field]||"")!==newVal){t[b.field]=newVal;changed++;saveDayItems(ref.date,rep.items,rep);if(ref.date===App.selectedDate)loadDay(App.selectedDate);}
    });
  });
  // === 1c) rapor/plan cümlesi blokları -> işin kendi cümlesine yaz ===
  var _sentSeen={};
  d.blocks.forEach(function(b){
    if((b.type!=="sentence"&&b.type!=="caption")||!b.src||!b.src.itemId||!b.src.sentKind)return;
    var val=(b.text||"").trim();if(!val)return;
    if(val===(b.src.auto||"").trim())return;           // dokunulmamış blok: üzerine yazma
    var field=(b.src.sentKind==="plan")?"planText":"reportText";
    var key=b.src.date+"|"+b.src.itemId+"|"+field;
    if(_sentSeen[key])return;                          // aynı iş için ilk düzenlenen blok geçerli
    _sentSeen[key]=true;
    var rep=getJSON(reportKey(b.src.date),{items:[]});
    var t=(rep.items||[]).filter(function(x){return x.id===b.src.itemId;})[0];
    if(!t)return;
    if((t[field]||"")!==val){
      t[field]=val;changed++;
      saveDayItems(b.src.date,rep.items,rep);
      if(b.src.date===App.selectedDate)loadDay(App.selectedDate);
    }
  });
  // === 1d) ekstra not / genel notlar ===
  d.blocks.forEach(function(b){
    if(b.type==="notes"&&b.src&&b.src.date){
      if(getDayNotes(b.src.date)!==(b.text||"")){setDayNotes(b.src.date,b.text||"");changed++;}
      return;
    }
    if(b.type==="plannedextra"&&b.src&&b.src.date){
      if(getDayPlanExtra(b.src.date)!==(b.text||"")){setDayPlanExtra(b.src.date,b.text||"");changed++;}
      return;
    }
    if(b.type!=="extranote"||!b.src||!b.src.itemId)return;
    var rep=getJSON(reportKey(b.src.date),{items:[]});
    var t=(rep.items||[]).filter(function(x){return x.id===b.src.itemId;})[0];
    if(!t)return;
    var v=(b.text||"").trim();
    if((t.extraNote||"")!==v){
      t.extraNote=v;changed++;
      setJSON(reportKey(b.src.date),{items:rep.items,pool:(rep.pool||[]),notes:(rep.notes||""),updated:Date.now()});
      if(b.src.date===App.selectedDate)loadDay(App.selectedDate);
    }
  });
  // === 2) stage/photos blokları (metin + silme + foto) ===
  var byItem={}; // "date|itemId" -> {stages:{entryIdx:{desc,name,editable}}, photos:{entryIdx:[ids]}, seenEntries:{}}
  d.blocks.forEach(function(b){
    if(!b.src||!b.src.itemId)return;
    var key=b.src.date+"|"+b.src.itemId;
    var g=byItem[key]||(byItem[key]={date:b.src.date,itemId:b.src.itemId,photoEdits:{},seenEntries:{}});
    if(b.type==="photos"&&b.src.entryIdx!=null){
      g.seenEntries[b.src.entryIdx]=true;
      g.photoEdits[b.src.entryIdx]=(b.photos||[]).slice();
    }
  });
  // her işi diskten oku ve güncelle
  Object.keys(byItem).forEach(function(key){
    var g=byItem[key];
    var rep=getJSON(reportKey(g.date),{items:[]});
    var target=(rep.items||[]).filter(function(x){return x.id===g.itemId;})[0];
    if(!target)return;
    normalizeItem(target);
    var entries=target.entries||[];
    // hangi entry index'leri taslakta hiç görünmedi? (silinecek) — ama sadece bu item için üretilmiş entry'ler
    // Not: sadece bu item'a ait blok üretilmişse sil. Üretilmeyen (fotosuz vb.) entry'ler korunur.
    // Bu item'ın taslakta üretilen entry index kümesi:
    var producedIdx={};
    d.blocks.forEach(function(b){if(b.src&&b.src.itemId===g.itemId&&b.src.date===g.date&&b.src.entryIdx!=null)producedIdx[b.src.entryIdx]=true;});
    // ilk üretimde hangi entry'ler vardı: producedIdxOriginal (taslak kurulurken). Bunu blocks'tan değil, "üretilmiş ama artık görünmeyen"den anlarız.
    // Basitleştirme: taslakta bu item için ORİJİNAL üretilen index'ler = d._producedMap varsa oradan; yoksa producedIdx (silinen yok say)
    var origIdx=(d._producedMap&&d._producedMap[key])?d._producedMap[key]:Object.keys(producedIdx).map(Number);
    var newEntries=[];
    entries.forEach(function(en,ei){
      var wasProduced=origIdx.indexOf(ei)>=0;
      var stillSeen=g.seenEntries[ei];
      if(wasProduced&&!stillSeen){removed++;return;} // taslakta üretilmişti ama silindi -> at
      var pe=g.photoEdits[ei];
      if(pe){
        var oldLen=(en.photos||[]).length;
        // sadece foto çıkarma (ekleme taslakta yok); kalan listeyi yaz
        en.photos=pe.slice();
        if(en.photos.length!==oldLen)changed++;
      }
      newEntries.push(en);
    });
    if(!newEntries.length)newEntries.push({desc:"",photos:[]});
    target.entries=newEntries;
    // eğer tüm aşamalar silindiyse ve iş boşaldıysa işi silmiyoruz (kullanıcı işi silmek isterse uygulamadan yapar)
    saveDayItems(g.date,rep.items,rep);
    if(g.date===App.selectedDate)loadDay(App.selectedDate);
  });
  return {changed:changed,removed:removed};
}

  });

      dx.body+=dxPara(capRuns,{pageBreakBefore:!!b.pageBreak,spacingBefore:(b.pageBreak?0:160),spacingAfter:0,keepNext:true,keepLines:true,bookmark:b.anchor||null});
    }
    else if(b.type==="extranote"){ // fotoğraf başlığının bir alt satırı
      if((b.text||"").trim())dx.body+=dxPara(dxText(b.text,{sz:10,color:"334155",i:true}),{spacingBefore:0,spacingAfter:60,keepNext:true,keepLines:true});
    }
    else if(b.type==="notes"){
      if((b.text||"").trim()){
        dx.body+=dxHeading("Additional notes",{bdr:"EA7317",pageBreak:true});
        String(b.text).split("\n").forEach(function(ln){
          dx.body+=dxPara(dxText(ln,{sz:10,color:"1A1A2E"}),{spacingAfter:40});
        });
      }
    }
    else if(b.type==="photos"){if(b.photos&&b.photos.length)dx.body+=dxPhotos(dx,b.photos,d.photoMap,d.sizeMap);}
    else if(b.type==="heading"){dx.body+=dxHeading(b.text||"",{bdr:"EA7317",pageBreak:!!b.pageBreak,bookmark:b.anchor||null});}
    else if(b.type==="meta"){dx.body+=dxPara(dxText(b.text||"",{color:"475569"}),{spacingAfter:40,keepNext:true});}
    else if(b.type==="table"){if(b.rows&&b.rows.length)dx.body+=dxTable(b.rows,b.widths||null);}
    else if(b.text){dx.body+=dxPara(dxText(b.text,{}),{spacingAfter:40});}
  });
  return dx;
}

// field: "job" | "title" | "bolum" | "stage". Dönüş: değişen kayıt sayısı. dryRun=true ise sadece sayar.
function renameEverywhere(field,oldN,newN,dryRun){
  oldN=(oldN||"").trim();newN=(newN||"").trim();
  if(!oldN||!newN||oldN===newN)return 0;
  var count=0;
  function fixItem(it){
    var hit=0;
    if(field==="job"){if((it.job||"").trim()===oldN){if(!dryRun)it.job=newN;hit++;}
      if(Array.isArray(it.jobs))it.jobs=it.jobs.map(function(x){if((x||"").trim()===oldN){hit++;return newN;}return x;});}
    else if(field==="title"){if((it.title||"").trim()===oldN){if(!dryRun)it.title=newN;hit++;}}
    else if(field==="bolum"){if((it.bolum||"").trim()===oldN){if(!dryRun)it.bolum=newN;hit++;}
      if(Array.isArray(it.bolums))it.bolums=it.bolums.map(function(x){if((x||"").trim()===oldN){hit++;return newN;}return x;});}
    else if(field==="stage"){(it.entries||[]).forEach(function(en){if((en.name||"").trim()===oldN){if(!dryRun)en.name=newN;hit++;}});}
    return hit;
  }
  (App.index||[]).forEach(function(dt){
    var rep=getJSON(reportKey(dt),null);if(!rep||!Array.isArray(rep.items))return;
    var changed=0;rep.items.forEach(function(it){var h=fixItem(it);if(h){changed++;}});
    if(changed){count+=changed;if(!dryRun)saveDayItems(dt,rep.items,rep);}
  });
  if(dryRun)return count;
  // iş şablonları kütüphanesi de güncellensin (aynı başlık açılınca aşamalar yine gelsin)
  var tl=loadIsTemplates(),tch=false;
  tl.forEach(function(t){
    if(field==="job"&&(t.job||"").trim()===oldN){t.job=newN;tch=true;}
    if(field==="title"&&(t.title||"").trim()===oldN){t.title=newN;tch=true;}
    if(field==="bolum"&&(t.bolum||"").trim()===oldN){t.bolum=newN;tch=true;}
    if(field==="stage")t.stages=(t.stages||[]).map(function(x){if((x||"").trim()===oldN){tch=true;return newN;}return x;});
    if(tch&&(field==="job"||field==="title"))t.name=[t.job,t.title].filter(function(x){return x&&x.trim();}).join(" - ")||t.name;
  });
  if(tch)saveIsTemplates(tl);
  invalidateChainCache();
  if(App.selectedDate)loadDay(App.selectedDate);
  return count;
}

  });

  rep.planExtra=txt||"";rep.updated=Date.now();
  var ok=setJSON(reportKey(d),rep);
  if(App.index.indexOf(d)<0){App.index.push(d);App.index.sort();setJSON(INDEX_KEY,App.index);}
  return ok;
}
function getPool(d){var rep=getJSON(reportKey(d),null);return (rep&&Array.isArray(rep.pool))?rep.pool.slice():[];}
function setPool(d,ids){
  var rep=getJSON(reportKey(d),null)||{items:[]};
  rep.pool=ids||[];rep.updated=Date.now();
  if(!Array.isArray(rep.items))rep.items=[];
  if(rep.items.length===0&&rep.pool.length===0){sDel(reportKey(d));App.index=App.index.filter(function(x){return x!==d;});setJSON(INDEX_KEY,App.index);return true;}
  var ok=setJSON(reportKey(d),rep);
  if(App.index.indexOf(d)<0){App.index.push(d);App.index.sort();setJSON(INDEX_KEY,App.index);}
  return ok;
}
function toast(msg){
  // Tam render YAPMA: bildirim kutusunu doğrudan DOM'a ekle/güncelle.
  // (Eskiden render() çağrılıyordu; bu, fotoğraf eklerken sayfanın yeniden yüklenmesine yol açıyordu.)
  App.toast=msg;
  var t=document.querySelector("body > .toast");
  if(!t){t=document.createElement("div");t.className="toast an-up";document.body.appendChild(t);}
  t.innerHTML='<span style="color:#4ade80">'+I("check")+'</span> '+esc(msg);
  if(App.toastTimer)clearTimeout(App.toastTimer);
  App.toastTimer=setTimeout(function(){
    App.toast=null;
    var n=document.querySelector("body > .toast");
    if(n&&n.parentNode)n.parentNode.removeChild(n);
  },2600);
}

var root=document.getElementById("root");
function clearOverlays(){
  Array.prototype.forEach.call(document.querySelectorAll("body > .ov, body > .lb, body > .toast, body > .undobar"),function(n){if(n._cleanup)try{n._cleanup();}catch(e){}n.parentNode.removeChild(n);});

function render(){
  var _scrollY=window.scrollY||window.pageYOffset||0; // yeniden çizimde kaydırma konumunu koru
  // açık overlay'in iç kaydırma konumunu yakala (ayarlar, düzenleme vb. sıçramasın)
  var _ovScroll=null;var _openOv=document.querySelector("body > .ov .sheet-b");if(_openOv)_ovScroll=_openOv.scrollTop;
  clearOverlays();
  // Yardımcı yazıları göster/gizle (varsayılan: gizli)
  if(!App.project){root.innerHTML=setupHTML();bindSetup();return;}
  var h="";
  h+=headerHTML();
  h+='<main><div class="wrap">';
  if(App.view==="calendar")h+=calendarHTML();
  else if(App.view==="day")h+=dayHTML();
  else if(App.view==="draft")h+=draftPageHTML();
  h+='</div></main>';
  root.innerHTML=h;
  bindCommon();
  if(App.view==="calendar")bindCalendar();
  else if(App.view==="day")bindDay();
  else if(App.view==="draft")bindDraftPage();
  // overlays
  if(App.editor)mountEditor();
  if(App.carryPicker)mountCarryPicker();
  if(App.showSettings)mountSettings();
  if(App.macroView)mountMacroView();
  if(App.shipSwitch)mountShipSwitch();
  if(App.tplPick)mountTplPick();
  if(App.photoMove)mountPhotoMove();
  if(App.pool)mountPool();
  if(App.poolPick)mountPoolPick();
  if(App.exportAsk)mountExportAsk();
  if(App.backupSheet)mountBackupSheet();
  if(App.periodAsk)mountPeriodAsk();
  if(App.lightbox)mountLightbox();
  mountUndoBar();
  if(STORE_ERR&&!STORE_ERR.shown){STORE_ERR.shown=true;mountStorageError();}
  mountToast();
  // kaydırma konumunu geri yükle (yeniden çizim sıçramasını önle)
  // Senkron + rAF + setTimeout: mobil tarayıcıların gecikmeli layout hesabına karşı çok katmanlı
  if(_scrollY>0){
    var applyWin=function(){if(Math.abs((window.scrollY||0)-_scrollY)>2)window.scrollTo(0,_scrollY);};
    applyWin();
    if(typeof requestAnimationFrame==="function")requestAnimationFrame(applyWin);
    setTimeout(applyWin,0);
  }
  if(_ovScroll!=null){
    var applyOv=function(){var nb=document.querySelector("body > .ov .sheet-b");if(nb&&Math.abs(nb.scrollTop-_ovScroll)>2)nb.scrollTop=_ovScroll;};
    applyOv();
    if(typeof requestAnimationFrame==="function")requestAnimationFrame(applyOv);
    setTimeout(applyOv,0);
  }
}

  h+='<div class="cal-dow"><div>PZT</div><div>SAL</div><div>ÇAR</div><div>PER</div><div>CUM</div><div>CMT</div><div>PAZ</div></div><div class="cal-grid">';

    var inRange=inYardRange(p,di),ms=milestoneFor(p,di);
    var cls="cal-cell";if(!inMonth)cls+=" out";if(isToday)cls+=" today";else if(ms)cls+=" "+ms.cls;else if(hasRep)cls+=" has";
    var label="";
    if(ms)label='<span class="ms" style="color:#fff;background:'+ms.color+'">'+ms.short+'</span>';

function itemSearchText(it){
  // başlık + lokasyon + bölüm + aşama adları
  var parts=[it.title||""].concat(itemJobs(it)).concat(itemBolums(it));
  (it.entries||[]).forEach(function(en){if(en.name)parts.push(en.name);});
  return parts.join(" ").toLocaleLowerCase("tr");
}

// Tek dokunuşla işi tamamla: Soon dışındaki tüm aşamalar bugün tamamlandı
function finishItem(itemId){
  var it=App.items.filter(function(x){return x.id===itemId;})[0];if(!it)return;
  (it.entries||[]).forEach(function(en){
    if(en.status==="soon"||en.status==="tamam")return;
    en.status="tamam";en.done=true;en.doneDate=App.selectedDate;
  });
  if(!(it.entries||[]).length)it.status="tamam";else it.status=deriveItemStatus(it);
  it.progress=itemProgressPct(it);
  if(it.carried)it.carried=false;
  saveDayItems(App.selectedDate,App.items);
  toast("Tamamlandı — aşamaya dokunarak geri alabilirsin");
  render();
}
// Kart üzerindeki kamera düğmesi: editörü açmadan doğrudan işe fotoğraf ekler
function addPhotosToItem(itemId,fileList){
  var arr=Array.prototype.slice.call(fileList||[]).filter(function(f){return f.type?f.type.indexOf("image/")===0:true;});
  if(!arr.length)return;
  var it=null;
  for(var i=0;i<App.items.length;i++)if(App.items[i].id===itemId){it=App.items[i];break;}
  if(!it){toast("İş bulunamadı");return;}
  toast(arr.length+" fotoğraf işleniyor…");
  var added=[],failed=0,heic=0,chain=Promise.resolve();
  arr.forEach(function(f){chain=chain.then(function(){
    return compressImage(f).then(function(res){
      if(res&&res.data)added.push({id:genId(),data:res.data});
      else{failed++;if(res&&res.reason==="heic")heic++;}
    }).catch(function(){failed++;});
  });});
  chain.then(function(){
    var wr=Promise.resolve(),writeOk=true;
    added.forEach(function(p){wr=wr.then(function(){return savePhoto(p.id,p.data).then(function(ok){if(!ok)writeOk=false;});});});
    return wr.then(function(){return writeOk;});
  }).then(function(writeOk){
    normalizeItem(it);
    if(!it.entries.length)it.entries.push({name:"",desc:"",status:"devam",done:false,doneDate:"",photos:[]});
    var tgt=it.entries[0];                       // fotoğraflar iş seviyesinde tutulur
    if(!Array.isArray(tgt.photos))tgt.photos=[];
    added.forEach(function(p){tgt.photos.push(p.id);});
    saveDayItems(App.selectedDate,App.items);
    if(heic)toast(heic+" foto HEIC/HEIF — Kamera ayarlarından “yüksek verimli görüntü”yü kapatın");
    else if(!writeOk)toast("Hafıza dolu olabilir — fotoğraflar tam kaydedilemedi");
    else if(failed&&added.length)toast(added.length+" eklendi · "+failed+" okunamadı");
    else if(failed)toast(failed+" dosya okunamadı — JPEG/PNG deneyin");
    else toast(added.length+" fotoğraf eklendi");
    render();
  });
}
// Kart üzerinden aşama durumu döngüsü: Planned → Commenced → Ongoing → Completed → Planned
var STAGE_CYCLE=["planlandi","started","devam","tamam"];
function cycleStageStatus(itemId,ei){
  var it=null;
  for(var i=0;i<App.items.length;i++)if(App.items[i].id===itemId){it=App.items[i];break;}
  if(!it||!it.entries||!it.entries[ei])return;
  var en=it.entries[ei];
  var cur=en.status||(en.done?"tamam":"devam");
  var ci=STAGE_CYCLE.indexOf(cur);
  var next=(ci<0)?"devam":STAGE_CYCLE[(ci+1)%STAGE_CYCLE.length]; // Waiting/Soon -> Ongoing
  en.status=next;en.done=(next==="tamam");
  if(next==="tamam"){if(!en.doneDate)en.doneDate=App.selectedDate;}
  else en.doneDate="";                 // Completed'ten çıkınca eski tarih kalmasın
  it.status=deriveItemStatus(it);
  it.progress=itemProgressPct(it);
  if(it.carried)it.carried=false;      // iş güncellendi -> "aktarıldı" uyarısı kalksın
  saveDayItems(App.selectedDate,App.items);
  var nm=(en.name||"").trim()||("Aşama "+(ei+1));
  toast(nm+" → "+st(next).label);
  render();
}

    function cancel(){if(timer){clearTimeout(timer);timer=null;}}
    function tap(){if(longFired)return;if(App.selectMode){App.selected[id]=!App.selected[id];render();}}
    el.addEventListener("touchstart",function(){usedTouch=true;start();},{passive:true});
    el.addEventListener("touchmove",function(){moved=true;cancel();});

  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-detail]"),function(b){b.onclick=function(ev){if(App.selectMode){ev.stopPropagation();return;}openEditItem(b.getAttribute("data-detail"));};});

// Logo'yu kareye kırpıp küçük tut (ikon)
function compressLogo(file){
  return new Promise(function(resolve){
    function draw(src,w,h){
      var size=256;var cv=document.createElement("canvas");cv.width=size;cv.height=size;
      var c=cv.getContext("2d");c.fillStyle="#fff";c.fillRect(0,0,size,size);
      var scale=Math.max(size/w,size/h);var nw=w*scale,nh=h*scale;
      c.drawImage(src,(size-nw)/2,(size-nh)/2,nw,nh);
      return cv.toDataURL("image/jpeg",0.8);
    }
    if(window.createImageBitmap){createImageBitmap(file).then(function(b){resolve(draw(b,b.width,b.height));if(b.close)b.close();}).catch(function(){fb();});}
    else fb();
    function fb(){var r=new FileReader();r.onload=function(e){var im=new Image();im.onload=function(){resolve(draw(im,im.naturalWidth,im.naturalHeight));};im.onerror=function(){resolve(null);};im.src=e.target.result;};r.onerror=function(){resolve(null);};r.readAsDataURL(file);}
  });
}

function nextDayISO(dISO){var d=new Date(dISO+"T00:00:00");d.setDate(d.getDate()+1);return iso(d);}
function carryItemsToDay(items,targetISO,convertStarted){
  // convertStarted: true ise started (hem iş hem aşama) -> In Progress (devam); verilmemişse çevir (varsayılan)
  if(typeof convertStarted==="undefined")convertStarted=true;
  var rep=getJSON(reportKey(targetISO),{items:[]});var tItems=Array.isArray(rep.items)?rep.items:[];
  tItems.forEach(normalizeItem);
  var added=0;
  items.forEach(function(item){
    normalizeItem(item);
    var key=(item.job||"")+"||"+item.title;
    if(tItems.some(function(i){return (i.job||"")+"||"+i.title===key;}))return;
    var newStatus=item.status||"devam";
    if(convertStarted&&newStatus==="started")newStatus="devam"; // iş-seviyesi Started -> In Progress
    var pg=itemProgressPct(item);
    tItems.push({id:genId(),chainId:item.chainId||newChainId(targetISO),title:item.title,job:item.job||"",bolum:item.bolum||"",status:newStatus,progress:pg,entries:(item.entries||[]).map(function(en){var es=en.status||(en.done?"tamam":"devam");if(convertStarted&&es==="started")es="devam";return {desc:en.desc||"",name:en.name||"",photos:[],done:!!en.done,status:es,doneDate:en.doneDate||""};}),carried:true,carriedPg:pg,tomorrow:""});
    added++;
  });
  if(!added)return 0;
  persistDay(targetISO,tItems);        // havuz, gün notu ve ek plan satırları korunur
  updateStorageInfo();
  // hedef gün açık olan günse bellekteki listeyi de tazele
  if(targetISO===App.selectedDate){loadDay(targetISO);}
  return added;
}
// İşin GÜNÜNÜ DEĞİŞTİR: iş kaynak günden çıkar, hedef güne fotoğraflarıyla aynen gider.
// Fotoğraflar kopyalanmaz (aynı kimlikler), kaynak günde biten aşamaların tarihi hedef güne kayar.
function moveItemsToDay(items,srcISO,targetISO){
  var res={moved:0,skipped:0};
  if(!targetISO||!srcISO||targetISO===srcISO)return res;
  var srcItems=((srcISO===App.selectedDate)?App.items:(getJSON(reportKey(srcISO),{items:[]}).items||[])).slice();
  var tItems=((targetISO===App.selectedDate)?App.items:(getJSON(reportKey(targetISO),{items:[]}).items||[])).slice();
  tItems.forEach(normalizeItem);
  var gone={};
  (items||[]).forEach(function(it){
    var key=(it.job||"")+"||"+it.title;
    if(tItems.some(function(i){return (i.job||"")+"||"+i.title===key;})){res.skipped++;return;}
    var real=srcItems.filter(function(x){return x.id===it.id;})[0];
    if(!real){res.skipped++;return;}
    var copy=JSON.parse(JSON.stringify(normalizeItem(real)));
    delete copy.carried;delete copy.carriedPg;
    (copy.entries||[]).forEach(function(en){if(en.status==="tamam"&&en.doneDate===srcISO)en.doneDate=targetISO;});
    tItems.push(copy);gone[real.id]=true;res.moved++;
  });
  if(!res.moved)return res;
  // önce hedefe yaz: başarısız olursa kaynağa dokunma (iş kaybolmasın)
  if(!persistDay(targetISO,tItems)){res.moved=0;res.failed=true;return res;}
  var newSrc=srcItems.filter(function(x){return !gone[x.id];});
  persistDay(srcISO,newSrc);
  if(srcISO===App.selectedDate)App.items=newSrc;
  if(targetISO===App.selectedDate)loadDay(targetISO);
  invalidateChainCache();updateStorageInfo();
  return res;
}

function firstEmptyDayFrom(startISO){
  // startISO'dan itibaren ileriye doğru, henüz iş kaydı olmayan ilk günü bul
  var d=new Date(startISO+"T00:00:00");
  for(var i=0;i<400;i++){
    var iso_=iso(d);
    var rep=getJSON(reportKey(iso_),{items:[]});
    if(!rep.items||rep.items.length===0)return iso_;
    d.setDate(d.getDate()+1);
  }
  return nextDayISO(startISO);
}

  var pd=prior[prior.length-1];

function carryOver(){
  var src=prevUnfinished(App.selectedDate);
  if(!src.items.length){toast("Devredilecek iş yok");return;}
  var existingTitles={};App.items.forEach(function(i){existingTitles[(i.job||"")+"||"+i.title]=true;});
  var added=0;
  var next=App.items.slice();
  src.items.forEach(function(it){
    var key=(it.job||"")+"||"+it.title;
    if(existingTitles[key])return; // zaten bugün varsa tekrar ekleme
    var _ents=(it.entries||[]).map(function(en){
      var es=en.status||(en.done?"tamam":"devam");
      if(es==="started")es="devam";                       // dünden devralınan "commenced" aşama bugün sürüyor
      return {desc:en.desc||"",name:en.name||"",photos:[],done:(es==="tamam"),status:es,doneDate:en.doneDate||""};
    });
    next.push({id:genId(),chainId:it.chainId||newChainId(App.selectedDate),title:it.title,job:it.job||"",bolum:it.bolum||"",
      status:(it.status==="bekleme"?"bekleme":deriveItemStatus({entries:_ents,status:it.status||"devam"})),
      progress:itemProgressPct({entries:_ents}),
      entries:_ents,carried:true,tomorrow:""});
    added++;
  });
  if(!added){toast("Bu işler zaten bugünde mevcut");return;}
  App.items=next;persistDay(App.selectedDate,next);render();
  toast(added+" iş devralındı ("+fmtShort(src.date)+" gününden)");
}

function findContinuingChain(job,title,beforeISO){
  function nz(x){return (x||"").replace(/\s+/g," ").trim().toLocaleLowerCase("tr");}
  var nj=nz(job),nt=nz(title);
  if(!nt)return null;
  var days=(App.index||[]).filter(function(d){return d<beforeISO;}).sort().reverse();
  for(var i=0;i<days.length;i++){
    var items=(getJSON(reportKey(days[i]),{items:[]}).items)||[];
    for(var j=0;j<items.length;j++){
      var it=items[j];
      if(nz(it.job)===nj&&nz(it.title)===nt){
        normalizeItem(it);
        if(it.status==="tamam"||deriveItemStatus(it)==="tamam")return null;   // önceki iş bitmiş: bu yeni bir iş
        return it.chainId||null;
      }
    }
  }
  return null;
}

// Bu işin "devamı" yapılabilecek önceki işler: önceki günlerde son kaydı olan, farklı zincirdeki işler
function linkableChains(beforeISO,exceptChain){
  var seen={},out=[];
  (App.index||[]).filter(function(d){return d<beforeISO;}).sort().reverse().forEach(function(dt){
    ((getJSON(reportKey(dt),{items:[]}).items)||[]).forEach(function(x){
      if(!x.chainId||x.chainId===exceptChain||seen[x.chainId])return;
      seen[x.chainId]=true;normalizeItem(x);
      out.push({chainId:x.chainId,date:dt,title:x.title||"",job:x.job||"",status:x.status});
    });
  });
  return out.slice(0,60);
}

      var _chain=dr.chainId||newChainId(App.selectedDate),_linked=false;
      // zincirin bugünden başka günü yoksa (yeni iş), aynı işin önceki bitmemiş kaydına bağla
      var _onlyToday=(chainStartDate(_chain,App.selectedDate)===App.selectedDate);
      if(_onlyToday&&!dr.chainManual){
        var _cont=findContinuingChain(dr.job,dr.title,App.selectedDate);
        if(_cont&&_cont!==_chain&&!App.items.some(function(x){return x.id!==dr.id&&x.chainId===_cont;})){_chain=_cont;_linked=true;}
      }
      var clean={id:dr.id,chainId:_chain,title:dr.title.trim(),job:(dr.job||"").trim(),bolum:dr.bolum||"",status:_st,progress:_pg,entries:entries};
      // rapor cümleleri: yalnızca kullanıcı elle değiştirdiyse saklanır (yoksa başlıktan hep yeniden üretilir)
      clean.reportText=dr.repEdited?(dr.reportText||"").trim():"";
      clean.planText=dr.planEdited?(dr.planText||"").trim():"";
      clean.tomorrow=dr.tomorrow||"";
      clean.extraNote=(dr.extraNote||"").trim();
      autoLearnTemplate(clean); // aşama adlarını kalıp kütüphanesine sessizce yaz/güncelle
      clean.jobs=(dr.jobs||[]).map(function(x){return (x||"").trim();}).filter(function(x){return x&&x!==clean.job;});
      clean.bolums=(dr.bolums||[]).map(function(x){return (x||"").trim();}).filter(function(x){return x&&x!==clean.bolum;});
      clean.jobs.forEach(addJob);clean.bolums.forEach(addBolum);
      if(dr.carried&&dr.carriedPg!=null){clean.carried=true;clean.carriedPg=dr.carriedPg;} // aktarıldı ve % henüz değişmedi işareti korunur
      if(clean.job)addJob(clean.job);
      if(clean.title)addBaslik(clean.title);   // yeni yazılan başlık kalıplara eklensin
      if(clean.bolum)addBolum(clean.bolum);
      var next=e.mode==="new"?App.items.concat([clean]):App.items.map(function(i){return i.id===dr.id?clean:i;});
      App.items=next;
      var dayOk=persistDay(App.selectedDate,next);
      var wasNew=e.mode==="new";App.editor=null;
      render();
      if(!writeOk)toast("⚠ Bazı fotoğraflar kaydedilemedi — depolama dolu olabilir");
      else if(dayOk===false)toast("⚠ Kayıt başarısız — Ayarlar'dan yedek alın");
      else if(_linked)toast("Önceki günlerdeki işin devamı olarak bağlandı");
      else if(!onDone)toast(wasNew?"İş eklendi":"İş güncellendi");
      if(typeof onDone==="function")onDone();
    }catch(err){App.editor=null;render();toast("Kaydedilemedi: "+(err&&err.message?err.message:"hata"));}
  });
}
function deleteItem(item){deleteItems([item]);}
// Bir ya da birden çok işi sil; 20 saniye geri alınabilir, fotoğraflar süre dolunca silinir.
function deleteItems(list){
  list=(list||[]).filter(Boolean);
  if(!list.length)return;
  commitUndoDelete();                       // bekleyen önceki silme varsa kalıcılaştır
  var snaps=[],pids=[],gone={};
  list.forEach(function(item){
    // Düzenleyiciden gelen "item" taslaktır (fotoğraflar {id,data}); kayıtlı hali baz alınır
    var real=App.items.filter(function(x){return x.id===item.id;})[0];
    var target=normalizeItem(real||item);
    var snap;try{snap=JSON.parse(JSON.stringify(target));}catch(e){snap=target;}
    snaps.push(snap);gone[item.id]=true;
    itemPhotoIds(target).forEach(function(p){var id=(p&&p.id)?p.id:p;if(id)pids.push(id);});
  });
  var first=snaps[0];
  App.undoDel={items:snaps,item:first,date:App.selectedDate,photoIds:pids,
    label:snaps.length>1?(snaps.length+" iş"):(([first.job,first.title].filter(function(x){return x&&x.trim();}).join(" - "))||first.title||"İş")};
  App.items=App.items.filter(function(i){return !gone[i.id];});
  persistDay(App.selectedDate,App.items);
  App.editor=null;
  if(App._undoTimer)clearTimeout(App._undoTimer);
  App._undoTimer=setTimeout(function(){commitUndoDelete();render();},UNDO_MS);
  render();
}

// Tüm Tersane raporu için düzenlenebilir taslak blokları
/* ===== GÜNLÜK RAPOR =====
   1) Daily Progress Summary tablosu (İngilizce)
   2) Work done within the last 24 hours   — devam eden -> yeni başlayan -> tamamlanan
   3) Work planned for the next 24 hours
   4) Her işin cümlesi + (varsa ekstra notu) + fotoğrafları
   5) Additional notes (günün genel notları)                                            */
var MILESTONES_EN={start:"Arrival at the shipyard",ddin:"Dry dock in",ddout:"Dry dock out",
                   end:"Planned departure",actualExit:"Departure from the shipyard"};
function buildDailyNarrativeBlocks(project,dateISO,items,hideOld){
  var blocks=[];var uid=0;function nid(){return "nb"+(uid++);}
  var dn=dayNoLabel(project,dateISO)||dayNumber(dateISO,project.startDate);
  blocks.push({id:nid(),type:"info",text:fmtLongEN(dateISO)+"   •   Yard Day: "+dn});
  var msd=milestoneFor(project,dateISO);
  if(msd)blocks.push({id:nid(),type:"meta",text:"★ "+(MILESTONES_EN[msd.key]||msd.label)});
  var live=sortItems(items).filter(function(it){normalizeItem(it);return App._showSoon||it.status!=="soon";});
  // TEK SIRALAMA: özet tablosu, yazılı liste ve fotoğraflar hep aynı sırayı izler
  // (Commenced -> Ongoing -> Completed -> Waiting -> Planned; grup içinde lokasyon/başlık sırası korunur)
  var buckets={commenced:[],ongoing:[],completed:[],waiting:[],planned:[]};
  live.forEach(function(it){var k=itemNarrativeKind(it,dateISO);if(buckets[k])buckets[k].push(it);});
  var ordered=[];
  ["commenced","ongoing","completed","waiting","planned"].forEach(function(k){
    buckets[k].forEach(function(it){ordered.push({it:it,kind:k});});
  });
  var photoNo={};                        // itemId -> sıra no (özet tablosu ile fotoğraf bölümü aynı numarayı kullanır)
  ordered.forEach(function(o,idx){photoNo[o.it.id]=idx+1;});
  // sayaçlar da sıralamayla aynı sınıflandırmadan gelir
  blocks.push({id:nid(),type:"meta",text:"Total work: "+ordered.length+
    "   •   Commenced: "+buckets.commenced.length+"   •   Ongoing: "+buckets.ongoing.length+
    "   •   Completed: "+buckets.completed.length+"   •   Waiting: "+buckets.waiting.length+
    "   •   Planned: "+buckets.planned.length});
  // --- 1) Daily Progress Summary ---
  blocks.push({id:nid(),type:"heading",text:"Daily Progress Summary",anchor:"toc_top"});
  var HB={b:true,color:"FFFFFF",sz:9};
  var rows=[[{text:"#",o:HB,shd:"0B1F33",jc:"center"},{text:"Location",o:HB,shd:"0B1F33"},{text:"Work",o:HB,shd:"0B1F33"},{text:"Status",o:HB,shd:"0B1F33"},{text:"Dates",o:HB,shd:"0B1F33"},{text:"Progress",o:HB,shd:"0B1F33",jc:"center"}]];
  ordered.forEach(function(o,idx){
    var it=o.it,no=idx+1;

    var hasPh=itemPhotoIds(it).length>0;
    var noCell=hasPh
      ? {runs:dxHyperlink("ph_"+it.id,dxText(""+no,{b:true,sz:9,color:"1D4ED8",noLink:true})),jc:"center"}
      : {text:""+no,o:{b:true,sz:9},jc:"center"};
    rows.push([
      noCell,
      {text:(it.job||"-"),o:{sz:9}},
      {text:(it.title||"-"),o:{sz:9}},
      {text:sc.label,o:{b:true,color:sc.color.replace("#",""),sz:9}},
      {text:itemDateRange(it,dateISO),o:{sz:9,color:"475569"}},
      {text:itemPg(it)+"%",o:{b:true,sz:9},jc:"center"}
    ]);
  });
  blocks.push({id:nid(),type:"table",rows:rows,widths:[440,2150,2900,1450,1400,880]});
  // --- 2) Work done ---
  blocks.push({id:nid(),type:"band",text:"Work done within the last 24 hours"});
  // Waiting/Planned işler yazılı kısımda gösterilmez
  var seq=ordered.filter(function(o){return o.kind==="commenced"||o.kind==="ongoing"||o.kind==="completed";});
  seq.forEach(function(o){
    var line=itemReportLine(o.it,dateISO);
    if(!line)return;
    blocks.push({id:nid(),type:"sentence",text:line,color:narrativeColor(o.kind),src:{date:dateISO,itemId:o.it.id,sentKind:"done",group:o.kind,auto:line}});
  });
  // --- 3) Work planned ---
  blocks.push({id:nid(),type:"band",text:"Work planned for the next 24 hours"});
  ordered.filter(function(o){return o.kind!=="completed"&&o.kind!=="waiting";}).forEach(function(o){
    var it=o.it;
    var line=itemPlanSentence(it);
    if(!line)return;
    blocks.push({id:nid(),type:"sentence",text:line,color:"#475569",src:{date:dateISO,itemId:it.id,sentKind:"plan",group:"plan",auto:line}});
  });
  // elle yazılan ek "yarın" işleri (yalnızca bu bölüme girer)
  blocks.push({id:nid(),type:"plannedextra",text:getDayPlanExtra(dateISO),src:{date:dateISO}});
  // --- 4) Cümle + ekstra not + fotoğraflar ---
  // fotoğraf bölümü de aynı sırayı izler -> numaralar baştan sona artarak gider
  var withPhotos=ordered.filter(function(o){return itemPhotoIds(o.it).length;});
  withPhotos.forEach(function(o,i){
    var cap=itemReportLine(o.it,dateISO);
    blocks.push({id:nid(),type:"caption",text:cap,color:narrativeColor(o.kind),pageBreak:(i===0),
                 num:(photoNo[o.it.id]||null),anchor:"ph_"+o.it.id,
                 src:{date:dateISO,itemId:o.it.id,sentKind:"done",auto:cap}});
    var xn=(o.it.extraNote||"").trim();
    if(xn)blocks.push({id:nid(),type:"extranote",text:xn,src:{date:dateISO,itemId:o.it.id}});
    blocks.push({id:nid(),type:"photos",photos:itemPhotoIds(o.it),src:{date:dateISO,itemId:o.it.id}});
  });
  // --- 5) Additional notes (günün genel notları) ---
  blocks.push({id:nid(),type:"notes",text:getDayNotes(dateISO),src:{date:dateISO}});
  return blocks;
}
/* ===================== DÖNEM RAPORU (Period Progress Report) =====================
   Günlük raporla aynı İngilizce cümle motorunu kullanır; fark, işleri gün gün değil
   ZİNCİR bazında (bir iş = bir satır) toplamasıdır. Eski Türkçe raporların yerine geçer. */
function collectPeriod(fromISO,toISO){
  var days=(App.index||[]).slice().sort().filter(function(d){return d>=fromISO&&d<=toISO;});
  var map={},order=[];
  days.forEach(function(d){
    var items=(d===App.selectedDate&&App.view==="day"&&App.items&&App.items.length)?App.items:((getJSON(reportKey(d),{items:[]}).items)||[]);
    items.forEach(function(it){
      normalizeItem(it);
      if(!App._showSoon&&it.status==="soon")return;
      var key=it.chainId||("k:"+(it.job||"")+"|"+(it.title||""));
      var c=map[key];
      if(!c){c=map[key]={key:key,first:d,last:d,job:"",title:"",bolum:"",records:[],photoIds:[],notes:[]};order.push(c);}
      if(d<c.first)c.first=d;
      if(d>c.last)c.last=d;
      if(it.job)c.job=it.job;
      if(it.title)c.title=it.title;
      if(it.bolum)c.bolum=it.bolum;
      c.lastItem=it;c.lastDate=d;
      c.records.push({date:d,item:it});
      itemPhotoIds(it).forEach(function(p){if(c.photoIds.indexOf(p)<0)c.photoIds.push(p);});
      var xn=(it.extraNote||"").trim();if(xn&&c.notes.indexOf(xn)<0)c.notes.push(xn);
    });
  });
  return {days:days,chains:order};
}
// Dönem sonundaki duruma göre sınıf: commenced (dönemde başladı) | ongoing | completed | waiting | planned
function periodKind(c,fromISO){
  var it=c.lastItem;if(!it)return "ongoing";
  var stt=deriveItemStatus(it);
  if(it.status==="tamam"||stt==="tamam")return "completed";
  if(it.status==="bekleme"||stt==="bekleme")return "waiting";
  if(it.status==="planlandi"||it.status==="soon"||stt==="planlandi"||stt==="soon")return "planned";
  var sd=chainStartDate(it.chainId,c.first)||c.first;
  return (sd>=fromISO)?"commenced":"ongoing";
}
// Dönem içinde bir işin tamamlanma tarihi (varsa)
function periodDoneDate(c){
  var best="";
  (((c.lastItem||{}).entries)||[]).forEach(function(en){
    if(en.status==="tamam"&&en.doneDate&&en.doneDate>best)best=en.doneDate;
  });
  return best||(c.lastItem&&deriveItemStatus(c.lastItem)==="tamam"?c.last:"");
}
// Dönem cümlesi: ana cümle + aşama cümleleri (dönem boyunca biten/süren aşamalar)
function periodSentence(c,kind,fromISO){
  var it=c.lastItem;if(!it)return "";
  var parts=[],seen={};
  function add(x){var k=(x||"").trim().toLocaleLowerCase("en");if(!k||seen[k])return;seen[k]=true;parts.push(x.trim());}
  var mainKind=(kind==="planned")?"notstarted":kind;
  var ph=enActivityPhrase(it.job,enLower(it.title||""));
  if(!ph.text)return "";
  add(ph.text+" "+enPhraseFor(mainKind,ph.plural)+".");
  if(kind==="planned")return parts.join(" ");   // başlamamış işte aşama detayı yazılmaz
  // aşama grupları: dönem sonundaki duruma göre; dönemden ÖNCE bitmiş aşamalar yazılmaz
  var groups={tamam:[],devam:[],started:[]};
  var named=0;
  (it.entries||[]).forEach(function(en){
    var stt=en.status||(en.done?"tamam":"devam");
    var nm=(en.name||"").trim();
    if(nm)named++;
    if(!groups[stt]||!nm)return;
    if(stt==="tamam"&&en.doneDate&&en.doneDate<fromISO)return;  // önceki dönemde bitmiş
    groups[stt].push(nm);
  });
  [["tamam","completed"],["devam","ongoing"],["started","commenced"]].forEach(function(pair){
    var names=groups[pair[0]];
    if(!names.length)return;
    if(pair[1]===mainKind&&names.length>=named)return;   // ana cümle zaten anlatıyor
    var p2=enActivityPhrase("",mergeStageNames(names));
    if(!p2.text)return;
    add(p2.text+" "+enPhraseFor(pair[1],p2.plural||names.length>1)+".");
  });
  return parts.join(" ");
}
function periodDateRange(c){
  var a=chainStartDate((c.lastItem||{}).chainId,c.first)||c.first;
  var b=periodDoneDate(c)||c.last;
  var s1=fmtDayMonEN(a),s2=fmtDayMonEN(b);
  return s1===s2?s1:(s1+" – "+s2);
}
function buildPeriodNarrativeBlocks(project,fromISO,toISO,data){
  var blocks=[];var uid=0;function nid(){return "pe"+(uid++);}
  var days=data.days,chains=data.chains;
  var d1=dayNoLabel(project,fromISO)||dayNumber(fromISO,project.startDate);
  var d2=dayNoLabel(project,toISO)||dayNumber(toISO,project.startDate);
  blocks.push({id:nid(),type:"info",text:fmtLongEN(fromISO)+"  –  "+fmtLongEN(toISO)+"   •   Yard Days "+d1+"–"+d2+"   •   "+days.length+" reporting days"});
  var buckets={commenced:[],ongoing:[],completed:[],waiting:[],planned:[]};
  chains.forEach(function(c){var k=periodKind(c,fromISO);c._kind=k;if(buckets[k])buckets[k].push(c);});
  var ordered=[];
  ["commenced","ongoing","completed","waiting","planned"].forEach(function(k){
    buckets[k].forEach(function(c){ordered.push(c);});
  });
  blocks.push({id:nid(),type:"meta",text:"Total work: "+ordered.length+
    "   •   Commenced: "+buckets.commenced.length+"   •   Ongoing: "+buckets.ongoing.length+
    "   •   Completed: "+buckets.completed.length+"   •   Waiting: "+buckets.waiting.length+
    "   •   Planned: "+buckets.planned.length});
  // --- 1) Period Progress Summary ---
  blocks.push({id:nid(),type:"heading",text:"Period Progress Summary",anchor:"toc_top"});
  var HB={b:true,color:"FFFFFF",sz:9};
  var rows=[[{text:"#",o:HB,shd:"0B1F33",jc:"center"},{text:"Location",o:HB,shd:"0B1F33"},{text:"Work",o:HB,shd:"0B1F33"},{text:"Status",o:HB,shd:"0B1F33"},{text:"Dates",o:HB,shd:"0B1F33"},{text:"Progress",o:HB,shd:"0B1F33",jc:"center"}]];
  ordered.forEach(function(c,idx){
    var no=idx+1,it=c.lastItem||{};
    var lab=narrativeLabel(c._kind),col=narrativeColor(c._kind).replace("#","");
    var noCell=c.photoIds.length
      ? {runs:dxHyperlink("ph_"+safeAnchor(c.key),dxText(""+no,{b:true,sz:9,color:"1D4ED8",noLink:true})),jc:"center"}
      : {text:""+no,o:{b:true,sz:9},jc:"center"};
    rows.push([
      noCell,
      {text:(c.job||"-"),o:{sz:9}},
      {text:(c.title||"-"),o:{sz:9}},
      {text:lab,o:{b:true,color:col,sz:9}},
      {text:periodDateRange(c),o:{sz:9,color:"475569"}},
      {text:itemPg(it)+"%",o:{b:true,sz:9},jc:"center"}
    ]);
  });
  blocks.push({id:nid(),type:"table",rows:rows,widths:[440,2150,2900,1450,1400,880]});
  // --- 2) Work carried out during this period ---
  blocks.push({id:nid(),type:"band",text:"Work carried out during this period"});
  ordered.filter(function(c){return c._kind==="commenced"||c._kind==="ongoing"||c._kind==="completed";}).forEach(function(c){
    var line=periodSentence(c,c._kind,fromISO);
    if(!line)return;
    blocks.push({id:nid(),type:"sentence",text:line,color:narrativeColor(c._kind),src:{group:c._kind,auto:line}});
  });
  // --- 3) Work on hold / not commenced ---
  var rest=ordered.filter(function(c){return c._kind==="waiting"||c._kind==="planned";});
  if(rest.length){
    blocks.push({id:nid(),type:"band",text:"Work on hold and not yet commenced"});
    rest.forEach(function(c){
      var line=periodSentence(c,c._kind,fromISO);
      if(!line)return;
      blocks.push({id:nid(),type:"sentence",text:line,color:narrativeColor(c._kind),src:{group:c._kind,auto:line}});
    });
  }
  // --- 4) Fotoğraflar (özetle aynı sıra ve numara) ---
  var withPhotos=ordered.filter(function(c){return c.photoIds.length;});
  withPhotos.forEach(function(c,i){
    var no=ordered.indexOf(c)+1;
    var cap=periodSentence(c,c._kind,fromISO);
    blocks.push({id:nid(),type:"caption",text:cap,color:narrativeColor(c._kind),pageBreak:(i===0),
                 num:no,anchor:"ph_"+safeAnchor(c.key),src:{auto:cap}});
    if(c.notes.length)blocks.push({id:nid(),type:"extranote",text:c.notes.join(" ")});
    blocks.push({id:nid(),type:"photos",photos:c.photoIds.slice()});
  });
  // --- 5) Additional notes: dönemdeki günlük notlar ---
  var allNotes=[];
  days.forEach(function(d){var n=(getDayNotes(d)||"").trim();if(n)allNotes.push(fmtDayMonEN(d)+": "+n);});
  blocks.push({id:nid(),type:"notes",text:allNotes.join("\n")});
  return blocks;
}
function safeAnchor(s){return String(s||"").replace(/[^A-Za-z0-9_]/g,"_").slice(0,30);}
function openPeriodDraft(fromISO,toISO){
  var p=App.project;
  var data=collectPeriod(fromISO,toISO);
  if(!data.chains.length){toast("Bu aralıkta kayıtlı iş yok");return;}
  var need=[];data.chains.forEach(function(c){c.photoIds.forEach(function(id){if(!photoMem[id])need.push(id);});});
  if(need.length){toast("Fotoğraflar hazırlanıyor…");ensurePhotos(need).then(function(){openPeriodDraft(fromISO,toISO);});return;}
  var allIds=[];data.chains.forEach(function(c){c.photoIds.forEach(function(id){allIds.push(id);});});
  var map={};allIds.forEach(function(id){var v=photoData(id);if(v)map[id]=v;});
  toast("Taslak hazırlanıyor…");
  var sizeMap={},chain=Promise.resolve();
  allIds.forEach(function(id){if(map[id])chain=chain.then(function(){return loadDims(map[id]).then(function(dm){sizeMap[id]=dm;});});});
  chain.then(function(){
    var blocks=buildPeriodNarrativeBlocks(p,fromISO,toISO,data);
    App.draft={type:"period",title:"Period Progress Report",blocks:blocks,photoMap:map,sizeMap:sizeMap,
      fileBase:dashName(p.shipName)+"-Period-"+fromISO+"_"+toISO,_producedMap:computeProducedMap(blocks)};
    App.view="draft";render();window.scrollTo(0,0);
  }).catch(function(){toast("Taslak oluşturulamadı");});
}

  if(_n1.some(function(x){return !photoMem[x];})){toast("Fotoğraflar hazırlanıyor…");ensurePhotos(_n1).then(function(){openDailyDraft(hideOld);});return;}

// Bir günün tüm fotoğraflarını iş adına göre isimlendirip ZIP olarak indir
// Bu günün TÜM fotoğraflarını sil (işler kalır, sadece fotoğraflar gider) — onaylı
function deleteAllDayPhotos(){

function bytesToB64(bytes){
  var bin="";var CH=0x8000;
  for(var i=0;i<bytes.length;i+=CH){bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));}
  return btoa(bin);
}
function exportPhotosZip(){
  var p=App.project,dn=dayNumber(App.selectedDate,p.startDate);
  var sorted=sortItems(App.items);
  // dosya adi icin temiz isim
  function fileSafe(s){
    var map={"ç":"c","Ç":"C","ğ":"g","Ğ":"G","ı":"i","İ":"I","ö":"o","Ö":"O","ş":"s","Ş":"S","ü":"u","Ü":"U"};
    var t=(s||"").replace(/[çÇğĞıİöÖşŞüÜ]/g,function(c){return map[c]||c;});
    return t.replace(/[^A-Za-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,50)||"is";
  }
  var folder=dashName(p.shipName)+"-Gun"+dn+"-"+App.selectedDate;
  var files=[],count=0,titleSeen={};
  sorted.forEach(function(it){
    normalizeItem(it);
    // dosya adi: önce lokasyon (job), sonra iş başlığı
    var base=fileSafe([it.job,it.title].filter(function(x){return x&&x.trim();}).join(" - "));
    // ayni ad birden fazlaysa numarala
    titleSeen[base]=(titleSeen[base]||0)+1;
    var titleSuffix=titleSeen[base]>1?("-"+titleSeen[base]):"";
    var photoNo=0;var multi=(it.entries||[]).length>1;
    (it.entries||[]).forEach(function(en,ei){
      (en.photos||[]).forEach(function(id){
        var data=photoData(id);if(!data)return;
        var b64=(data.split(",")[1])||"";if(!b64)return;
        photoNo++;
        var stageTag=multi?("-asama"+(ei+1)):"";
        var name=folder+"/"+base+titleSuffix+stageTag+"-"+photoNo+".jpg";
        files.push({name:name,data:b64ToBytes(b64)});
        count++;
      });
    });
  });
  if(!count){toast("Bu günde fotoğraf yok");return;}
  try{
    var blob=makeZip(files);
    downloadBlob(folder+"-Fotograflar.zip",blob);
    toast(count+" fotoğraf ZIP olarak indirildi");
  }catch(e){toast("Arşiv oluşturulamadı");}
}

function addPhotos(fileList,entryIdx){
  var arr=Array.prototype.slice.call(fileList||[]).filter(function(f){return f.type?f.type.indexOf("image/")===0:true;});
  if(!arr.length)return;
  if(entryIdx==null)entryIdx=0;
  App.editor.busy=entryIdx;remountEditor();
  var added=[],failed=0,chain=Promise.resolve();
  var heicCount=0;
  arr.forEach(function(f){chain=chain.then(function(){return compressImage(f).then(function(res){
    if(res&&res.data)added.push({id:genId(),data:res.data});
    else{failed++;if(res&&res.reason==="heic")heicCount++;}
  }).catch(function(){failed++;});});});
  chain.then(function(){
    if(App.editor){App.editor.busy=-1;var en=App.editor.draft.entries[entryIdx];if(en)en.photos=en.photos.concat(added);remountEditor();}
    if(heicCount)toast(heicCount+" foto HEIC/HEIF — Kamera ayarlarından \"yüksek verimli görüntü\"yü kapatın");
    else if(failed&&added.length)toast(added.length+" eklendi · "+failed+" okunamadı");
    else if(failed)toast(failed+" dosya okunamadı — JPEG/PNG deneyin");
    else toast(added.length+" fotoğraf eklendi");
  });
}

/* ============================ Detay overlay ============================ */
// Lokasyon Düzenle: bir lokasyondaki tüm işleri iş-editörü tarzında düzenleme
// Aşama durumlarından iş durumunu türet: hepsi tamam->tamam, biri devam/started->o, hepsi soon->soon, vb.
// İlerleme aşamalardan hesaplanır: tamamlanan aşama tam, devam eden yarım puan
function itemProgressPct(it){
  var ens=(it.entries||[]).filter(function(e){return (e.status||"devam")!=="soon";});
  if(!ens.length)return 0;
  var done=0,half=0;
  ens.forEach(function(e){
    var st_=e.status||"devam";
    if(st_==="tamam")done++;
    else if(st_==="devam")half++;
  });
  return Math.max(0,Math.min(100,Math.round((done+half*0.5)/ens.length*100)));
}
function deriveItemStatus(it){
  var ens=(it.entries||[]).filter(function(e){return e.status!=="soon";}); // soon'ları sayma
  if(!ens.length){
    // sadece soon aşamalar varsa soon, hiç aşama yoksa mevcut durumu koru
    if((it.entries||[]).length&&(it.entries||[]).every(function(e){return e.status==="soon";}))return "soon";
    return it.status||"planlandi";
  }
  if(ens.every(function(e){return e.status==="tamam";}))return "tamam";
  // Aktif iş, beklemedeki aşamadan önce gelir: yalnızca HEPSİ beklemedeyse iş "bekleme" sayılır
  if(ens.some(function(e){return e.status==="devam";}))return "devam";
  if(ens.some(function(e){return e.status==="started";}))return "started";
  if(ens.every(function(e){return e.status==="bekleme";}))return "bekleme";
  if(ens.some(function(e){return e.status==="bekleme";}))return "devam"; // kısmen beklemede, kısmen tamam -> sürüyor
  return "planlandi";
}
// Sadece bir işin fotoğraflarını içeren Word dosyası üretir (başka belgeye topluca kopyalamak için)
function exportItemPhotosDocx(it){
  var _n3=itemPhotoIds(it);
  if(_n3.some(function(x){return !photoMem[x];})){toast("Fotoğraflar hazırlanıyor…");ensurePhotos(_n3).then(function(){exportItemPhotosDocx(it);});return;}
  var ids=itemPhotoIds(it);
  if(!ids.length){toast("Bu işte fotoğraf yok");return;}
  var map={};ids.forEach(function(id){var v=photoData(id);if(v)map[id]=v;});
  var use=ids.filter(function(id){return map[id];});
  if(!use.length){toast("Fotoğraflar yüklenemedi");return;}
  toast("Hazırlanıyor…");
  var sizeMap={},chain=Promise.resolve();
  use.forEach(function(id){chain=chain.then(function(){return loadDims(map[id]).then(function(dm){sizeMap[id]=dm;});});});
  chain.then(function(){
    var dx=dxNew();
    dx.body+=dxPhotos(dx,use,map,sizeMap);

    downloadDocx(dashName(nm)+"-Fotograflar.docx",dx);
    toast(use.length+" fotoğraf Word dosyasına aktarıldı");
  }).catch(function(){toast("Oluşturulamadı");});
}

// Handler'ları bağla. onPick(key,value) seçim/yazım olduğunda çağrılır.
function bindCombos(ov,onPick){
  function listOf(key){return ov.querySelector('.cbx-list[data-cbx-list="'+key+'"]');}
  function closeAll(except){
    Array.prototype.forEach.call(ov.querySelectorAll(".cbx-list"),function(l){
      if(l!==except)l.style.display="none";
    });
  }
  function filter(key,q,openIfHit){
    var list=listOf(key);if(!list)return;
    var qq=(q||"").trim().toLocaleLowerCase("tr");var any=false;
    Array.prototype.forEach.call(list.querySelectorAll(".cbx-opt"),function(o){
      var v=(o.getAttribute("data-val")||"").toLocaleLowerCase("tr");
      var show=!qq||v.indexOf(qq)>=0;
      o.style.display=show?"":"none";if(show)any=true;
    });
    var none=list.querySelector(".cbx-empty");if(none)none.style.display=any?"none":"";
    if(openIfHit)list.style.display=(qq&&!any)?"none":"";
  }
  Array.prototype.forEach.call(ov.querySelectorAll(".cbx-in"),function(inp){
    var key=inp.getAttribute("data-cbx-in");
    inp.oninput=function(){onPick(key,inp.value);filter(key,inp.value,true);};
    inp.onfocus=function(){closeAll(listOf(key));filter(key,inp.value,true);};
  });
  Array.prototype.forEach.call(ov.querySelectorAll(".cbx-btn"),function(b){
    b.onclick=function(ev){
      ev.preventDefault();ev.stopPropagation();
      var key=b.getAttribute("data-cbx-btn");var list=listOf(key);if(!list)return;
      var open=list.style.display!=="none";
      closeAll();
      if(!open){filter(key,"",false);list.style.display="";}
    };
  });
  Array.prototype.forEach.call(ov.querySelectorAll(".cbx-opt"),function(o){
    o.onclick=function(){
      var key=o.getAttribute("data-cbx-opt");var val=o.getAttribute("data-val");
      var inp=ov.querySelector('.cbx-in[data-cbx-in="'+key+'"]');
      if(inp)inp.value=val;
      onPick(key,val);
      Array.prototype.forEach.call(listOf(key).querySelectorAll(".cbx-opt"),function(x){x.classList.remove("sel");});
      o.classList.add("sel");
      listOf(key).style.display="none";
    };
  });
  ov.addEventListener("click",function(ev){
    if(!ev.target.closest||!ev.target.closest(".cbx"))closeAll();
  });
}
// Duruma göre açıklamanın sonuna Türkçe ek yazar (varsa eskisini değiştirir)
var STATUS_SUFFIX={started:"başladı",devam:"devam ediyor",planlandi:"planlandı",tamam:"tamamlandı",soon:"yapılacak",bekleme:"beklemede"};
function applyStatusSuffix(desc,status){
  var suf=STATUS_SUFFIX[status];if(!suf)return desc||"";
  var t=(desc||"").trim();
  // önceki durum ekini temizle
  var all=[];for(var k in STATUS_SUFFIX){if(STATUS_SUFFIX.hasOwnProperty(k))all.push(STATUS_SUFFIX[k]);}
  var changed=true;
  while(changed){
    changed=false;
    for(var i=0;i<all.length;i++){
      var re=new RegExp("[\\s,;]*"+all[i].replace(/ /g,"\\s+")+"\\s*[.!]?\\s*$","i");
      if(re.test(t)){t=t.replace(re,"").trim();changed=true;}
    }
  }
  if(!t)return suf.charAt(0).toLocaleUpperCase("tr-TR")+suf.slice(1)+".";
  t=t.replace(/[.!]+\s*$/,"");
  return t+" "+suf+".";
}

    if(missing.length){toast("Fotoğraf verisi hazır değil, biraz sonra tekrar deneyin");return null;}
    fe.photos=(fe.photos||[]).filter(function(p){return pm.ids.indexOf(p.id)<0;});

// Izgarada dokunarak seçme + parmağı sürükleyerek toplu seçme
function bindGridSelect(grid,attr,getSel,setSel){
  if(!grid)return;
  var dragging=false,mode=true,touched={},moved=false,sx=0,sy=0,startCell=null,lastTouch=0;
  var armed=false,decided=false,lpTimer=null;   // armed: toplu seçim başladı, decided: yön belirlendi
  function cellAt(x,y){
    var el=document.elementFromPoint(x,y);
    while(el&&el!==grid){if(el.getAttribute&&el.getAttribute(attr))return el;el=el.parentNode;}
    return null;
  }
  function apply(cell){
    if(!cell)return;
    var pid=cell.getAttribute(attr);
    if(touched[pid])return;
    touched[pid]=true;
    if(getSel(pid)!==mode)setSel(pid,mode);
  }
  function clearLP(){if(lpTimer){clearTimeout(lpTimer);lpTimer=null;}}
  function arm(){
    if(armed||!startCell)return;
    armed=true;decided=true;moved=true;
    apply(startCell);                       // toplu seçim ilk kareden başlar
    if(grid.style)grid.style.touchAction="none";
  }
  function start(x,y,el,isTouch){
    if(el&&el.closest&&el.closest(".zoom"))return false;
    var c=cellAt(x,y);if(!c)return false;
    dragging=true;moved=false;armed=false;decided=false;touched={};sx=x;sy=y;startCell=c;
    mode=!getSel(c.getAttribute(attr));
    clearLP();
    // Basılı tutunca (350ms) toplu seçim modu açılır — dikey de sürükleyebilirsin
    if(isTouch)lpTimer=setTimeout(arm,350);
    return true;
  }
  function move(x,y,ev){
    if(!dragging)return;
    var dx=Math.abs(x-sx),dy=Math.abs(y-sy);
    if(!armed){
      if(!decided&&(dx>10||dy>10)){
        decided=true;clearLP();
        if(dy>dx){                          // dikey hareket = sayfayı kaydır, seçme
          dragging=false;startCell=null;return;
        }
        arm();                              // yatay hareket = toplu seçim
      }
      if(!armed)return;
    }
    if(ev&&ev.cancelable)ev.preventDefault();
    apply(cellAt(x,y));
  }
  function end(){
    clearLP();
    if(grid.style)grid.style.touchAction="";
    if(!dragging)return;
    if(!armed&&!moved&&startCell){var pid=startCell.getAttribute(attr);setSel(pid,!getSel(pid));}
    dragging=false;moved=false;armed=false;decided=false;touched={};startCell=null;
  }
  grid.addEventListener("touchstart",function(e){lastTouch=Date.now();var t=e.touches[0];start(t.clientX,t.clientY,e.target,true);},{passive:true});
  grid.addEventListener("touchmove",function(e){lastTouch=Date.now();var t=e.touches[0];move(t.clientX,t.clientY,e);},{passive:false});
  grid.addEventListener("touchend",function(){lastTouch=Date.now();end();});
  grid.addEventListener("touchcancel",function(){lastTouch=Date.now();end();});
  // Fare (bilgisayar) — dokunmatik sonrası gelen taklit olayları yok say
  grid.addEventListener("mousedown",function(e){
    if(Date.now()-lastTouch<800)return;
    if(start(e.clientX,e.clientY,e.target,false)){
      e.preventDefault();
      var up=function(){end();document.removeEventListener("mouseup",up);};
      document.addEventListener("mouseup",up);
    }
  });
  grid.addEventListener("mousemove",function(e){if(Date.now()-lastTouch<800)return;if(dragging&&!armed&&!decided&&(Math.abs(e.clientX-sx)>6||Math.abs(e.clientY-sy)>6))arm();move(e.clientX,e.clientY,null);});
}

  var auto=getAutoLand();   // dik fotoğrafı otomatik yatıra çevir
  var okCount=0,pendingIds=[],fpQueue=[];
  // Sayacı TAM ÇİZİM yapmadan güncelle (300 fotoğrafta belleği korur)
  function paintProg(){
    var pr=App.pool&&App.pool.prog;if(!pr)return;
    var el=document.getElementById("pl-cnt");
    if(el)el.textContent=pr.done+" / "+pr.total;
    var bf=document.getElementById("pl-bar-fill");
    if(bf)bf.style.width=(pr.total?Math.round(pr.done*100/pr.total):0)+"%";
  }
  var writeFail=false;
  function flushPool(){
    if(!pendingIds.length)return;
    var okw=setPool(date,getPool(date).concat(pendingIds));   // toplu yaz (her fotoğrafta değil)
    if(okw===false)writeFail=true;
    pendingIds=[];
  }
  function one(file){
    return compressImage(file,1000,0.7,{autoLandscape:auto}).then(function(res){
      if(res&&res.data){
        var nid=genId();
        return savePhoto(nid,res.data).then(function(){
          setFotoTime(nid,file.lastModified||Date.now());   // çekim zamanı (gruplama için)
          pendingIds.push(nid);fpQueue.push(nid);okCount++;
        });
      }
      var key="f"+Date.now()+"_"+Math.random().toString(36).slice(2,7);
      App._poolFailedFiles[key]=file;
      if(App.pool)App.pool.failed.push({key:key,name:file.name||"fotoğraf",reason:(res&&res.reason)||"decode",size:file.size||0});
    }).catch(function(){
      var key2="f"+Date.now()+"_"+Math.random().toString(36).slice(2,7);
      App._poolFailedFiles[key2]=file;
      if(App.pool)App.pool.failed.push({key:key2,name:file.name||"fotoğraf",reason:"decode",size:file.size||0});
    }).then(function(){
      if(App.pool&&App.pool.prog)App.pool.prog.done++;
      paintProg();                                    // sadece sayaç güncellenir
    });
  }
  // 3'erli gruplar hâlinde işle
  var i=0;
  function nextBatch(){
    if(i>=files.length){
      flushPool();
      // parmak izlerini arka planda hesapla (öneri için), arayüzü bekletme
      var fq=Promise.resolve();
      fpQueue.forEach(function(id){fq=fq.then(function(){return getFp(id);});});
      fq.then(function(){if(App.pool)render();});
      if(App.pool){App.pool.busy=false;App.pool.prog=null;}
      render();
      var fc=(App.pool&&App.pool.failed)?App.pool.failed.length:0;
      if(writeFail)toast("⚠ Depolama dolu — bazı fotoğraflar kaydedilemedi");
      else if(fc)toast(okCount+" eklendi · "+fc+" eklenemedi (listede)");
      else toast(okCount+" fotoğraf havuza eklendi");
      return;
    }
    var batch=files.slice(i,i+3);i+=3;
    Promise.all(batch.map(one)).then(function(){
      if(pendingIds.length>=12)flushPool();          // ara ara kaydet (veri kaybını önler)
      setTimeout(nextBatch,0);                        // tarayıcıya nefes aldır
    });
  }
  nextBatch();
}
// Bir fotoğrafı 90° çevirir (dataURL -> dataURL)
function rotateDataUrl(dataUrl,deg){
  return new Promise(function(resolve){
    try{
      var img=new Image();
      img.onload=function(){
        try{
          var w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
          var cv=document.createElement("canvas");
          var rad=(deg||90)*Math.PI/180;
          var swap=((deg||90)/90)%2===1;
          cv.width=swap?h:w;cv.height=swap?w:h;
          var c=cv.getContext("2d");
          c.fillStyle="#fff";c.fillRect(0,0,cv.width,cv.height);
          c.translate(cv.width/2,cv.height/2);c.rotate(rad);
          c.drawImage(img,-w/2,-h/2);
          var out=null;
          [0.72,0.6,0.45].forEach(function(q){if(!out){try{var d=cv.toDataURL("image/jpeg",q);if(d&&d.length>100)out=d;}catch(e){}}});
          resolve(out);
        }catch(e){resolve(null);}
      };
      img.onerror=function(){resolve(null);};
      img.src=dataUrl;
    }catch(e){resolve(null);}
  });
}

  return out;

      if(App._photoSel&&App._photoSel[ei])delete App._photoSel[ei][pid];
    }
    // listeden çıkar, kalan varsa sıradakini göster
    lst.splice(li,1);

    if(!lst.length){App.lightbox=null;App.lbList=null;App.lbIdx=null;App.lbSelKind=null;App.lbEi=null;render();toast("Fotoğraf silindi");return;}
    if(li>=lst.length)li=lst.length-1;
    App.lbIdx=li;App.lightbox=lst[li].url;
    render();toast("Fotoğraf silindi");
  };
  function goTo(n){
    if(!many)return;
    if(n<0)n=lst.length-1;if(n>=lst.length)n=0;
    li=n;App.lbIdx=n;App.lightbox=lst[n].url;
    // Tam yeniden çizim YOK: sadece resmi ve alt yazıyı güncelle (hızlı geçiş)
    reset();

    if(capEl)capEl.innerHTML='<div style="opacity:.95">'+esc(lst[n].cap||"")+'</div><div style="opacity:.65;margin-top:3px;font-size:11.5px">'+(n+1)+' / '+lst.length+'</div>';
    if(typeof paintSel==="function")paintSel();
  }
  if(many){
    ov.querySelector("#lb-prev").onclick=function(e){e.stopPropagation();goTo(li-1);};
    ov.querySelector("#lb-next").onclick=function(e){e.stopPropagation();goTo(li+1);};
    // klavye ile gezinme (bilgisayar)
    var keyH=function(e){if(e.key==="ArrowLeft")goTo(li-1);else if(e.key==="ArrowRight")goTo(li+1);else if(e.key==="Escape"){App.lightbox=null;App.lbList=null;App.lbIdx=null;render();}};
    document.addEventListener("keydown",keyH);
    ov._cleanup=function(){document.removeEventListener("keydown",keyH);};
  }
  // arka plana dokununca kapat (sadece zoom yokken)
  ov.addEventListener("click",function(e){if(e.target===ov&&scale<=1.02){App.lightbox=null;render();}});
  // çift dokunma: yakınlaştır/sıfırla
  var lastTap=0;
  img.addEventListener("click",function(e){e.stopPropagation();var now=Date.now();if(now-lastTap<300){if(scale>1.02)reset();else{scale=2.5;apply();}}lastTap=now;});
  // pinch + pan (pointer events)
  img.addEventListener("pointerdown",function(e){img.setPointerCapture(e.pointerId);pts[e.pointerId]={x:e.clientX,y:e.clientY};var ids=Object.keys(pts);
    if(ids.length===2){var a=pts[ids[0]],b=pts[ids[1]];startD=Math.hypot(a.x-b.x,a.y-b.y);startScale=scale;}
    else if(ids.length===1&&scale>1.02){panning=true;lastX=e.clientX;lastY=e.clientY;}
  });
  img.addEventListener("pointermove",function(e){if(!pts[e.pointerId])return;pts[e.pointerId]={x:e.clientX,y:e.clientY};var ids=Object.keys(pts);
    if(ids.length===2){var a=pts[ids[0]],b=pts[ids[1]];var d=Math.hypot(a.x-b.x,a.y-b.y);if(startD>0){scale=Math.max(1,Math.min(5,startScale*(d/startD)));apply();}}
    else if(panning&&ids.length===1){tx+=e.clientX-lastX;ty+=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;apply();}
  });
  // yakınlaştırılmamışken sağa/sola kaydırarak önceki/sonraki fotoğraf
  var swStartX=0,swStartY=0,swActive=false;
  img.addEventListener("pointerdown",function(e){if(scale<=1.02&&Object.keys(pts).length===1){swActive=true;swStartX=e.clientX;swStartY=e.clientY;}});
  function ptUp(e){
    if(swActive&&many&&scale<=1.02){
      var dx=e.clientX-swStartX,dy=e.clientY-swStartY;
      if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.4){
        delete pts[e.pointerId];swActive=false;panning=false;
        goTo(dx<0?li+1:li-1);return;
      }
    }
    swActive=false;
    delete pts[e.pointerId];if(Object.keys(pts).length<2)startD=0;if(Object.keys(pts).length===0){panning=false;if(scale<=1.02)reset();}}
  img.addEventListener("pointerup",ptUp);img.addEventListener("pointercancel",ptUp);
  // masaüstü tekerlek zoom
  ov.addEventListener("wheel",function(e){e.preventDefault();scale=Math.max(1,Math.min(5,scale-e.deltaY*0.002));if(scale<=1.02)reset();else apply();},{passive:false});
  setTimeout(function(){var hint=ov.querySelector("#lb-hint");if(hint)hint.style.opacity="0";hint&&(hint.style.transition="opacity .5s");},1800);
}

/* ============================ Ayarlar overlay ============================ */
/* ---- Arşiv paketi: seçilen aralıkta BİTEN işleri fotoğraflarıyla dışa aktarır ----
   Her iş bir klasör: fotoğraflar + bilgi.txt (lokasyon, iş, tarih aralığı, aşamalar, cümle, notlar).
   index.csv ve index.json: ileride büyük fotoğraf arşivine aktarmak için makine okunur liste.
   Telefon belleği için en fazla ARCH_PART fotoğraflık parçalar halinde iner. */
var ARCH_PART=80;
function safeFileName(t){return String(t||"").replace(/[\\\/:*?"<>|]+/g," ").replace(/\s+/g," ").trim().slice(0,70)||"is";}
function archiveJobs(fromISO,toISO){
  var data=collectPeriod(fromISO,toISO);
  var jobs=data.chains.filter(function(c){return periodKind(c,fromISO)==="completed";});
  jobs.forEach(function(c,i){c._no=i+1;});
  return jobs;
}
function archiveParts(jobs){
  var parts=[],cur=[],n=0;
  jobs.forEach(function(c){
    var k=c.photoIds.length;
    if(cur.length&&n+k>ARCH_PART){parts.push(cur);cur=[];n=0;}
    cur.push(c);n+=k;
  });
  if(cur.length)parts.push(cur);
  return parts;
}
function csvCell(v){v=String(v==null?"":v);return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function archiveInfo(c,fromISO){
  var it=c.lastItem||{};
  var start=chainStartDate(it.chainId,c.first)||c.first,end=periodDoneDate(c)||c.last;
  var stages=(it.entries||[]).map(function(en){var nm=(en.name||"").trim();if(!nm)return null;var st_=en.status||"devam";return nm+" — "+st(st_).label+(st_==="tamam"&&en.doneDate?" ("+en.doneDate+")":"");}).filter(Boolean);
  return {no:c._no,location:c.job||"",work:c.title||"",department:c.bolum||"",start:start,end:end,
    days:c.records.length,photos:c.photoIds.length,stages:stages,
    sentence:periodSentence(c,"completed",fromISO),notes:c.notes.slice()};
}
function downloadArchivePart(fromISO,toISO,partIdx){
  var jobs=archiveJobs(fromISO,toISO),parts=archiveParts(jobs);
  if(!parts.length){toast("Bu aralıkta biten iş yok");return Promise.resolve({parts:0});}
  var part=parts[Math.min(partIdx,parts.length-1)];
  var files=[],index=[],chain=Promise.resolve();
  part.forEach(function(c){
    var info=archiveInfo(c,fromISO);index.push(info);
    var folder=("0"+c._no).slice(-2)+"_"+safeFileName([c.job,c.title].filter(Boolean).join(" - "))+"/";
    var txt=[info.location+" — "+info.work,"",
      "Dates: "+info.start+" – "+info.end+"  ("+info.days+" reporting days)",
      info.department?"Department: "+info.department:null,"",
      info.sentence,"",
      info.stages.length?"Stages:\n- "+info.stages.join("\n- "):null,
      info.notes.length?"\nNotes:\n- "+info.notes.join("\n- "):null].filter(function(x){return x!==null;}).join("\n");
    files.push({name:folder+"bilgi.txt",data:strToUtf8(txt)});
    c.photoIds.forEach(function(id,pi){chain=chain.then(function(){return idbGetOne(id).then(function(v){
      var dp=dataUrlParts(v);if(!dp)return;
      try{files.push({name:folder+("0"+(pi+1)).slice(-2)+"."+dp.ext,data:b64ToBytes(dp.b64)});}catch(e){}
    });});});
  });
  return chain.then(function(){
    var head=["No","Location","Work","Department","Start","End","Reporting days","Photos","Sentence"];
    var rows=[head.join(";")].concat(index.map(function(r){return [r.no,r.location,r.work,r.department,r.start,r.end,r.days,r.photos,r.sentence].map(csvCell).join(";");}));
    files.push({name:"index.csv",data:strToUtf8("﻿"+rows.join("\r\n"))});
    var p=App.project||{};
    files.push({name:"index.json",data:strToUtf8(JSON.stringify({ship:p.shipName||"",yard:p.yard||"",from:fromISO,to:toISO,part:partIdx+1,parts:parts.length,jobs:index},null,1))});
    var nm="GemiTakip_Arsiv_"+dashName(p.shipName||"Gemi")+"_"+fromISO+"_"+toISO+(parts.length>1?"_parca"+(partIdx+1)+"of"+parts.length:"")+".zip";
    downloadBlob(nm,makeZip(files,"application/zip"));
    toast(part.length+" iş, "+part.reduce(function(a,c){return a+c.photoIds.length;},0)+" fotoğraf indirildi"+(parts.length>1?" · parça "+(partIdx+1)+"/"+parts.length:""));
    return {parts:parts.length,done:partIdx+1};
  });
}

// Raporu oluşturmadan önce gözden kaçması muhtemel eksikleri toplar.

// Bugün saat 14'ten önce "fotoğrafsız" sayılmaz (fotoğraflar gün içinde eklenir), sadece listede bilgi olarak durur.
var CK_PHOTO_HOUR=14;
function reportChecklist(dateISO,items,now){
  now=now||new Date();
  var out={nophoto:[],carried:[],notomorrow:[],poolCount:0};
  (items||[]).forEach(function(it){
    normalizeItem(it);
    var kind=itemNarrativeKind(it,dateISO);
    var written=(kind==="commenced"||kind==="ongoing"||kind==="completed");
    if(written&&itemPhotoCount(it)===0)out.nophoto.push(it);
    if(it.carried===true)out.carried.push(it);
    if((kind==="commenced"||kind==="ongoing")&&!(it.tomorrow||"").trim())out.notomorrow.push(it);
  });
  try{out.poolCount=(getPool(dateISO)||[]).length;}catch(e){out.poolCount=0;}
  out.photoDeferred=(dateISO===todayISO()&&now.getHours()<CK_PHOTO_HOUR);
  var jobs={};
  if(!out.photoDeferred)out.nophoto.forEach(function(it){jobs[it.id]=1;});
  out.carried.forEach(function(it){jobs[it.id]=1;});
  out.notomorrow.forEach(function(it){jobs[it.id]=1;});
  out.jobCount=Object.keys(jobs).length;
  out.total=out.jobCount+(out.poolCount?1:0);
  return out;
}

/* tarih seçici (mini) */
function pickerHTML(value,pk){
  var weeks=buildWeeks(pk.y,pk.m);
  var label=new Date(pk.y,pk.m,1).toLocaleDateString("tr-TR",{month:"long",year:"numeric"});
  var h='<div class="mcp"><div class="mcp-head"><div class="l">SEÇİLEN TARİH</div><div class="v">'+(value?fmtLong(value):"—")+'</div></div><div class="mcp-nav"><button type="button" data-pkprev="1">'+I("left")+'</button><span class="m">'+label+'</span><button type="button" data-pknext="1">'+I("right")+'</button></div><div class="mcp-dow"><div>PT</div><div>SA</div><div>ÇA</div><div>PE</div><div>CU</div><div>CT</div><div>PA</div></div><div class="mcp-grid">';
  weeks.forEach(function(row){row.forEach(function(d){
    var di=iso(d),inMonth=d.getMonth()===pk.m,sel=di===value,isToday=di===todayISO();
    var cls=!inMonth?"out":(sel?"sel":(isToday?"today":""));
    h+='<button type="button" class="'+cls+'" data-pkday="'+di+'">'+d.getDate()+'</button>';
  });});
  h+='</div></div>';
  return h;
}

/* ============================ Yedekleme ============================ */
/* ---- Yedek hatırlatması: veri tek telefonda durduğu için haftada bir uyarır ---- */
var BACKUP_KEY="gemitakip_son_yedek_v1";
function getLastBackup(){var v=sGet(BACKUP_KEY);return v?Number(v)||0:0;}
function setLastBackup(){try{sSet(BACKUP_KEY,String(Date.now()));}catch(e){}}
function backupAgeDays(){var t=getLastBackup();if(!t)return null;return Math.floor((Date.now()-t)/86400000);}
// Kaç gün geçtiyse uyarılsın (hiç alınmadıysa ilk işten sonra uyarır)
function backupDue(){
  var d=backupAgeDays();
  if(d===null)return (App.index||[]).length>0;
  return d>=7;
}
/* ===================== YEDEKLEME =====================
   Veri yedeği: tüm uygulama anahtarları (iş şablonları dahil), fotoğrafsız — küçük ve hızlı.
   Fotoğraf yedeği: ZIP parçaları halinde, sadece daha önce yedeklenmemiş fotoğraflar.
   Böylece yüzlerce fotoğraf aynı anda hafızaya alınmaz, telefon çökmez. */
var BACKUP_PHOTOS_KEY="gemitakip_yedekli_fotolar_v1";
var BACKUP_PART=60;
var AUTOLAND_KEY="gemitakip_otoyatay_v1";   // dik fotoğrafı yatıra çevir (gemiye değil uygulamaya ait tercih)
function getAutoLand(){var v=getJSON(AUTOLAND_KEY,null);if(v===null){v=getJSON("tersane_autoland",true)!==false;}return v!==false;}
function setAutoLand(v){setJSON(AUTOLAND_KEY,!!v);}
function isAppKey(k){return !!k&&(k.indexOf("tersane_")===0||k.indexOf("gemitakip_")===0)&&k.indexOf("tersane_foto_")!==0;}
function doBackupData(){
  try{
    var meta={_app:"gemi-tersane-takip",_v:3,_date:new Date().toISOString(),keys:{}};
    for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(isAppKey(k))meta.keys[k]=localStorage.getItem(k);}
    // gemi arşivleri artık IndexedDB'de: yedeğe eski anahtar adıyla eklenir (eski sürümler de okuyabilsin)
    Object.keys(SLOT_CACHE).forEach(function(id){var k2=slotDataKey(id);if(!meta.keys[k2])meta.keys[k2]=JSON.stringify(SLOT_CACHE[id]);});
    var p=getJSON(PROJECT_KEY,null)||{};
    var nm=dashName(p.shipName||"Gemi");
    // Paylaşım menüsü açılır: "Drive'a kaydet" ile GemiTakip Yedek klasörüne. Paylaşım yoksa indirilir.
    // Chrome paylaşım menüsü .json dosyasını kabul etmiyor; aynı içerik .txt olarak gider, geri yükleme ikisini de okur
    var fn="GemiTakip_Veri_"+nm+"_"+todayISO()+".txt";
    return shareOrDownload(fn,new Blob([JSON.stringify(meta)],{type:"text/plain"}),fn).then(function(r){
      if(r==="cancel")return false;
      setLastBackup();
      if(r==="shared")toast("Veri yedeği gönderildi");
      return true;
    });
  }catch(e){toast("Veri yedeği alınamadı");return Promise.resolve(false);}
}
// geriye uyum: eski çağrılar veri yedeği alır
function doBackup(){return doBackupData();}
function loadBackedPhotos(){var m=getJSON(BACKUP_PHOTOS_KEY,{});return (m&&typeof m==="object"&&!Array.isArray(m))?m:{};}
function idbListIds(){
  return idbReady().then(function(){return new Promise(function(resolve){
    if(!IDB){resolve([]);return;}
    try{
      var store=IDB.transaction("fotolar","readonly").objectStore("fotolar");
      if(store.getAllKeys){var rq=store.getAllKeys();rq.onsuccess=function(){resolve((rq.result||[]).map(String));};rq.onerror=function(){resolve([]);};return;}
      var out=[],cur=store.openCursor();
      cur.onsuccess=function(ev){var c=ev.target.result;if(c){out.push(String(c.key));c.continue();}else resolve(out);};
      cur.onerror=function(){resolve(out);};
    }catch(e){resolve([]);}
  });});
}
function photoBackupStatus(){
  return idbListIds().then(function(ids){
    var done=loadBackedPhotos();
    var pending=ids.filter(function(id){return !done[id];});
    return {total:ids.length,pending:pending};
  });
}
function dataUrlParts(v){
  var m=/^data:(image\/[a-z0-9.+-]+);base64,(.*)$/i.exec(String(v||""));
  if(!m)return null;
  var ext={"image/jpeg":"jpg","image/jpg":"jpg","image/png":"png","image/webp":"webp","image/gif":"gif"}[m[1].toLowerCase()]||"jpg";
  return {mime:m[1],ext:ext,b64:m[2]};
}
// Sıradaki yedeklenmemiş fotoğraf parçasını ZIP olarak hazırlar. Döner: {name, blob, ids, count, remaining}
// Paylaşım menüsü ancak bir dokunuşun hemen ardından açılabildiği için gönderme ayrı bir dokunuşla yapılır.
function preparePhotoPart(){
  return photoBackupStatus().then(function(st){
    if(!st.pending.length)return null;
    var part=st.pending.slice(0,BACKUP_PART),files=[],chain=Promise.resolve();
    part.forEach(function(id){chain=chain.then(function(){return idbGetOne(id).then(function(v){
      var dp=dataUrlParts(v);if(!dp)return;
      try{files.push({name:id+"."+dp.ext,data:b64ToBytes(dp.b64)});}catch(e){}
    });});});
    return chain.then(function(){
      var p=getJSON(PROJECT_KEY,null)||{};
      var stamp=new Date();var hh=("0"+stamp.getHours()).slice(-2)+("0"+stamp.getMinutes()).slice(-2)+("0"+stamp.getSeconds()).slice(-2);
      return {name:"GemiTakip_Foto_"+dashName(p.shipName||"Gemi")+"_"+todayISO()+"_"+hh+".zip",
              blob:files.length?makeZip(files,"application/zip"):null,ids:part,count:files.length,remaining:st.pending.length-part.length};
    });
  });
}
function sendPhotoPart(pp){
  function mark(){var done=loadBackedPhotos();pp.ids.forEach(function(id){done[id]=1;});setJSON(BACKUP_PHOTOS_KEY,done);}
  if(!pp.blob){mark();return Promise.resolve(true);}
  return shareOrDownload(pp.name,pp.blob,pp.name).then(function(r){
    if(r==="cancel")return false;
    mark();toast(pp.count+" fotoğraf gönderildi"+(pp.remaining?" · "+pp.remaining+" kaldı":" · hepsi yedekli"));
    return true;
  });
}

var STORAGE_PERSIST=null;
function requestPersist(){
  try{
    if(!navigator.storage||!navigator.storage.persist)return;
    navigator.storage.persisted().then(function(p){
      if(p){STORAGE_PERSIST=true;return;}
      return navigator.storage.persist().then(function(g){STORAGE_PERSIST=!!g;});
    }).catch(function(){});
  }catch(e){}
}

/* ===================== Google Drive eşitleme =====================
   Asıl kayıt Drive'da durur: her fotoğraf ve veri anlık görüntüsü kullanıcının kendi Drive'ındaki
   "GemiTakip" klasörüne yazılır. Telefon depoyu silse bile eksik fotoğraflar Drive'dan geri indirilir.
   Yalnızca bu uygulamanın oluşturduğu dosyalara erişilir (drive.file izni). İnternet yokken kuyrukta bekler. */
var DRIVE_KEY="gemitakip_drive_v1", DRIVE_UP_KEY="gemitakip_drive_yuklenen_v1";
var DRIVE_API="https://www.googleapis.com/drive/v3", DRIVE_UPLOAD="https://www.googleapis.com/upload/drive/v3";

var DRIVE_DEFAULT_CLIENT="964276538283-itcrffiqhcmumtdkl92uq46097csf93t.apps.googleusercontent.com";
function driveCfg(){var c=getJSON(DRIVE_KEY,null);c=(c&&typeof c==="object")?c:{};if(!c.clientId&&!c.cidCleared&&/github\.io$/.test(location.hostname))c.clientId=DRIVE_DEFAULT_CLIENT;return c;}
function driveSaveCfg(c){setJSON(DRIVE_KEY,c);}

function driveEnabled(){var c=driveCfg();return !!(c.clientId&&c.enabled);}

function driveLoadGis(){
  if(window.google&&google.accounts&&google.accounts.oauth2)return Promise.resolve();
  return new Promise(function(resolve,reject){
    var s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.async=true;
